name: Diagnose LunarKnight v2 (tanpa build penuh)

# Taruh di .github/workflows/diagnose-lunarknight.yml
# Taruh juga di root repo kamu (tanpa folder):
#   susfs_patch_to_4_19.patch
#   susfs_inline_hook_patches.sh
# Hasil: Artifact "diagnose-report" (report.txt) dan "ksun-legacy-source" (kode KernelSU-Next legacy).

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Paket build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev ccache cpio zip python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lz4 xz-utils

      - name: Clone kernel LunarKnight (branch back)
        run: |
          git clone --depth=1 -b back https://github.com/IndraSenzZ/LunarKnight.git lk
          { echo "== Versi =="; head -n 5 lk/Makefile; echo "localversion-st: $(cat lk/localversion-st)";
            echo "== defconfig whyred =="; find lk/arch/arm64/configs -iname '*whyred*'; } | tee -a report.txt

      - name: Integrasi KernelSU-Next legacy
        run: |
          cd lk
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          { echo "== Struktur KernelSU =="; ls -la drivers/kernelsu; ls -d KernelSU* ; } | tee -a ../report.txt
          KS=$(readlink -f drivers/kernelsu)
          cd "$KS/.." && tar czf "$GITHUB_WORKSPACE/ksun-legacy-source.tgz" --exclude=.git . 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/lk" && git -C KernelSU log -1 --format='KSUN commit: %H %s' 2>/dev/null | tee -a ../report.txt || true

      - name: Terapkan patch SUSFS lalu hook inline (nyata, di salinan kernel)
        continue-on-error: true
        run: |
          cd lk
          if [ -f ../susfs_patch_to_4_19.patch ]; then
            echo "== patch SUSFS ==" | tee -a ../report.txt
            patch -p1 --no-backup-if-mismatch < ../susfs_patch_to_4_19.patch 2>&1 | tee -a ../report.txt
            find . -name '*.rej' | tee -a ../report.txt
          fi
          if [ -f ../susfs_inline_hook_patches.sh ]; then
            echo "== hook inline ==" | tee -a ../report.txt
            bash ../susfs_inline_hook_patches.sh 2>&1 | tee -a ../report.txt
          fi
          git status --short | tee -a ../report.txt
          git diff > ../applied.diff || true

      - name: Simbol hook yang diminta SUSFS vs yang ada di KernelSU-Next legacy
        run: |
          cd lk
          echo "== Simbol di drivers/kernelsu ==" | tee -a ../report.txt
          for s in ksu_su_compat_enabled __ksu_is_allow_uid_for_current ksu_is_allow_uid ksu_handle_execveat \
                   ksu_handle_execveat_sucompat ksu_handle_post_execveat_sucompat ksu_handle_faccessat \
                   ksu_handle_stat ksu_handle_vfs_fstat ksu_handle_sys_read ksu_handle_vfs_read \
                   ksu_is_init_rc_hook_enabled ksu_handle_input_handle_event ksu_handle_sys_reboot \
                   ksu_handle_setresuid ksu_handle_setuid ksu_hide_setprocattr setup_selinux ksu_cred \
                   is_ksu_domain; do
            printf '%-40s %s\n' "$s" "$(grep -rn --include='*.c' --include='*.h' -w "$s" drivers/kernelsu | wc -l)" | tee -a ../report.txt
          done
          echo "== Prototipe fungsi hook ==" | tee -a ../report.txt
          grep -rnE '^(int|bool|void|static int|__attribute__.*)\s*\**\s*(ksu_handle_\w+|setup_selinux|is_ksu_domain|ksu_is_allow_uid\w*)\(' drivers/kernelsu | tee -a ../report.txt || true
          echo "== Kconfig KernelSU ==" | tee -a ../report.txt
          cat drivers/kernelsu/Kconfig | tee -a ../report.txt

      - name: Uji compile objek yang disentuh patch (Neutron clang, tanpa link)
        continue-on-error: true
        run: |
          mkdir -p $HOME/neutron && cd $HOME/neutron
          bash <(curl -s https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          cd $GITHUB_WORKSPACE/lk
          export PATH=$HOME/neutron/bin:$PATH
          DEF=$(basename $(find arch/arm64/configs -iname '*whyred*' | head -n1))
          M="ARCH=arm64 O=out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $M $DEF
          cat >> out/.config <<'CFG'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CFG
          make $M olddefconfig
          make $M -j$(nproc) prepare 2>&1 | tail -n 5
          for o in fs/susfs.o fs/stat.o fs/open.o fs/exec.o fs/namei.o fs/namespace.o fs/readdir.o fs/statfs.o \
                   fs/proc/base.o fs/proc/fd.o fs/proc/task_mmu.o fs/proc_namespace.o fs/proc/cmdline.o \
                   kernel/sys.o kernel/reboot.o kernel/kallsyms.o mm/memory.o security/selinux/avc.o; do
            if make $M $o >/tmp/o.log 2>&1; then echo "OK   $o"; else echo "FAIL $o"; grep -E 'error' /tmp/o.log | head -n 8; fi
          done 2>&1 | tee -a $GITHUB_WORKSPACE/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: diagnose-report
          path: |
            report.txt
            applied.diff
      - uses: actions/upload-artifact@v4
        with:
          name: ksun-legacy-source
          path: ksun-legacy-source.tgz
