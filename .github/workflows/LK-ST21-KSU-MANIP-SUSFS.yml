name: Build LunarKnight whyred 4.19.325-st21 (KSU manipvlator + SUSFS v2.4.0 + NoMount)

# Taruh file ini di .github/workflows/build-kernel.yml
# Yang harus ada di root repo (branch yang dijalankan):
#   susfs_patch_to_4.19.patch      (SUSFS v2.4.0; nama susfs_patch_to_4_19.patch juga diterima)
# Opsional di root repo:
#   susfs_inline_hook_patches.sh   (script hook JackA1ltman; kalau tidak ada diambil dari mainline-nya)
#
# Alur: kernel -> KernelSU manipvlator (metode syscall: tanpa hook manual fs/exec, open, stat, reboot dkk)
#       -> patch SUSFS 4.19 -> cek kontrak driver<->SUSFS -> hook JackA1ltman (hanya yang tidak bentrok)
#       -> NoMount -> backport -> config (10 fitur SUSFS) -> build -> verifikasi -> AnyKernel3.

on:
  workflow_dispatch:
    inputs:
      hook_mode:
        description: "Metode hook manipvlator: branch_link (disarankan author untuk 4.19+ arm64) atau tamper (syscall table)"
        required: false
        default: "branch_link"
        type: choice
        options:
          - branch_link
          - tamper
      ksu_ref:
        description: "Branch/commit KernelSU manipvlator"
        required: false
        default: "main"
      nomount_branch:
        description: "Branch NoMount (master = 2.3.1-785 atau lebih baru)"
        required: false
        default: "master"
      jack_latest:
        description: "Pakai susfs_inline_hook_patches.sh terbaru dari JackA1ltman mainline (abaikan file di repo)"
        required: false
        default: false
        type: boolean

env:
  KERNEL_REPO: https://github.com/IndraSenzZ/LunarKnight.git
  KERNEL_BRANCH: back
  DEFCONFIG: vendor/whyred-perf_defconfig
  # nama kernel = KERNELVERSION + localversion-st + CONFIG_LOCALVERSION
  ST_TAG: "-st21"
  LOCALVERSION_TAG: "-LunarKnight"
  EXPECT_RELEASE: "4.19.325-st21-LunarKnight"
  KBUILD_BUILD_USER: Shirakumo
  KBUILD_BUILD_HOST: Github
  SUSFS_EXPECT_VER: "v2.4.0"
  NM_MIN_VER: "2.3.1"
  NM_MIN_COMMITS: "785"
  JACK_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  JACK_BRANCH: mainline
  HOOK_MODE: ${{ github.event.inputs.hook_mode || 'branch_link' }}
  KSU_REF: ${{ github.event.inputs.ksu_ref || 'main' }}
  JACK_LATEST: ${{ github.event.inputs.jack_latest || 'false' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo (file patch ada di sini)
        uses: actions/checkout@v6

      - name: Cek file masukan
        run: |
          echo "branch workflow: $GITHUB_REF_NAME"
          P="$(ls susfs_patch_to_4.19.patch* susfs_patch_to_4_19.patch* 2>/dev/null | head -n1 || true)"
          [ -n "$P" ] || { echo "::error::susfs_patch_to_4.19.patch tidak ada di branch '$GITHUB_REF_NAME'. Jalankan workflow dari branch yang berisi file itu."; exit 1; }
          [ "$P" = susfs_patch_to_4.19.patch ] || cp "$P" susfs_patch_to_4.19.patch
          H="$(ls susfs_inline_hook_patches.sh* 2>/dev/null | head -n1 || true)"
          if [ -n "$H" ] && [ "$H" != susfs_inline_hook_patches.sh ]; then cp "$H" susfs_inline_hook_patches.sh; fi
          echo "patch=$P  hook=${H:-<dari JackA1ltman mainline>}"
          echo "hook_mode=$HOOK_MODE ksu_ref=$KSU_REF jack_latest=$JACK_LATEST"
          case "$HOOK_MODE" in branch_link|tamper) ;; *) echo "::error::hook_mode tidak valid: $HOOK_MODE"; exit 1;; esac

      - name: Paket build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio zip python3 git curl \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Neutron clang
        run: |
          mkdir -p "$HOME/neutron" && cd "$HOME/neutron"
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          echo "$HOME/neutron/bin" >> "$GITHUB_PATH"
          "$HOME/neutron/bin/clang" --version | head -n 1

      - name: Clone kernel LunarKnight
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" lk
          test -f "lk/arch/arm64/configs/$DEFCONFIG" || { echo "::error::defconfig $DEFCONFIG tidak ada"; exit 1; }
          printf '%s' "$ST_TAG" > lk/localversion-st
          head -n 5 lk/Makefile

      - name: Integrasi KernelSU manipvlator (metode syscall)
        working-directory: lk
        run: |
          [[ "$KSU_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::ksu_ref tidak valid"; exit 1; }
          # README manipvlator: semua hook KSU manual harus bersih
          HITS="$(grep -rlE 'ksu_handle|CONFIG_KSU' fs kernel security mm drivers/input --include='*.c' --include='*.h' || true)"
          [ -z "$HITS" ] || { echo "::error::sumber kernel masih punya hook/referensi KSU lama:"; echo "$HITS"; exit 1; }
          curl -fsSL "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s "$KSU_REF"
          test -d KernelSU/kernel && test -L drivers/kernelsu || { echo "::error::KernelSU tidak terpasang"; exit 1; }
          [ "$(grep -c kernelsu drivers/Makefile)" = 1 ] && [ "$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig)" = 1 ] \
            || { echo "::error::entri kernelsu di drivers/Makefile atau Kconfig tidak tepat satu"; exit 1; }
          # Bug di driver: ksu_hostsredirect.h menulis `static bool ksu_kernel_umount_enabled`, padahal di mode SUSFS
          # kernel_umount.c mendefinisikannya non-static -> "non-static declaration follows static declaration".
          # Header diubah jadi extern (fitur hostsredirect tetap aktif dan memakai flag yang sama).
          HR=KernelSU/kernel/downstream/ksu_hostsredirect.h
          sed -i 's/^static bool ksu_kernel_umount_enabled __read_mostly;/extern bool ksu_kernel_umount_enabled;/' "$HR"
          grep -q '^extern bool ksu_kernel_umount_enabled;' "$HR" || { echo "::error::perbaikan ksu_hostsredirect.h gagal (driver berubah?)"; exit 1; }
          echo "KernelSU manipvlator: $(git -C KernelSU log -1 --format='%h %cd %s')"

      - name: Patch SUSFS (4.19)
        working-directory: lk
        run: |
          mkdir -p ../glue
          cat > ../glue/fix_susfs.py <<'FIX_EOF'
          #!/usr/bin/env python3
          """Selesaikan patch SUSFS v2.4.0 (4.19) pada tree LunarKnight. Jalankan dari root kernel setelah patch -p1.
          patch(1) menolak 5 hunk karena tree sedikit berbeda dari tree asal patch: hunk include/deklarasi dan
          hook alokator mount. LunarKnight memakai API fs_context, jadi alloc_vfsmnt() ada di vfs_create_mount(),
          bukan di vfs_kern_mount(). fs/stat.c juga punya tiga cacat di patch-nya sendiri (lihat bagian 2).
          Setiap langkah dianchor dan menggagalkan build kalau anchor tidak tepat satu; jumlah hunk yang ditolak
          dicek supaya tidak ada hunk tak dikenal yang terbuang diam-diam."""
          import os, re, subprocess, sys


          def die(m):
              print("::error::" + m)
              sys.exit(1)


          def rd(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def sub(p, old, new):
              s = rd(p)
              if s.count(old) != 1:
                  die(f"{p}: anchor {old.strip()[:50]!r} ditemukan {s.count(old)}x (harus 1)")
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s.replace(old, new))


          DEF = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n"
          MNT_EXT = ("extern bool susfs_is_current_ksu_domain(void);\n"
                     "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n")

          # ---- 1. hunk yang ditolak patch(1), dipasang ulang (jumlah hunk yang diharapkan per file) ----
          EXPECT = {"fs/namespace.c": 2, "fs/proc/cmdline.c": 1, "fs/proc/task_mmu.c": 1, "fs/super.c": 1}
          found = subprocess.run(["find", ".", "-name", "*.rej", "-not", "-path", "./KernelSU/*"],
                                 capture_output=True, text=True).stdout.split()
          rejs = {p[2:-4]: rd(p) for p in found}
          for f, txt in rejs.items():
              n = len(re.findall(r"(?m)^@@ ", txt))
              if EXPECT.get(f) != n:
                  print(txt)
                  die(f"{f}: {n} hunk ditolak, diharapkan {EXPECT.get(f)} (patch tidak cocok lagi dengan tree)")

          if "fs/namespace.c" in rejs:
              p = "fs/namespace.c"
              sub(p, '#include "pnode.h"\n', DEF + '\n#include "pnode.h"\n')
              sub(p, '#include "internal.h"\n',
                  '#include "internal.h"\n\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n' + MNT_EXT +
                  '\n#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n')
              sub(p, '\tmnt = alloc_vfsmnt(fc->source ?: "none");\n\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);\n',
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\t// - We will just stop checking for ksu process if /sdcard/Android is accessible,\n"
                  "\t//   for the sake of performance\n"
                  "\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n"
                  "\t\tif (susfs_is_current_ksu_domain()) {\n"
                  '\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: "none");\n'
                  "\t\t\tgoto bypass_orig_flow;\n"
                  "\t\t}\n"
                  "\t}\n"
                  "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n"
                  '\tmnt = alloc_vfsmnt(fc->source ?: "none");\n\n'
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "bypass_orig_flow:\n"
                  "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);\n")

          if "fs/proc/cmdline.c" in rejs:
              sub("fs/proc/cmdline.c", "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n",
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                  "extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n"
                  "extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n"
                  "#endif\n\n"
                  "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n"
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                  "\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n"
                  "\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n"
                  "\t\tseq_putc(m, '\\n');\n"
                  "\t\treturn 0;\n"
                  "\t}\n"
                  "#endif\n")

          if "fs/proc/task_mmu.c" in rejs:
              c = "defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)"
              sub("fs/proc/task_mmu.c", "#include <asm/elf.h>\n",
                  f"#if {c}\n#include <linux/susfs_def.h>\n#endif // #if {c}\n\n#include <asm/elf.h>\n")

          if "fs/super.c" in rejs:
              sub("fs/super.c", '#include "internal.h"\n',
                  DEF + '#include "internal.h"\n\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n' + MNT_EXT +
                  '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n')

          for f in rejs:
              os.remove(f + ".rej")
              if os.path.exists(f + ".orig"):
                  os.remove(f + ".orig")

          # ---- 2. cacat pada patch itu sendiri (fs/stat.c) ----
          # - <linux/susfs_def.h> tidak di-include (STATX_SUS_KSTAT tidak dikenal -> fs/stat.o gagal)
          # - blok `if (!is_fuse)` tanpa else, inode biasa ikut diberi marker FUSE
          # - marker masuk result_mask lalu cp_statx() menyalinnya ke stx_mask: bocor ke userspace (terdeteksi)
          p = "fs/stat.c"
          sub(p, "#include <asm/unistd.h>\n",
              "#include <asm/unistd.h>\n\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n")
          sub(p, "\t\t\tif (!is_fuse) {\n"
                 "\t\t\t\t// stat->mnt_id = real_mount(path->mnt)->mnt_id;\n"
                 "\t\t\t\t// only for 5.10 kernel\n"
                 "\t\t\t\tstat->result_mask |= STATX_SUS_KSTAT;\n"
                 "\t\t\t}\n"
                 "\t\t\t// stat->mnt_id = real_mount(path->mnt)->mnt_id;\n"
                 "\t\t\t// only for 5.10 kernel\n"
                 "\t\t\tstat->result_mask |= STATX_SUS_KSTAT_FUSE;\n",
              "\t\t\tif (!is_fuse)\n"
              "\t\t\t\tstat->result_mask |= STATX_SUS_KSTAT;\n"
              "\t\t\telse\n"
              "\t\t\t\tstat->result_mask |= STATX_SUS_KSTAT_FUSE;\n")
          sub(p, "\ttmp.stx_mask = stat->result_mask;\n",
              "\ttmp.stx_mask = stat->result_mask;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
              "\t/* internal SUSFS markers must never reach userspace */\n"
              "\ttmp.stx_mask &= ~(STATX_SUS_KSTAT | STATX_SUS_KSTAT_FUSE);\n"
              "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n")

          print("SUSFS selesai, hunk dipasang ulang:", ", ".join(sorted(rejs)) or "tidak ada")
          FIX_EOF
          set +e
          patch -p1 --no-backup-if-mismatch < ../susfs_patch_to_4.19.patch 2>&1 | tee ../patch.log
          set -e
          # hunk ditolak diperbolehkan (ditangani fix_susfs.py); kegagalan lain menghentikan build
          if grep -qE 'No file to patch|Skipping patch|Reversed \(or previously applied\)|malformed patch|can.t find file' ../patch.log; then
            echo "::error::patch gagal bukan karena hunk ditolak (file tidak ada / sudah terpasang / patch rusak)"; exit 1
          fi
          python3 ../glue/fix_susfs.py
          test -z "$(find . -name '*.rej' -not -path './KernelSU/*')" || { echo "::error::masih ada hunk yang ditolak"; exit 1; }
          test -f fs/susfs.c && test -f include/linux/susfs.h && test -f include/linux/susfs_def.h
          grep -q 'CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile || { echo "::error::fs/Makefile tidak membangun susfs.o"; exit 1; }
          # varian SUSFS yang tampil di manager: NON-GKI -> GKI
          sed -i 's/"NON-GKI"/"GKI"/g' include/linux/susfs.h
          grep -q 'define SUSFS_VARIANT "GKI"' include/linux/susfs.h || { echo "::error::SUSFS_VARIANT tidak berubah"; exit 1; }
          SUSFS_VER="$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h | head -n1)"
          [ "$SUSFS_VER" = "$SUSFS_EXPECT_VER" ] || { echo "::error::versi SUSFS di patch = '$SUSFS_VER', diharapkan $SUSFS_EXPECT_VER"; exit 1; }
          echo "SUSFS_VER=$SUSFS_VER" >> "$GITHUB_ENV"
          echo "SUSFS $SUSFS_VER terpasang"

      - name: Cek kontrak driver manipvlator dan SUSFS
        working-directory: lk
        run: |
          # setiap perintah supercall SUSFS aktif (bukan deprecated) harus ditangani driver, kalau tidak fiturnya mati
          CMDS="$(grep -E '^#define[[:space:]]+CMD_SUSFS_' include/linux/susfs_def.h | grep -vi deprecated | awk '{print $2}' | sort -u)"
          [ -n "$CMDS" ] || { echo "::error::tidak ada CMD_SUSFS_* di susfs_def.h"; exit 1; }
          MISS=""
          for c in $CMDS; do grep -rqw "$c" KernelSU/kernel || MISS="$MISS $c"; done
          [ -z "$MISS" ] || { echo "::error::driver tidak menangani perintah SUSFS:$MISS"; grep -rn -i susfs KernelSU/kernel | head -n 100; exit 1; }
          echo "OK: $(echo "$CMDS" | wc -l) perintah SUSFS ditangani driver"
          # driver harus memakai hook LSM sendiri (dipakai oleh langkah hook di bawah)
          grep -rqE '^[[:space:]]*config[[:space:]]+KSU_LSM_SECURITY_HOOKS' KernelSU/kernel --include='Kconfig*' \
            || { echo "::error::driver tidak punya KSU_LSM_SECURITY_HOOKS"; exit 1; }

      - name: Hook JackA1ltman (hanya selinux, sisanya sudah ditangani metode syscall)
        working-directory: lk
        run: |
          HS="$GITHUB_WORKSPACE/susfs_inline_hook_patches.sh"
          if [ ! -f "$HS" ] || [ "$JACK_LATEST" = true ]; then
            rm -rf ../jack
            git clone --depth=1 -b "$JACK_BRANCH" "$JACK_REPO" ../jack
            HS="$(find "$PWD/../jack" -type f -name susfs_inline_hook_patches.sh | head -n1)"
            [ -n "$HS" ] || { echo "::error::susfs_inline_hook_patches.sh tidak ada di $JACK_REPO ($JACK_BRANCH)"; exit 1; }
            echo "script hook dari JackA1ltman mainline: $(git -C ../jack log -1 --format='%h %cd')"
          fi
          echo "script hook: $HS"
          # fs/exec, open, stat, read_write, namei, input, reboot, sys.c, security.c: sudah ditangani driver (syscall + LSM + input_handler),
          # hook manual di sana akan bentrok. Yang tersisa hanya security/selinux/hooks.c (transisi init -> su di bawah nnp/nosuid).
          sed '/^patch_files=(/,/^)/c\patch_files=(\n    security/selinux/hooks.c\n)' "$HS" > ../hook_trim.sh
          bash ../hook_trim.sh | tee ../hook.log
          grep -q 'security/selinux/hooks.c Patched' ../hook.log || { echo "::error::hook gagal di security/selinux/hooks.c"; exit 1; }
          # hook LSM driver sudah menangani selinux_setprocattr; ksu_hide_setprocattr() manual tidak ada di vmlinux -> link gagal bila dibiarkan
          python3 - <<'PYEOF'
          import re, sys
          p = "security/selinux/hooks.c"
          s = open(p, encoding="utf-8").read()
          s, n = re.subn(r"#ifdef CONFIG_KSU\n[ \t]*(?:extern int )?ksu_hide_setprocattr\([^;\n]*\);\n#endif\n\n?", "", s)
          if n != 2 or "ksu_hide_setprocattr" in s or "ksu_sid" not in s:
              print("::error::hook selinux tidak sesuai harapan (setprocattr dibuang: %d, diharapkan 2; hook ksu_sid harus tetap ada)" % n)
              sys.exit(1)
          open(p, "w", encoding="utf-8").write(s)
          print("[+] hook nnp/nosuid init->su terpasang, ksu_hide_setprocattr manual dibuang")
          PYEOF

      - name: NoMount (master)
        working-directory: lk
        env:
          NM_BRANCH: ${{ github.event.inputs.nomount_branch || 'master' }}
        run: |
          [[ "$NM_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::nama branch NoMount tidak valid"; exit 1; }
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/$NM_BRANCH/kernel/setup.sh" | bash -s "$NM_BRANCH"
          test -f fs/nomount/Kconfig && grep -q nomount fs/Makefile && grep -q nomount fs/Kconfig \
            || { echo "::error::NoMount tidak terpasang"; exit 1; }
          cd NoMount
          # versi driver = jumlah commit repo (dibaca Makefile-nya lewat git); setup.sh sudah clone penuh
          NM_COUNT="$(git rev-list --count HEAD)"
          NM_VER="$(sed -n 's/.*"version": *"v\{0,1\}\([0-9.]*\)".*/\1/p' update.json | head -n1)"
          NM_PROTO="$(sed -n 's/^#define NOMOUNT_BASE_VERSION "\(.*\)"/\1/p' kernel/src/nomount.h | head -n1)"
          [ -n "$NM_VER" ] && [ -n "$NM_PROTO" ] || { echo "::error::versi NoMount tidak terbaca (update.json / nomount.h)"; exit 1; }
          [ "$(printf '%s\n' "$NM_MIN_VER" "$NM_VER" | sort -V | head -n1)" = "$NM_MIN_VER" ] && [ "$NM_COUNT" -ge "$NM_MIN_COMMITS" ] \
            || { echo "::error::NoMount $NM_VER-$NM_COUNT lebih rendah dari minimum $NM_MIN_VER-$NM_MIN_COMMITS"; exit 1; }
          echo "NM_COUNT=$NM_COUNT" >> "$GITHUB_ENV"
          echo "NM_PROTO=$NM_PROTO" >> "$GITHUB_ENV"
          echo "NM_LABEL=$NM_VER-$NM_COUNT" >> "$GITHUB_ENV"
          echo "NoMount $NM_BRANCH @ $(git log -1 --format='%h %cd') -> $NM_VER-$NM_COUNT (protokol $NM_PROTO)"

      - name: Backport kallsyms_on_each_symbol dan path_umount (kernel 4.19)
        working-directory: lk
        run: |
          python3 - <<'PYEOF'
          import sys

          def die(m):
              print("::error::" + m)
              sys.exit(1)

          # 1) kallsyms_on_each_symbol hanya dikompilasi saat CONFIG_LIVEPATCH (arm64 4.19 tidak punya), padahal driver
          #    KernelSU (built-in) memanggilnya langsung -> "undefined symbol" saat link. Guard dilebarkan ke CONFIG_KSU.
          p = "kernel/kallsyms.c"
          s = open(p, encoding="utf-8").read()
          a = "#ifdef CONFIG_LIVEPATCH\n/*\n * Iterate over all symbols in vmlinux."
          b = "#endif /* CONFIG_LIVEPATCH */"
          if s.count(a) != 1 or s.count(b) != 1:
              die("guard kallsyms_on_each_symbol di kernel/kallsyms.c tidak seperti yang diharapkan")
          s = s.replace(a, "#if defined(CONFIG_LIVEPATCH) || defined(CONFIG_KSU)\n/*\n * Iterate over all symbols in vmlinux.")
          s = s.replace(b, "#endif /* CONFIG_LIVEPATCH || CONFIG_KSU */")
          open(p, "w", encoding="utf-8").write(s)

          # 2) path_umount() (dari 5.9) dipakai driver untuk umount langsung; di 4.19 hanya ada do_umount()
          p = "fs/namespace.c"
          s = open(p, encoding="utf-8").read()
          if "path_umount(" in s or "can_umount(" in s:
              die("fs/namespace.c sudah punya path_umount/can_umount")
          anchor = "static bool is_mnt_ns_file(struct dentry *dentry)\n"
          if s.count(anchor) != 1 or s.index("static int do_umount(") > s.index(anchor):
              die("anchor path_umount di fs/namespace.c tidak ditemukan")
          code = r'''static int can_umount(const struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);

              if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                  return -EINVAL;
              if (!may_mount())
                  return -EPERM;
              if (path->dentry != path->mnt->mnt_root)
                  return -EINVAL;
              if (!check_mnt(mnt))
                  return -EINVAL;
              if (mnt->mnt.mnt_flags & MNT_LOCKED)
                  return -EINVAL;
              if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                  return -EPERM;
              return 0;
          }

          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              int ret;

              ret = can_umount(path, flags);
              if (!ret)
                  ret = do_umount(mnt, flags);

              /* Do not use path_put(): it would clear mnt_expiry_mark. */
              dput(path->dentry);
              mntput_no_expire(mnt);
              return ret;
          }

          '''
          open(p, "w", encoding="utf-8").write(s.replace(anchor, code + anchor))
          print("[+] kallsyms_on_each_symbol dan path_umount siap")
          PYEOF
          grep -n 'CONFIG_KSU' kernel/kallsyms.c
          grep -n '^int path_umount' fs/namespace.c

      - name: Konfigurasi kernel
        working-directory: lk
        run: |
          M="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "M=$M" >> "$GITHUB_ENV"
          make $M "$DEFCONFIG"
          if [ "$HOOK_MODE" = tamper ]; then HOOK_ON=KSU_TAMPER_SYSCALL_TABLE; HOOK_OFF=KSU_HACK_ARM64_BRANCH_LINK
          else HOOK_ON=KSU_HACK_ARM64_BRANCH_LINK; HOOK_OFF=KSU_TAMPER_SYSCALL_TABLE; fi
          # 10 fitur SUSFS
          SUSFS10="KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP KSU_SUSFS_PRIORITY_UID_FILTER KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS"
          # fitur KSU: metode hook, hook LSM (setuid, rename, setprocattr), adb root, hosts redirect
          REQ="KSU KSU_SUSFS $SUSFS10 $HOOK_ON KSU_LSM_SECURITY_HOOKS KSU_FEATURE_ADBROOT KSU_HOSTSREDIRECT"
          ARGS=(); for c in $REQ; do ARGS+=(-e "$c"); done
          scripts/config --file out/.config --set-str LOCALVERSION "$LOCALVERSION_TAG" -d LOCALVERSION_AUTO \
            -e NOMOUNT -e KALLSYMS -e TMPFS_XATTR -e TMPFS_POSIX_ACL -d KPROBES -d "$HOOK_OFF" -d KSU_DEBUG "${ARGS[@]}"
          make $M olddefconfig
          fail=0
          for c in $REQ NOMOUNT KALLSYMS THREAD_INFO_IN_TASK SECURITY_SELINUX; do
            grep -q "^CONFIG_$c=y" out/.config && echo "ok   CONFIG_$c=y" || { echo "::error::CONFIG_$c tidak aktif"; fail=1; }
          done
          for c in "$HOOK_OFF" KSU_DEBUG; do
            if grep -q "^CONFIG_$c=y" out/.config; then echo "::error::CONFIG_$c seharusnya mati"; fail=1; fi
          done
          grep -q '^CONFIG_KPROBES=y' out/.config && echo "::warning::KPROBES masih aktif (di-select opsi lain); driver tetap memakai metode $HOOK_MODE" || true
          grep -q "^CONFIG_LOCALVERSION=\"$LOCALVERSION_TAG\"" out/.config || { echo "::error::LOCALVERSION salah"; fail=1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config || { echo "::error::LOCALVERSION_AUTO aktif"; fail=1; }
          [ "$fail" = 0 ]

      - name: Build kernel
        working-directory: lk
        run: |
          # Kode vendor 4.19 memicu tiga diagnostik yang dianggap error oleh clang baru. Diturunkan jadi warning
          # (bukan dibungkam): tetap tercatat di build.log dan langkah berikutnya menggagalkan build bila menyangkut kode kita.
          export KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types"
          make $M -j"$(nproc)" Image.gz-dtb 2>&1 | tee ../build.log

      - name: Gerbang peringatan (SUSFS / KernelSU / NoMount harus bersih)
        run: |
          W='warning: (implicit declaration of function|incompatible integer to pointer|incompatible pointer to integer|incompatible function pointer)'
          grep -E "$W" build.log | sed -E 's/^[0-9T:.-]+Z //' | sort | uniq -c | sort -rn | head -n 40 > warn-summary.log || true
          echo "peringatan berbahaya di seluruh kernel: $(wc -l < warn-summary.log) jenis (kernel lama, lihat warn-summary.log)"
          grep -E "$W" build.log | grep -E "fs/susfs\.c|include/linux/susfs|fs/nomount/|drivers/kernelsu/|KernelSU/kernel/|'(susfs|ksu|nomount)_|function '(susfs|ksu|nomount)_" > ours.log || true
          if [ -s ours.log ]; then cat ours.log; echo "::error::peringatan fatal pada kode SUSFS/KernelSU/NoMount (di atas)"; exit 1; fi
          if grep -qE "implicit declaration of function '(susfs|ksu|nomount)_" build.log; then
            echo "::error::pemanggilan susfs_/ksu_/nomount_ tanpa deklarasi (include hilang)"; exit 1
          fi
          echo "OK: kode SUSFS, KernelSU, NoMount bersih"

      - name: Verifikasi hasil build
        working-directory: lk
        run: |
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $REL"
          [ "$REL" = "$EXPECT_RELEASE" ] || { echo "::error::nama kernel salah: $REL (diharapkan $EXPECT_RELEASE)"; exit 1; }
          test -s out/arch/arm64/boot/Image.gz-dtb
          find out/drivers/kernelsu -name '*.o' 2>/dev/null | grep -q . || { echo "::error::driver kernelsu tidak ikut terkompilasi"; exit 1; }
          llvm-nm out/vmlinux > "$RUNNER_TEMP/syms.txt"
          # entry point 10 fitur SUSFS + simbol sisi KernelSU yang dipakai patch + backport
          for s in susfs_init susfs_add_sus_path susfs_add_sus_path_loop susfs_set_hide_sus_mnts_for_non_su_procs \
                   susfs_add_sus_kstat susfs_update_sus_kstat susfs_set_uname susfs_enable_log \
                   susfs_set_cmdline_or_bootconfig susfs_add_open_redirect susfs_add_sus_map \
                   susfs_set_priority_uid_filter susfs_is_priority_uid_filtered susfs_parse_priority_app_strings \
                   susfs_set_avc_log_spoofing susfs_start_sdcard_monitor_fn \
                   susfs_is_current_ksu_domain setup_selinux ksu_cred susfs_ksu_sid path_umount kallsyms_on_each_symbol; do
            grep -qw "$s" "$RUNNER_TEMP/syms.txt" || { echo "::error::simbol $s tidak ada di vmlinux"; exit 1; }
          done
          echo "SUSFS $SUSFS_VER: semua entry point 10 fitur ada di vmlinux"
          test -f out/fs/nomount/nomount.o || { echo "::error::fs/nomount tidak ikut terkompilasi"; exit 1; }
          strings -a out/fs/nomount/nomount.o | grep -qxF "$NM_PROTO ($NM_COUNT)" \
            || { echo "::error::versi NoMount di objek bukan '$NM_PROTO ($NM_COUNT)'"; exit 1; }
          echo "NoMount di kernel: $NM_PROTO ($NM_COUNT) = $NM_LABEL"
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Paket AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          cp lk/out/arch/arm64/boot/Image.gz-dtb ak3/
          cat > ak3/anykernel.sh <<'ANYKERNEL_EOF'
          ### AnyKernel3 - LunarKnight / Xiaomi Redmi Note 5 Pro (whyred)
          properties() { '
          kernel.string=4.19.325-st21-LunarKnight by Shirakumo@Github
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # whyred: non A/B, Image.gz-dtb (DTB menempel), partisi boot
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "4.19.325-st21-LunarKnight (whyred)";
          ui_print "KernelSU manipvlator (@HOOK@) + SUSFS @SUSFS_VER@ + NoMount @NM@";
          ui_print "by Shirakumo@Github";

          # hanya kernel, ramdisk tidak diubah
          split_boot;
          flash_boot;
          ANYKERNEL_EOF
          sed -i "s/@SUSFS_VER@/$SUSFS_VER/; s/@NM@/$NM_LABEL/; s/@HOOK@/$HOOK_MODE/" ak3/anykernel.sh
          cd ak3
          ZIP="LunarKnight-whyred-4.19.325-st21-KSU-SUSFS-NoMount-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP" . -x '*.git*'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unggah zip
        uses: actions/upload-artifact@v6
        with:
          name: LunarKnight-whyred
          path: ${{ env.ZIP }}

      - name: Unggah log dan config
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            build.log
            warn-summary.log
            ours.log
            hook.log
            patch.log
            lk/out/.config
            lk/**/*.rej
          if-no-files-found: ignore
