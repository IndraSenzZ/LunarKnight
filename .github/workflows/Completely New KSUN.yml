name: Build LunarKnight whyred 4.19 (KSU-Next legacy + SUSFS + NoMount)

# Taruh file ini di .github/workflows/build-kernel.yml
# Di root repo harus ada:
#   susfs_patch_to_4_19.patch
#   susfs_inline_hook_patches.sh

on:
  workflow_dispatch:
    inputs:
      nomount_branch:
        description: "Branch NoMount untuk integrasi kernel"
        required: false
        default: "master"

env:
  KERNEL_REPO: https://github.com/IndraSenzZ/LunarKnight.git
  KERNEL_BRANCH: back
  DEFCONFIG: vendor/whyred-perf_defconfig
  LOCALVERSION_TAG: "-LunarKnight"
  EXPECT_RELEASE: "4.19.325-st20-LunarKnight"
  KBUILD_BUILD_USER: Shirakumo
  KBUILD_BUILD_HOST: Github

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo (file patch ada di sini)
        uses: actions/checkout@v4

      - name: Cek file masukan
        run: |
          for f in susfs_patch_to_4_19.patch susfs_inline_hook_patches.sh; do
            [ -f "$f" ] || { echo "::error::$f tidak ada di root repo"; exit 1; }
          done

      - name: Paket build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio zip zstd lz4 xz-utils \
            patch python3 git curl wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache

      - name: Neutron clang
        run: |
          mkdir -p "$HOME/neutron" && cd "$HOME/neutron"
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          "$HOME/neutron/bin/clang" --version | head -n 1

      - name: Clone kernel LunarKnight
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" lk
          head -n 5 lk/Makefile
          cat lk/localversion-st
          test -f "lk/arch/arm64/configs/$DEFCONFIG" || { echo "::error::defconfig $DEFCONFIG tidak ada"; exit 1; }

      - name: Integrasi KernelSU-Next legacy (resmi)
        working-directory: lk
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          test -d KernelSU-Next/kernel || { echo "::error::KernelSU-Next/kernel tidak ada"; exit 1; }
          test -L drivers/kernelsu || { echo "::error::symlink drivers/kernelsu tidak ada"; exit 1; }
          git -C KernelSU-Next log -1 --format='KSUN commit: %H' || true

      - name: Patch SUSFS v2.3.0 (4.19)
        working-directory: lk
        run: |
          patch -p1 --dry-run --no-backup-if-mismatch < ../susfs_patch_to_4_19.patch
          patch -p1 --no-backup-if-mismatch < ../susfs_patch_to_4_19.patch
          if find . -name '*.rej' | grep -q .; then find . -name '*.rej'; echo "::error::ada hunk yang ditolak"; exit 1; fi
          grep -q 'CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          test -f include/linux/susfs.h && test -f include/linux/susfs_def.h

      - name: Kconfig SUSFS (10 fitur)
        working-directory: lk
        run: |
          cat > fs/Kconfig.susfs <<'KCONFIG_SUSFS_EOF'
          menu "KernelSU - SUSFS"

          config KSU_SUSFS
          	bool "KernelSU addon - SUSFS"
          	depends on KSU && KSU != m
          	default y
          	help
          	  SUSFS v2.3.0 for KernelSU-Next (legacy, manual hooks).

          config KSU_SUSFS_SUS_PATH
          	bool "Hide suspicious paths"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MOUNT
          	bool "Hide suspicious mounts"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_KSTAT
          	bool "Spoof kstat of suspicious files"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_UNAME
          	bool "Spoof uname"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable SUSFS logging (runtime switch)"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "Spoof /proc/cmdline or /proc/bootconfig"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Redirect opened files"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MAP
          	bool "Hide suspicious memory maps"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_PRIORITY_UID_FILTER
          	bool "Priority uid filter for getpriority/setpriority"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Hide KernelSU and SUSFS symbols from kallsyms"
          	depends on KSU_SUSFS
          	default y

          endmenu
          KCONFIG_SUSFS_EOF
          grep -q 'Kconfig.susfs' fs/Kconfig || printf '\nsource "fs/Kconfig.susfs"\n' >> fs/Kconfig
          grep -c '^config KSU_SUSFS' fs/Kconfig.susfs

      - name: Hook inline SUSFS (sesuai panduan)
        working-directory: lk
        run: |
          bash ../susfs_inline_hook_patches.sh | tee ../hook.log
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c \
                   security/selinux/hooks.c kernel/reboot.c kernel/sys.c; do
            grep -q "$f Patched" ../hook.log || { echo "::error::hook gagal di $f"; exit 1; }
          done

      - name: Glue SUSFS <-> KernelSU-Next legacy
        working-directory: lk
        run: |
          mkdir -p ../glue
          cat > ../glue/susfs_glue.c <<'SUSFS_GLUE_C_EOF'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * susfs_glue.c - SUSFS v2.3.0 <-> KernelSU-Next (legacy) bridge
           *
           * Target : 4.19 non-GKI, manual / inline hooks (no kprobes).
           * Role   : provides the KernelSU-side symbols that the SUSFS kernel patch and
           *          the SUSFS inline hooks expect, and adapts them to the structure of
           *          the official KernelSU-Next legacy branch.
           */
          #ifdef CONFIG_KSU_SUSFS

          #include <linux/err.h>
          #include <linux/sched.h>
          #include <linux/cred.h>
          #include <linux/string.h>
          #include <linux/uaccess.h>
          #include <linux/workqueue.h>
          #include <linux/fs.h>
          #include <linux/susfs.h>
          #include <linux/susfs_def.h>

          #include "klog.h" // IWYU pragma: keep
          #include "ksu.h"
          #include "policy/allowlist.h"
          #include "selinux/selinux.h"
          #include "manager/manager_identity.h"
          #include "hook/setuid_hook.h"

          #define SUSFS_GLUE_SU_PATH "/system/bin/su"
          #define SUSFS_GLUE_SH_PATH "/system/bin/sh"

          extern struct work_struct susfs_extra_works;

          /* ------------------------------------------------------------------ */
          /* symbols required by susfs.c / security/selinux/avc.c                 */
          /* ------------------------------------------------------------------ */
          u32 susfs_ksu_sid;
          u32 susfs_priv_app_sid;

          bool susfs_is_current_ksu_domain(void)
          {
          	return is_ksu_domain();
          }

          static void susfs_ksu_resolve_sids(void)
          {
          	static const char ksu_ctx[] = KERNEL_SU_CONTEXT;
          	static const char priv_ctx[] = "u:r:priv_app:s0:c512,c768";

          	if (!susfs_ksu_sid)
          		(void)ksu_security_secctx_to_secid(ksu_ctx, strlen(ksu_ctx),
          						   &susfs_ksu_sid);
          	if (!susfs_priv_app_sid)
          		(void)ksu_security_secctx_to_secid(priv_ctx, strlen(priv_ctx),
          						   &susfs_priv_app_sid);
          }

          /* called from on_post_fs_data(): policy is loaded and ksu rules are applied */
          void susfs_ksu_post_fs_data(void)
          {
          	susfs_ksu_resolve_sids();
          	susfs_start_sdcard_monitor_fn();
          }

          /* ------------------------------------------------------------------ */
          /* inline hook adapters (struct filename based, called from the fs hooks)     */
          /* ------------------------------------------------------------------ */
          static inline void susfs_glue_su_to_sh(struct filename **fn)
          {
          	static const char su[] = SUSFS_GLUE_SU_PATH;
          	static const char sh[] = SUSFS_GLUE_SH_PATH;
          	struct filename *f;

          	BUILD_BUG_ON(sizeof(su) != sizeof(sh));

          	if (unlikely(!fn))
          		return;
          	f = *fn;
          	if (IS_ERR_OR_NULL(f))
          		return;
          	if (unlikely(!strcmp(f->name, su)))
          		memcpy((void *)f->name, sh, sizeof(sh));
          }

          int susfs_ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode,
          			       int *flags)
          {
          	susfs_glue_su_to_sh(filename);
          	return 0;
          }

          int susfs_ksu_handle_stat(int *dfd, struct filename **filename, int *flags)
          {
          	susfs_glue_su_to_sh(filename);
          	return 0;
          }

          /* the legacy sucompat has nothing to do after execveat */
          int ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr,
          				      void *argv, void *envp, int *flags,
          				      int *retval)
          {
          	return 0;
          }

          /* ------------------------------------------------------------------ */
          /* setresuid: KernelSU-Next legacy + SUSFS per-process state            */
          /* ------------------------------------------------------------------ */
          int susfs_ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid)
          {
          	uid_t old_uid = current_uid().val;
          	uid_t new_uid = ruid;
          	bool isolated;

          	if (unlikely(ruid == (uid_t)-1))
          		return 0;

          	/* manager fd, seccomp, allow list, module umount (task_work) */
          	ksu_handle_setresuid(old_uid, new_uid);

          	isolated = is_isolated_process(new_uid);
          	if (!is_appuid(new_uid) && new_uid != WEBVIEW_ZYGOTE_UID && !isolated)
          		return 0;

          	/* only processes forked from zygote are app processes */
          	if (!is_zygote(current_cred()))
          		return 0;

          	if (is_uid_manager(new_uid)) {
          		susfs_clear_current_proc_umounted();
          		susfs_clear_current_proc_no_su();
          		return 0;
          	}

          	if (ksu_is_allow_uid_for_current(new_uid))
          		susfs_clear_current_proc_no_su();
          	else
          		susfs_set_current_proc_no_su();

          	if (isolated || ksu_uid_should_umount(new_uid)) {
          		susfs_set_current_proc_umounted();
          		/* deferred, so the time spent here stays as small as possible */
          		schedule_work(&susfs_extra_works);
          	} else {
          		susfs_clear_current_proc_umounted();
          	}

          	return 0;
          }

          /* ------------------------------------------------------------------ */
          /* supercall: reboot(KSU_INSTALL_MAGIC1, SUSFS_MAGIC, cmd, &info)       */
          /* returns true when the call was a SUSFS call (handled or rejected)    */
          /* ------------------------------------------------------------------ */
          bool susfs_ksu_handle_reboot(int magic2, unsigned int cmd, void __user **arg)
          {
          	if (likely(magic2 != SUSFS_MAGIC))
          		return false;

          	if (current_uid().val != 0)
          		return true;

          	switch (cmd) {
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
          	case CMD_SUSFS_ADD_SUS_PATH:
          		susfs_add_sus_path(arg);
          		break;
          	case CMD_SUSFS_ADD_SUS_PATH_LOOP:
          		susfs_add_sus_path_loop(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          	case CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS:
          		susfs_set_hide_sus_mnts_for_non_su_procs(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          	case CMD_SUSFS_ADD_SUS_KSTAT:
          	case CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:
          		susfs_add_sus_kstat(arg);
          		break;
          	case CMD_SUSFS_UPDATE_SUS_KSTAT:
          		susfs_update_sus_kstat(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
          	case CMD_SUSFS_SET_UNAME:
          		susfs_set_uname(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_ENABLE_LOG
          	case CMD_SUSFS_ENABLE_LOG:
          		susfs_enable_log(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:
          		susfs_set_cmdline_or_bootconfig(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT
          	case CMD_SUSFS_ADD_OPEN_REDIRECT:
          		susfs_add_open_redirect(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          	case CMD_SUSFS_ADD_SUS_MAP:
          		susfs_add_sus_map(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER
          	case CMD_SUSFS_SET_PRIORITY_UID_FILTER:
          		susfs_set_priority_uid_filter(arg);
          		break;
          #endif
          	case CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING:
          		susfs_ksu_resolve_sids();
          		susfs_set_avc_log_spoofing(arg);
          		break;
          	case CMD_SUSFS_SHOW_VERSION:
          		susfs_show_version(arg);
          		break;
          	case CMD_SUSFS_SHOW_ENABLED_FEATURES:
          		susfs_get_enabled_features(arg);
          		break;
          	case CMD_SUSFS_SHOW_VARIANT:
          		susfs_show_variant(arg);
          		break;
          	default:
          		break;
          	}

          	return true;
          }

          #endif /* CONFIG_KSU_SUSFS */
          SUSFS_GLUE_C_EOF
          cat > ../glue/fstat_append.c <<'FSTAT_APPEND_EOF'

          #ifdef CONFIG_KSU_SUSFS
          /*
           * SUSFS inline hook in vfs_fstat(): init reads init.rc through fstat() to size
           * its buffer, so the size has to include what the init.rc proxy appends.
           * Appended to this file because it needs the static helpers above.
           */
          void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr)
          {
          	struct file *file;

          	if (likely(!ksu_init_rc_hook))
          		return;

          	if (!is_init(current_cred()))
          		return;

          	file = fget(fd);
          	if (!file)
          		return;

          	if (is_init_rc(file)) {
          		load_module_rc_once();
          		*kstat_size_ptr += ksu_rc_len + module_rc_len;
          	}

          	fput(file);
          }
          #endif /* CONFIG_KSU_SUSFS */
          FSTAT_APPEND_EOF
          cat > ../glue/apply_glue.py <<'APPLY_GLUE_PY_EOF'
          #!/usr/bin/env python3
          """Adapt SUSFS v2.3.0 patch + inline hooks to KernelSU-Next (legacy).

          Run from the kernel source root, after:
            1) SUSFS kernel patch   2) susfs_inline_hook_patches.sh   3) KernelSU-Next setup.sh legacy
          Every edit is asserted: the script aborts (exit 1) on any unexpected state.
          """
          import os, re, sys

          KS = "KernelSU-Next/kernel"
          GLUE_DIR = os.environ.get("GLUE_DIR", ".")
          fails = []

          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()

          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)

          def die(msg):
              print("::error::" + msg)
              sys.exit(1)

          def sub(path, old, new, count=None, regex=False, optional=False):
              if not os.path.exists(path):
                  if optional:
                      return
                  die(f"{path}: file missing")
              s = read(path)
              n = len(re.findall(old, s)) if regex else s.count(old)
              if n == 0:
                  if optional:
                      return
                  die(f"{path}: pattern not found: {old[:70]!r}")
              if count is not None and n != count:
                  die(f"{path}: expected {count} match(es) of {old[:70]!r}, found {n}")
              s = re.sub(old, new, s) if regex else s.replace(old, new)
              write(path, s)
              print(f"  ok  {path}: {old[:60]!r} x{n}")

          def forbid(path, pat):
              if os.path.exists(path) and re.search(pat, read(path)):
                  die(f"{path}: leftover pattern {pat!r}")

          # ---------------------------------------------------------------- hook sites
          # 1) static keys of the generic SUSFS hooks -> plain bools of KernelSU-Next legacy
          for f in ("fs/exec.c", "fs/open.c", "fs/stat.c"):
              sub(f, "extern struct static_key_true ksu_su_compat_enabled;",
                  "extern bool ksu_su_compat_enabled;", optional=False)
              sub(f, "static_branch_likely(&ksu_su_compat_enabled)",
                  "likely(ksu_su_compat_enabled)")
              forbid(f, r"static_key_true ksu_su_compat_enabled|&ksu_su_compat_enabled")

          for f in ("fs/read_write.c", "fs/stat.c"):
              sub(f, "extern struct static_key_true ksu_is_init_rc_hook_enabled;",
                  "extern bool ksu_init_rc_hook;")
              sub(f, "static_branch_unlikely(&ksu_is_init_rc_hook_enabled)",
                  "unlikely(ksu_init_rc_hook)")
              forbid(f, r"ksu_is_init_rc_hook_enabled")

          sub("fs/read_write.c",
              "extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd);",
              "extern void ksu_handle_sys_read(unsigned int fd);")

          sub("drivers/input/input.c",
              "extern struct static_key_true ksu_is_input_hook_enabled;",
              "extern bool ksu_input_hook;")
          sub("drivers/input/input.c", "static_branch_unlikely(&ksu_is_input_hook_enabled)",
              "unlikely(ksu_input_hook)")
          forbid("drivers/input/input.c", r"ksu_is_input_hook_enabled")

          # 2) signature mismatches -> glue functions with the struct filename / 3-uid ABI
          sub("fs/open.c", r"\bksu_handle_faccessat\b", "susfs_ksu_handle_faccessat", regex=True)
          sub("fs/stat.c", r"\bksu_handle_stat\b", "susfs_ksu_handle_stat", regex=True)
          sub("kernel/sys.c", r"\bksu_handle_setresuid\b", "susfs_ksu_handle_setresuid", regex=True)

          # ---------------------------------------------------------------- KernelSU-Next
          # 3) SUSFS supercalls through reboot()
          sc = f"{KS}/supercall/supercall.c"
          sub(sc,
              "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n\t\t\t  void __user **arg)\n{\n",
              "#ifdef CONFIG_KSU_SUSFS\nextern bool susfs_ksu_handle_reboot(int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n"
              "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n\t\t\t  void __user **arg)\n{\n",
              count=1)
          sub(sc,
              "\tif (magic1 != KSU_INSTALL_MAGIC1)\n\t\treturn 0;\n",
              "\tif (magic1 != KSU_INSTALL_MAGIC1)\n\t\treturn 0;\n\n"
              "#ifdef CONFIG_KSU_SUSFS\n\tif (susfs_ksu_handle_reboot(magic2, cmd, arg))\n\t\treturn 0;\n#endif\n",
              count=1)

          # 4) susfs_init() at KernelSU init (after ksu_cred exists)
          sub(f"{KS}/core/init.c", "\tksu_feature_init();\n",
              "\tksu_feature_init();\n\n#ifdef CONFIG_KSU_SUSFS\n\tsusfs_init();\n#endif\n", count=1)
          sub(f"{KS}/core/init.c", "extern void __init ksu_lsm_hook_init(void);\n",
              "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n\nextern void __init ksu_lsm_hook_init(void);\n", count=1)

          # 5) post-fs-data: resolve SIDs + start the sdcard monitor
          be = f"{KS}/runtime/boot_event.c"
          sub(be, "extern void ksu_avc_spoof_late_init();\n",
              "extern void ksu_avc_spoof_late_init();\n#ifdef CONFIG_KSU_SUSFS\nextern void susfs_ksu_post_fs_data(void);\nextern void susfs_parse_priority_app_strings(void);\n#endif\n",
              count=1)
          sub(be, "\tksu_selinux_hide_handle_post_fs_data();\n}",
              "\tksu_selinux_hide_handle_post_fs_data();\n#ifdef CONFIG_KSU_SUSFS\n\tsusfs_ksu_post_fs_data();\n#endif\n}",
              count=1)

          # 6) keep the priority uid filter in sync with installed packages
          tt = f"{KS}/manager/throne_tracker.c"
          sub(tt, "void track_throne(bool prune_only)\n{\n",
              "#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\nextern void susfs_parse_priority_app_strings(void);\n#endif\n\n"
              "void track_throne(bool prune_only)\n{\n#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n\tsusfs_parse_priority_app_strings();\n#endif\n",
              count=1)

          # 7) build glue + fstat helper
          kb = f"{KS}/Kbuild"
          sub(kb, "kernelsu-objs += extras.o\n", "kernelsu-objs += extras.o\nkernelsu-objs += susfs_glue.o\n", count=1)
          write(f"{KS}/susfs_glue.c", read(os.path.join(GLUE_DIR, "susfs_glue.c")))
          ki = f"{KS}/runtime/ksud_integration.c"
          if "ksu_handle_vfs_fstat" in read(ki):
              die("ksud_integration.c already has ksu_handle_vfs_fstat (glue already applied?)")
          write(ki, read(ki).rstrip("\n") + "\n" + read(os.path.join(GLUE_DIR, "fstat_append.c")))

          print("glue applied")
          APPLY_GLUE_PY_EOF
          GLUE_DIR="$GITHUB_WORKSPACE/glue" python3 ../glue/apply_glue.py

      - name: NoMount
        working-directory: lk
        run: |
          BR="${{ github.event.inputs.nomount_branch || 'master' }}"
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/$BR/kernel/setup.sh" | bash -s "$BR"
          test -d fs/nomount && test -f fs/nomount/Kconfig
          grep -q nomount fs/Makefile && grep -q nomount fs/Kconfig

      - name: Konfigurasi kernel
        working-directory: lk
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          M="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "M=$M" >> "$GITHUB_ENV"
          make $M "$DEFCONFIG"
          S=scripts/config
          $S --file out/.config --set-str LOCALVERSION "$LOCALVERSION_TAG" -d LOCALVERSION_AUTO \
             -e KSU -e KSU_MANUAL_HOOK -d KSU_DEBUG -e NOMOUNT \
             -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
             -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
             -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP -e KSU_SUSFS_PRIORITY_UID_FILTER \
             -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e TMPFS_XATTR -e TMPFS_POSIX_ACL
          make $M olddefconfig
          fail=0
          for c in KSU KSU_MANUAL_HOOK NOMOUNT KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT \
                   KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG \
                   KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP \
                   KSU_SUSFS_PRIORITY_UID_FILTER KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS; do
            grep -q "^CONFIG_$c=y" out/.config && echo "ok   CONFIG_$c=y" || { echo "::error::CONFIG_$c tidak aktif"; fail=1; }
          done
          grep -q '^CONFIG_LOCALVERSION="-LunarKnight"' out/.config || { echo "::error::LOCALVERSION salah"; fail=1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config || { echo "::error::LOCALVERSION_AUTO aktif"; fail=1; }
          grep -q '^CONFIG_KSU_KPROBES_HOOK=y\|^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' out/.config && { echo "::error::hook dinamis aktif"; fail=1; } || true
          [ "$fail" = 0 ]

      - name: Build kernel
        working-directory: lk
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-function-pointer-types"
          set -o pipefail
          make $M -j"$(nproc)" Image.gz-dtb 2>&1 | tee ../build.log

      - name: Verifikasi hasil build
        working-directory: lk
        run: |
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $REL"
          [ "$REL" = "$EXPECT_RELEASE" ] || { echo "::error::nama kernel salah: $REL"; exit 1; }
          test -s out/arch/arm64/boot/Image.gz-dtb
          for s in susfs_add_sus_path susfs_ksu_handle_reboot susfs_ksu_handle_setresuid susfs_init ksu_handle_sys_reboot; do
            "$HOME/neutron/bin/llvm-nm" out/vmlinux | grep -qw "$s" || { echo "::error::simbol $s tidak ada di vmlinux"; exit 1; }
          done
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Paket AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE ak3/patch ak3/ramdisk ak3/modules
          cp lk/out/arch/arm64/boot/Image.gz-dtb ak3/
          cat > ak3/anykernel.sh <<'ANYKERNEL_EOF'
          #!/sbin/sh
          # AnyKernel3 - LunarKnight / Xiaomi Redmi Note 5 Pro (whyred)
          properties() { '
          kernel.string=4.19.325-st20-LunarKnight by Shirakumo@Github
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # whyred: non A/B, Image.gz-dtb (DTB attached), boot partition
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "4.19.325-st20-LunarKnight (whyred)";
          ui_print "KernelSU-Next legacy + SUSFS v2.3.0 + NoMount";
          ui_print "by Shirakumo@Github";

          split_boot;
          flash_boot;
          ANYKERNEL_EOF
          cd ak3
          ZIP="LunarKnight-whyred-4.19.325-st20-KSUN-SUSFS-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP" . -x '*.git*'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unggah zip
        uses: actions/upload-artifact@v4
        with:
          name: LunarKnight-whyred
          path: ${{ env.ZIP }}

      - name: Unggah log dan config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            hook.log
            lk/out/.config
          if-no-files-found: ignore
