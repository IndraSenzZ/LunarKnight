name: Build LunarKnight whyred 4.19 st21 (SukiSU-Nova + SUSFS + NoMount)

# Satu file ini sudah cukup: tidak ada file lain yang perlu ada di repo.
#   - SukiSU-Nova      : branch `builtin-new` (setup.sh resmi), driver masuk ke drivers/kernelsu
#   - SUSFS + hook     : patch 4.19 dan skrip hook inline dari JackA1ltman/NonGKI_Kernel_Build_2nd (mainline)
#   - NoMount          : maxsteeel/nomount branch master (minimal 2.3.1-785)
#   - Toolchain        : Neutron clang
# SukiSU-Nova builtin-new sudah membawa semua sisi KernelSU dari SUSFS (supercall, sepolicy, mount, sdcard monitor,
# dst.), jadi tidak ada file "glue" buatan sendiri; yang dikerjakan di sini hanya menempelkan hook, memperbaiki
# hunk patch yang tidak cocok dengan tree LunarKnight, dan menyesuaikan 3 hal kecil agar kompatibel dengan 4.19.

on:
  workflow_dispatch:
    inputs:
      susfs_variant_gki:
        description: "Tampilkan varian SUSFS sebagai 'GKI' di manager (default: tidak, tetap 'NON-GKI' yang jujur untuk 4.19)"
        type: boolean
        default: false

env:
  KERNEL_REPO: https://github.com/IndraSenzZ/LunarKnight.git
  KERNEL_BRANCH: back
  DEFCONFIG: vendor/whyred-perf_defconfig
  # nama kernel akhir = 4.19.325 + localversion-st + CONFIG_LOCALVERSION
  KERNEL_ST: "-st21"
  LOCALVERSION_TAG: "-LunarKnight"
  EXPECT_RELEASE: "4.19.325-st21-LunarKnight"
  KBUILD_BUILD_USER: Shirakumo
  KBUILD_BUILD_HOST: Github
  NOVA_BRANCH: builtin-new
  NONGKI_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  NONGKI_BRANCH: mainline
  SUSFS_EXPECT_SERIES: "v2.4."
  NOMOUNT_BRANCH: master
  NOMOUNT_MIN_VERSION: "2.3.1"
  NOMOUNT_MIN_COUNT: "785"
  # kernel vendor 4.19 + clang baru: dua jenis error ini memang jadi error default di clang baru dan
  # tersebar di kode vendor lama; -Wimplicit-function-declaration diaktifkan lagi di langkah audit
  # khusus kode integrasi (SUSFS / KernelSU / NoMount) supaya tidak ada yang tersembunyi.
  # -DKSU_NO_PREINIT= : builtin-new menyalakan preinit sendiri di arm64 + jump label (runner_xxd.h sudah jadi, tidak lagi
  # bergantung pada out/usr/include). Preinit mengganti eksekusi init (PID 1) -> dimatikan di sini supaya perilaku sama
  # dengan build yang sudah terbukti boot. Hapus flag itu dari KCFLAGS_BASE untuk mengaktifkannya.
  KCFLAGS_BASE: "-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-function-pointer-types -DKSU_NO_PREINIT="

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Paket build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio zip zstd lz4 xz-utils \
            patch python3 git curl wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Neutron clang
        run: |
          mkdir -p "$HOME/neutron" && cd "$HOME/neutron"
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          "$HOME/neutron/bin/clang" --version | head -n 1

      - name: Ambil patch SUSFS + hook (NonGKI_Kernel_Build_2nd)
        run: |
          git clone --depth=1 -b "$NONGKI_BRANCH" "$NONGKI_REPO" nongki
          P=nongki/Patches/Patch/susfs_patch_to_4.19.patch
          H=nongki/Patches/susfs_inline_hook_patches.sh
          test -s "$P" || { echo "::error::$P tidak ada di $NONGKI_REPO ($NONGKI_BRANCH)"; exit 1; }
          test -s "$H" || { echo "::error::$H tidak ada di $NONGKI_REPO ($NONGKI_BRANCH)"; exit 1; }
          cp "$P" susfs_patch_to_4.19.patch
          cp "$H" susfs_inline_hook_patches.sh
          echo "NonGKI commit: $(git -C nongki log -1 --format='%h %cd %s')"
          echo "SUSFS di patch: $(sed -n 's/^+#define SUSFS_VERSION "\(.*\)"/\1/p' susfs_patch_to_4.19.patch | head -n1)"

      - name: Clone kernel LunarKnight
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" lk
          head -n 5 lk/Makefile
          test -f "lk/arch/arm64/configs/$DEFCONFIG" || { echo "::error::defconfig $DEFCONFIG tidak ada"; exit 1; }
          # nama kernel: <versi>-st21-LunarKnight  (localversion-st = "-st21", CONFIG_LOCALVERSION = "-LunarKnight")
          printf '%s\n' "$KERNEL_ST" > lk/localversion-st
          [ "$(ls lk/localversion* | wc -l)" = 1 ] || { echo "::error::ada file localversion* lain di source, nama kernel bisa salah"; ls lk/localversion*; exit 1; }
          # source harus bersih: tidak boleh ada KernelSU / SUSFS / NoMount bawaan
          if [ -e lk/fs/susfs.c ] || [ -e lk/drivers/kernelsu ] || [ -e lk/KernelSU ] || [ -e lk/fs/nomount ]; then
            echo "::error::source kernel sudah berisi SUSFS/KernelSU/NoMount; workflow ini butuh source bersih"; exit 1
          fi

      # Urutan penting: hook SUSFS mendeteksi driver KSU lewat drivers/kernelsu, jadi Nova harus dipasang dulu.
      - name: Integrasi SukiSU-Nova (builtin-new)
        working-directory: lk
        run: |
          # setup.sh resmi builtin-new TIDAK dipakai: ia meng-clone ke folder "SukiSU-Nova" lalu `cd KernelSU`
          # (folder yang tidak pernah dibuat) -> "cd: .../lk/KernelSU: No such file or directory", dan langkah
          # sesudahnya (symlink, drivers/Makefile, drivers/Kconfig) berjalan di direktori yang salah.
          # Di sini tiga hal yang dikerjakan setup.sh dilakukan langsung, lengkap dengan pemeriksaannya.
          git clone -b "$NOVA_BRANCH" https://github.com/SukiSU-Nova/SukiSU-Nova.git KernelSU   # klon penuh: Makefile Nova membaca git
          test -f KernelSU/kernel/Kconfig && test -f KernelSU/kernel/Makefile \
            || { echo "::error::KernelSU/kernel tidak berisi Kconfig/Makefile (struktur repo Nova berubah)"; exit 1; }
          # (1) driver masuk ke drivers/kernelsu (symlink relatif ke KernelSU/kernel)
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          # (2) drivers/Makefile
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          # (3) drivers/Kconfig: source harus berada sebelum `endmenu` penutup
          [ "$(tail -n1 drivers/Kconfig)" = "endmenu" ] \
            || { echo "::error::baris terakhir drivers/Kconfig bukan 'endmenu'; penyisipan source tidak aman"; tail -n3 drivers/Kconfig; exit 1; }
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          [ "$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig)" = 1 ] && [ "$(grep -c 'CONFIG_KSU) += kernelsu/' drivers/Makefile)" = 1 ] \
            || { echo "::error::penyisipan drivers/Makefile / drivers/Kconfig tidak tepat satu kali"; exit 1; }
          # builtin-new: unity build satu unit (kernelsu-y := ksu.o), entry point ksu.c (bukan ksu_main.c)
          test -f KernelSU/kernel/ksu.c
          test -e drivers/kernelsu/ksu.c
          grep -q 'kernelsu-y := ksu.o' KernelSU/kernel/Makefile
          grep -q kernelsu drivers/Makefile && grep -q kernelsu drivers/Kconfig
          [ "$(git -C KernelSU rev-parse --abbrev-ref HEAD)" = "$NOVA_BRANCH" ] \
            || { echo "::error::SukiSU-Nova tidak berada di branch $NOVA_BRANCH"; exit 1; }
          echo "SukiSU-Nova $NOVA_BRANCH @ $(git -C KernelSU log -1 --format='%h %cd %s')"

      - name: Patch SUSFS (4.19)
        working-directory: lk
        run: |
          mkdir -p ../glue
          cat > ../glue/fix_rejects.py <<'FIX_REJECTS_PY_EOF'
          #!/usr/bin/env python3
          """Pasang ulang 4 hunk SUSFS 4.19 yang ditolak `patch` di tree LunarKnight.

          Penyebabnya konteks include/mount-API di tree ini beda dari tree acuan patch (LunarKnight punya
          fs_context mount API, jadi alloc_vfsmnt() baru ada di vfs_create_mount(), bukan vfs_kern_mount()).
          Setiap anchor harus ditemukan TEPAT SATU kali; selain itu build berhenti. File .rej selain yang
          dikenal juga menghentikan build. Jalankan dari root kernel.
          """
          import os, re, subprocess, sys

          def die(m):
              print("::error::" + m); sys.exit(1)

          def rd(p):
              with open(p, encoding="utf-8") as f: return f.read()

          def wr(p, s):
              with open(p, "w", encoding="utf-8") as f: f.write(s)

          def once(s, old, new, what):
              n = s.count(old)
              if n != 1: die(f"{what}: anchor {old.strip()[:50]!r} ditemukan {n}x (harus 1)")
              return s.replace(old, new)

          INC = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n"

          def ns():
              p = "fs/namespace.c"; s = rd(p)
              if "<linux/susfs_def.h>" not in s:
                  s = once(s, '#include "pnode.h"\n', INC + '\n#include "pnode.h"\n', p)
                  s = once(s, '#include "internal.h"\n',
                      '#include "internal.h"\n\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                      'extern bool susfs_is_current_ksu_domain(void);\n'
                      'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n'
                      '#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n\n'
                      '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n', p)
              if "susfs_alloc_non_unshare_ksu_vfsmnt(fc->source" not in s:
                  s = once(s, '\tmnt = alloc_vfsmnt(fc->source ?: "none");\n\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);\n',
                      '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                      '\t// stop checking for the ksu process once /sdcard/Android is accessible (performance)\n'
                      '\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n'
                      '\t\tif (susfs_is_current_ksu_domain()) {\n'
                      '\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: "none");\n'
                      '\t\t\tgoto bypass_orig_flow;\n\t\t}\n\t}\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n'
                      '\tmnt = alloc_vfsmnt(fc->source ?: "none");\n\n'
                      '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nbypass_orig_flow:\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                      '\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);\n', p)
              wr(p, s)

          def cmdline():
              p = "fs/proc/cmdline.c"; s = rd(p)
              if "susfs_spoof_cmdline_or_bootconfig" in s: return
              s = once(s, "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n",
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                  "extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n"
                  "extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n#endif\n\n"
                  "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n"
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                  "\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n"
                  "\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n\t\tseq_putc(m, '\\n');\n\t\treturn 0;\n\t}\n#endif\n", p)
              wr(p, s)

          def task_mmu():
              p = "fs/proc/task_mmu.c"; s = rd(p)
              if "<linux/susfs_def.h>" in s: return
              c = "defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)"
              s = once(s, "#include <asm/elf.h>\n",
                  f"#if {c}\n#include <linux/susfs_def.h>\n#endif // #if {c}\n\n#include <asm/elf.h>\n", p)
              wr(p, s)

          def sup():
              p = "fs/super.c"; s = rd(p)
              if "<linux/susfs_def.h>" in s: return
              s = once(s, '#include "internal.h"\n', INC + '#include "internal.h"\n\n'
                  '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\n'
                  'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n'
                  '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n', p)
              wr(p, s)

          KNOWN = {"fs/namespace.c": ns, "fs/proc/cmdline.c": cmdline, "fs/proc/task_mmu.c": task_mmu, "fs/super.c": sup}
          rejs = sorted(p[2:-4] for p in subprocess.run(["find", ".", "-name", "*.rej"], capture_output=True, text=True).stdout.split())
          print("file ditolak:", rejs or "tidak ada")
          for f in rejs:
              if f not in KNOWN:
                  print(rd(f + ".rej")); die(f"reject tak dikenal di {f}")
              KNOWN[f](); os.remove(f + ".rej")
              if os.path.exists(f + ".orig"): os.remove(f + ".orig")
              print("  diperbaiki:", f)

          # cek akhir: setiap penanda harus ada di file-nya sendiri
          def has(f, *ms):
              s = rd(f)
              for m in ms:
                  if m not in s: die(f"{f}: '{m}' tidak ada setelah perbaikan")
          has("fs/namespace.c", "<linux/susfs_def.h>", "#define CL_COPY_MNT_NS", "susfs_alloc_non_unshare_ksu_vfsmnt(fc->source",
              "susfs_alloc_unshare_ksu_vfsmnt(old->mnt_devname", "bypass_orig_flow:")
          has("fs/proc/cmdline.c", "susfs_spoof_cmdline_or_bootconfig")
          has("fs/proc/task_mmu.c", "<linux/susfs_def.h>")
          has("fs/super.c", "<linux/susfs_def.h>", "susfs_is_current_ksu_domain")
          print("SUSFS patch lengkap")
          FIX_REJECTS_PY_EOF
          set +e
          patch -p1 --no-backup-if-mismatch < ../susfs_patch_to_4.19.patch 2>&1 | tee ../patch.log
          set -e
          # `patch` boleh menolak hunk (fix_rejects.py memasang ulang yang dikenal); kegagalan jenis lain
          # (file tidak ada, sudah terpasang, patch rusak) harus menghentikan build di sini
          if grep -qE 'No file to patch|Skipping patch|Reversed \(or previously applied\)|malformed patch|can.t find file' ../patch.log; then
            echo "::error::patch gagal bukan karena hunk ditolak:"
            grep -nE 'No file to patch|Skipping patch|Reversed \(or previously applied\)|malformed patch|can.t find file' ../patch.log
            exit 1
          fi
          python3 -I ../glue/fix_rejects.py
          test -z "$(find . -name '*.rej' -o -name '*.orig')" || { echo "::error::masih ada hunk yang ditolak"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          test -f include/linux/susfs.h && test -f include/linux/susfs_def.h
          SUSFS_VER="$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h | head -n1)"
          [ -n "$SUSFS_VER" ] || { echo "::error::SUSFS_VERSION tidak terbaca dari susfs.h"; exit 1; }
          case "$SUSFS_VER" in "$SUSFS_EXPECT_SERIES"*) ;; *) echo "::error::versi SUSFS di patch = $SUSFS_VER, workflow ini untuk seri $SUSFS_EXPECT_SERIES""x"; exit 1;; esac
          echo "SUSFS_VER=$SUSFS_VER" >> "$GITHUB_ENV"
          echo "SUSFS versi dari patch: $SUSFS_VER"
          if [ "${{ github.event.inputs.susfs_variant_gki }}" = "true" ]; then
            sed -i 's/"NON-GKI"/"GKI"/g' include/linux/susfs.h
            grep -q 'define SUSFS_VARIANT "GKI"' include/linux/susfs.h || { echo "::error::SUSFS_VARIANT tidak berubah"; exit 1; }
          fi

      - name: Hook inline SUSFS (sesuai panduan) + penyesuaian ke Nova
        working-directory: lk
        run: |
          bash ../susfs_inline_hook_patches.sh | tee ../hook.log
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c \
                   security/selinux/hooks.c kernel/reboot.c kernel/sys.c; do
            grep -q "$f Patched" ../hook.log || { echo "::error::hook gagal di $f"; exit 1; }
          done

          # (1) skrip hook menulis pr_info("...()\\n") di kernel/sys.c -> tercetak backslash-n literal
          sed -i 's|handle_setresuid()\\\\n");|handle_setresuid()\\n");|' kernel/sys.c
          grep -qF 'handle_setresuid()\n");' kernel/sys.c || { echo "::error::pr_info di kernel/sys.c tidak terkoreksi"; exit 1; }
          if grep -qF 'handle_setresuid()\\n' kernel/sys.c; then echo "::error::masih ada backslash ganda di kernel/sys.c"; exit 1; fi

          # (2) builtin-new: ksu_su_compat_enabled = static key (DEFINE_STATIC_KEY_TRUE), sama dengan yang dipakai skrip hook,
          #     jadi tidak ada penyesuaian tipe; hanya dipastikan keduanya memang selaras.
          grep -q '^DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled)' KernelSU/kernel/feature/sucompat.c \
            || { echo "::error::ksu_su_compat_enabled di Nova bukan static key lagi; sesuaikan hook"; exit 1; }
          grep -q 'static_key_true ksu_su_compat_enabled' fs/exec.c fs/open.c fs/stat.c \
            || { echo "::error::hook kernel tidak mendeklarasikan ksu_su_compat_enabled sebagai static key"; exit 1; }
          grep -q 'static_branch_likely(&ksu_su_compat_enabled)' fs/exec.c fs/open.c fs/stat.c \
            || { echo "::error::hook kernel tidak memakai static_branch_likely(&ksu_su_compat_enabled)"; exit 1; }

          # (3) builtin-new: ksu_handle_sys_read() bertipe void dengan 1 argumen (blok CONFIG_KSU_SUSFS di
          #     runtime/ksud_integration.c). Skrip hook mendeklarasikannya `int`; samakan supaya tipe kembalian cocok.
          grep -q '^void ksu_handle_sys_read(unsigned int fd)' KernelSU/kernel/runtime/ksud_integration.c \
            || { echo "::error::prototipe ksu_handle_sys_read di Nova berubah; sesuaikan hook"; exit 1; }
          sed -i 's/^extern[^;]*ksu_handle_sys_read[^;]*;/extern void ksu_handle_sys_read(unsigned int fd);/' fs/read_write.c
          [ "$(grep -c '^extern void ksu_handle_sys_read(unsigned int fd);' fs/read_write.c)" = 1 ] \
            || { echo "::error::deklarasi sys_read tidak tersesuaikan"; exit 1; }
          grep -q 'ksu_handle_sys_read(fd);' fs/read_write.c \
            || { echo "::error::pemanggilan ksu_handle_sys_read(fd) tidak ditemukan di fs/read_write.c"; exit 1; }

          # semua hook yang dipanggil kernel harus ada definisinya di Nova
          for s in ksu_handle_execveat ksu_handle_execveat_sucompat ksu_handle_post_execveat_sucompat ksu_handle_faccessat \
                   ksu_handle_stat ksu_handle_vfs_fstat ksu_handle_sys_read ksu_handle_input_handle_event \
                   ksu_handle_setresuid __ksu_is_allow_uid_for_current ksu_handle_sys_reboot; do
            grep -rqE "^[a-z_ ]+[ \*]$s\(" KernelSU/kernel --include=*.c || { echo "::error::Nova tidak mendefinisikan $s"; exit 1; }
            grep -qE "\b$s\b" fs/*.c kernel/*.c drivers/input/input.c security/selinux/hooks.c || { echo "::error::tidak ada pemanggil $s di kernel"; exit 1; }
          done

          # prototipe tiap hook di kernel harus sama dengan definisinya di Nova (jumlah argumen, void/non-void,
          # struct filename vs char __user); beda tipe di sini = crash saat runtime, bukan error kompilasi.
          python3 -I - <<'PROTO_CHECK_EOF'
          import re, glob, sys

          names = ("ksu_handle_execveat ksu_handle_execveat_sucompat ksu_handle_post_execveat_sucompat "
                   "ksu_handle_faccessat ksu_handle_stat ksu_handle_vfs_fstat ksu_handle_sys_read "
                   "ksu_handle_input_handle_event ksu_handle_setresuid ksu_handle_sys_reboot "
                   "__ksu_is_allow_uid_for_current").split()

          def rd(f):
              return open(f, errors="replace").read()

          nova = "\n".join(rd(f) for f in glob.glob("KernelSU/kernel/**/*.c", recursive=True))
          kfiles = (glob.glob("fs/*.c") + glob.glob("kernel/*.c") + glob.glob("include/linux/*.h")
                    + ["drivers/input/input.c", "security/selinux/hooks.c"])
          kern = "\n".join(rd(f) for f in kfiles if glob.glob(f))
          kern = re.sub(r"__attribute__\s*\(\(.*?\)\)", "", kern, flags=re.S)

          def split_params(s):
              s = " ".join(s.split())
              if s in ("", "void"):
                  return []
              out, depth, cur = [], 0, ""
              for ch in s:
                  if ch == "(":
                      depth += 1
                  elif ch == ")":
                      depth -= 1
                  if ch == "," and depth == 0:
                      out.append(cur.strip()); cur = ""
                  else:
                      cur += ch
              out.append(cur.strip())
              return out

          def is_void(ret):
              return bool(re.search(r"\bvoid\b", ret)) and "*" not in ret

          bad = 0
          for n in names:
              d = re.search(r"^([A-Za-z_][\w \t\*]*?[ \t\*])" + re.escape(n) + r"\s*\(([^{;]*?)\)\s*\{", nova, re.M)
              if not d:
                  print(f"::error::definisi {n} tidak ditemukan di Nova"); bad += 1; continue
              dret, dps = d.group(1), split_params(d.group(2))
              e = re.search(r"^[ \t]*extern\s+([^;()]*?)\b" + re.escape(n) + r"\s*\(([^;{]*?)\)\s*;", kern, re.M)
              if not e:
                  print(f"info: {n}: tidak ada 'extern' di file kernel yang diperiksa (dideklarasikan lewat header lain) - dilewati")
                  continue
              kret, kps = e.group(1), split_params(e.group(2))
              problems = []
              if is_void(dret) != is_void(kret):
                  problems.append(f"tipe kembalian beda (Nova: '{' '.join(dret.split())}' / kernel: '{' '.join(kret.split())}')")
              if len(dps) != len(kps):
                  problems.append(f"jumlah argumen beda (Nova {len(dps)} / kernel {len(kps)})")
              else:
                  for i, (a, b) in enumerate(zip(dps, kps)):
                      if ("struct filename" in a) != ("struct filename" in b):
                          problems.append(f"argumen {i+1}: Nova '{a}' / kernel '{b}'")
              if problems:
                  bad += 1
                  print(f"::error::prototipe {n} tidak cocok: " + "; ".join(problems))
              else:
                  print(f"ok  {n}: {len(dps)} arg, kembalian {'void' if is_void(dret) else 'non-void'}")
          sys.exit(1 if bad else 0)
          PROTO_CHECK_EOF

      - name: Kompatibilitas Nova untuk 4.19 (verifikasi builtin-new)
        working-directory: lk
        run: |
          # builtin-new sudah membawa pengaman versinya sendiri, jadi tidak ada lagi patch ke source Nova.
          # Langkah ini hanya memastikan asumsi itu masih benar; kalau Nova berubah, build berhenti di sini.
          if grep -rn 'static_call' KernelSU/kernel; then
            echo "::error::Nova memakai static_call (baru ada sejak 5.10, tidak ada di 4.19)"; exit 1
          fi
          # access_ok(): hanya boleh ada di kpm.c (sudah dibelah < 5.0 / >= 5.0) dan kernel_compat.h
          if grep -rnE '(^|[^_a-z])access_ok\(' KernelSU/kernel --include=*.c --include=*.h \
               | grep -v 'kernel_compat.h' | grep -v 'extension/kpm/kpm.c'; then
            echo "::error::access_ok() mentah di luar kpm.c (tidak kompatibel dengan 4.19)"; exit 1
          fi
          grep -q '#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)' KernelSU/kernel/extension/kpm/kpm.c \
            || { echo "::error::access_ok() di kpm.c tidak lagi dibelah per versi"; exit 1; }
          # KPM dikompilasi hanya di >= 5.10 (KSU_CAN_USE_KPM)
          grep -q -B1 '^#define KSU_CAN_USE_KPM' KernelSU/kernel/kernel_compat.h \
            || { echo "::error::KSU_CAN_USE_KPM tidak ditemukan di kernel_compat.h"; exit 1; }
          # selinux_hide / avc_spoof kini di-include tanpa pengaman >= 5.10: pastikan memang begitu
          grep -q '^#include "feature/selinux_hide.c"' KernelSU/kernel/ksu.c \
            || { echo "::error::selinux_hide.c tidak di-include di ksu.c"; exit 1; }
          grep -q '^#include "feature/avc_spoof.c"' KernelSU/kernel/ksu.c \
            || { echo "::error::avc_spoof.c tidak di-include di ksu.c"; exit 1; }
          echo "Nova builtin-new: tidak perlu patch kompatibilitas 4.19"

      - name: NoMount (master)
        working-directory: lk
        run: |
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/$NOMOUNT_BRANCH/kernel/setup.sh" | bash -s "$NOMOUNT_BRANCH"
          test -d fs/nomount && test -f fs/nomount/Kconfig
          grep -q nomount fs/Makefile && grep -q nomount fs/Kconfig
          # versi = versi modul (module.prop) + jumlah commit repo NoMount (dibaca Makefile-nya lewat git;
          # setup.sh sudah klon penuh, jadi hitungannya benar)
          cd NoMount
          [ "$(git rev-parse --abbrev-ref HEAD)" = "$NOMOUNT_BRANCH" ] || { echo "::error::NoMount tidak berada di branch $NOMOUNT_BRANCH"; exit 1; }
          NM_COUNT="$(git rev-list --count HEAD)"
          NM_TAG="$(sed -n 's/^version=v\{0,1\}//p' module/module.prop | head -n1 | tr -d '\r')"
          NM_BASE="$(sed -n 's/^#define NOMOUNT_BASE_VERSION "\([0-9]*\)"/\1/p' kernel/src/nomount.h | head -n1)"
          [ -n "$NM_TAG" ] || { echo "::error::versi NoMount tidak terbaca dari module/module.prop"; exit 1; }
          [ -n "$NM_BASE" ] && [ "${#NM_BASE}" = 2 ] || { echo "::error::NOMOUNT_BASE_VERSION tidak terbaca / formatnya berubah"; exit 1; }
          NM_VER="$NM_TAG-$NM_COUNT"
          [ "$(printf '%s\n' "$NOMOUNT_MIN_VERSION" "$NM_TAG" | sort -V | head -n1)" = "$NOMOUNT_MIN_VERSION" ] \
            || { echo "::error::NoMount $NM_TAG < $NOMOUNT_MIN_VERSION"; exit 1; }
          [ "$NM_COUNT" -ge "$NOMOUNT_MIN_COUNT" ] \
            || { echo "::error::NoMount $NOMOUNT_BRANCH = $NM_VER, minimal $NOMOUNT_MIN_VERSION-$NOMOUNT_MIN_COUNT"; exit 1; }
          { echo "NM_COUNT=$NM_COUNT"; echo "NM_BASE=$NM_BASE"; echo "NM_VER=$NM_VER"; } >> "$GITHUB_ENV"
          echo "NoMount $NOMOUNT_BRANCH @ $(git log -1 --format='%h %cd') -> $NM_VER (minimal $NOMOUNT_MIN_VERSION-$NOMOUNT_MIN_COUNT, ok)"

      - name: Backport path_umount (kernel 4.19)
        working-directory: lk
        run: |
          mkdir -p ../glue
          cat > ../glue/path_umount.py <<'PATH_UMOUNT_PY_EOF'
          import re, sys
          from pathlib import Path

          def die(m):
              print("::error::" + m)
              sys.exit(1)

          ns, ih = Path("fs/namespace.c"), Path("fs/internal.h")
          if not ns.is_file() or not ih.is_file():
              die("fs/namespace.c atau fs/internal.h tidak ditemukan")
          src = ns.read_text()

          def pat(n):
              return rf"(?m)^[ \t]*(?:static[ \t]+)?int[ \t]+{n}[ \t]*\([^;{{}}]*\)[ \t\r\n]*\{{"

          has_can = re.search(pat("can_umount"), src) is not None
          has_path = re.search(pat("path_umount"), src) is not None
          blocks = []
          if not has_can:
              blocks.append(r'''static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }''')
          if not has_path:
              blocks.append(r'''int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	/* Do not use path_put(): it would clear mnt_expiry_mark. */
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }''')

          if blocks:
              anchor = None
              if not has_can and has_path:
                  anchor = re.search(r"(?m)^int[ \t]+path_umount\s*\(", src)
              else:
                  for a in (r"(?m)^static bool is_mnt_ns_file\s*\(", r"(?m)^SYSCALL_DEFINE2\(umount,"):
                      anchor = re.search(a, src)
                      if anchor:
                          break
              if anchor is None:
                  die("anchor di fs/namespace.c tidak ditemukan")
              if "static int do_umount(" not in src or src.index("static int do_umount(") > anchor.start():
                  die("do_umount tidak ada sebelum titik sisip")
              src = src[:anchor.start()] + "\n".join(["\n".join(blocks), "", ""]) + src[anchor.start():]
              ns.write_text(src)
              print("[+] path_umount ditambahkan ke fs/namespace.c")

          for n in ("can_umount", "path_umount"):
              c = len(re.findall(pat(n), ns.read_text()))
              if c != 1:
                  die(f"definisi {n} harus tepat satu, ditemukan {c}")

          h = ih.read_text()
          proto = r"(?m)^int[ \t]+path_umount\s*\(struct path \*path, int flags\);\s*$"
          if not re.search(proto, h):
              m = re.search(r"(?m)^extern void __init mnt_init\(void\);\s*$", h)
              if m:
                  ih.write_text(h[:m.end()] + "\nint path_umount(struct path *path, int flags);" + h[m.end():])
              else:
                  print("[!] prototype tidak ditambahkan ke internal.h (tidak wajib untuk link)")
          print("[OK] path_umount siap")
          PATH_UMOUNT_PY_EOF
          python3 -I ../glue/path_umount.py
          grep -n "path_umount" fs/namespace.c | head

      - name: Konfigurasi kernel
        working-directory: lk
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          M="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "M=$M" >> "$GITHUB_ENV"
          make $M "$DEFCONFIG"
          S=scripts/config
          $S --file out/.config --set-str LOCALVERSION "$LOCALVERSION_TAG" -d LOCALVERSION_AUTO \
             -e KSU -d KSU_DEBUG -e NOMOUNT \
             -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
             -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
             -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP -e KSU_SUSFS_PRIORITY_UID_FILTER \
             -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KALLSYMS -e TMPFS_XATTR -e TMPFS_POSIX_ACL
          make $M olddefconfig
          fail=0
          for c in KSU KSU_FEATURE_ADBROOT NOMOUNT KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT \
                   KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG \
                   KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP \
                   KSU_SUSFS_PRIORITY_UID_FILTER KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                   KALLSYMS FSNOTIFY SECURITY_SELINUX THREAD_INFO_IN_TASK JUMP_LABEL KEYS; do
            grep -q "^CONFIG_$c=y" out/.config && echo "ok   CONFIG_$c=y" || { echo "::error::CONFIG_$c tidak aktif"; fail=1; }
          done
          grep -q '^CONFIG_LOCALVERSION="-LunarKnight"' out/.config || { echo "::error::LOCALVERSION salah"; fail=1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config || { echo "::error::LOCALVERSION_AUTO aktif"; fail=1; }
          # preinit Nova sengaja nonaktif lewat -DKSU_NO_PREINIT= (lihat KCFLAGS_BASE); ia mengganti eksekusi init
          # (PID 1) -> risiko bootloop di 4.19; fitur KSU/SUSFS lain tidak bergantung padanya
          case "$KCFLAGS_BASE" in *-DKSU_NO_PREINIT=*) ;; *) echo "::error::KCFLAGS_BASE tidak memuat -DKSU_NO_PREINIT="; fail=1;; esac
          [ "$fail" = 0 ]

      - name: Header generated (compile.h)
        working-directory: lk
        run: |
          # include/generated/compile.h di 4.19 hanya dibuat saat init/version.o dibangun (init/Makefile).
          # drivers/kernelsu/kernel_includes.h meng-include-nya, jadi harus ada SEBELUM drivers/kernelsu/
          # dikompilasi (di audit parsial maupun di build penuh, yang paralel dan tidak menjamin urutan).
          export PATH="$HOME/neutron/bin:$PATH"
          make $M -j"$(nproc)" init/version.o
          test -s out/include/generated/compile.h || { echo "::error::compile.h tidak terbentuk"; exit 1; }
          grep -E 'UTS_VERSION|LINUX_COMPILE_(BY|HOST)' out/include/generated/compile.h

      - name: Audit kompilasi integrasi (deklarasi fungsi hook)
        working-directory: lk
        run: |
          # Objek-objek integrasi dikompilasi dulu dengan -Wimplicit-function-declaration aktif; setiap implicit
          # declaration milik integrasi = hook kurang prototipe = build gagal di sini.
          export PATH="$HOME/neutron/bin:$PATH"
          export KCFLAGS="$KCFLAGS_BASE -Wimplicit-function-declaration"
          set -o pipefail
          make $M -j"$(nproc)" fs/susfs.o fs/namespace.o fs/super.o fs/exec.o fs/open.o fs/stat.o fs/read_write.o \
            fs/namei.o fs/readdir.o fs/proc/cmdline.o fs/proc/task_mmu.o drivers/input/input.o security/selinux/hooks.o \
            kernel/reboot.o kernel/sys.o block/ioprio.o drivers/kernelsu/ fs/nomount/ 2>&1 | tee ../audit.log
          if grep -E "implicit declaration of function '[A-Za-z0-9_]*(susfs|ksu|nomount|path_umount|filename_lookup)[A-Za-z0-9_]*'" ../audit.log; then
            echo "::error::ada fungsi integrasi tanpa deklarasi (lihat baris di atas)"; exit 1
          fi
          grep -q 'SukiSU-Nova: using SUSFS_INLINE_HOOK' ../audit.log \
            || { echo "::error::Nova tidak berjalan dalam mode SUSFS_INLINE_HOOK"; exit 1; }
          grep -E '^-- (SukiSU-Nova version|SUSFS_VERSION)' ../audit.log || true

      - name: Build kernel
        working-directory: lk
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          export KCFLAGS="$KCFLAGS_BASE"
          set -o pipefail
          make $M -j"$(nproc)" Image.gz-dtb 2>&1 | tee ../build.log

      - name: Verifikasi hasil build
        working-directory: lk
        run: |
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $REL"
          [ "$REL" = "$EXPECT_RELEASE" ] || { echo "::error::nama kernel salah: $REL (harus $EXPECT_RELEASE)"; exit 1; }
          test -s out/arch/arm64/boot/Image.gz-dtb
          "$HOME/neutron/bin/llvm-nm" out/vmlinux > "$RUNNER_TEMP/syms.txt"
          strings -a -n 3 out/vmlinux > "$RUNNER_TEMP/vm.str"

          # nama + author di banner kernel
          grep -qF "Linux version $EXPECT_RELEASE ($KBUILD_BUILD_USER@$KBUILD_BUILD_HOST)" "$RUNNER_TEMP/vm.str" \
            || { echo "::error::banner kernel tidak berisi '$EXPECT_RELEASE ($KBUILD_BUILD_USER@$KBUILD_BUILD_HOST)'"; grep -a 'Linux version' "$RUNNER_TEMP/vm.str" | head -3; exit 1; }
          echo "banner: Linux version $EXPECT_RELEASE ($KBUILD_BUILD_USER@$KBUILD_BUILD_HOST) ok"

          # 10/10 fitur SUSFS: dilaporkan susfs_get_enabled_features() ke userspace
          for f in SUS_PATH SUS_MOUNT SUS_KSTAT SPOOF_UNAME ENABLE_LOG SPOOF_CMDLINE_OR_BOOTCONFIG OPEN_REDIRECT SUS_MAP \
                   PRIORITY_UID_FILTER HIDE_KSU_SUSFS_SYMBOLS; do
            grep -qx "CONFIG_KSU_SUSFS_$f" "$RUNNER_TEMP/vm.str" || { echo "::error::fitur SUSFS $f tidak ada di vmlinux"; exit 1; }
            echo "fitur SUSFS aktif: $f"
          done

          # sisi SUSFS (fungsi tiap fitur), sisi KSU (hook yang dipanggil kernel), dan path_umount
          for s in susfs_init ksu_handle_sys_reboot path_umount \
                   susfs_add_sus_path susfs_add_sus_path_loop susfs_set_sus_path_uid_filter susfs_parse_sus_path_app_strings \
                   susfs_set_hide_sus_mnts_for_non_su_procs susfs_add_sus_kstat susfs_update_sus_kstat susfs_set_uname \
                   susfs_enable_log susfs_set_cmdline_or_bootconfig susfs_add_open_redirect susfs_add_sus_map \
                   susfs_set_priority_uid_filter susfs_is_priority_uid_filtered susfs_parse_priority_app_strings \
                   susfs_set_avc_log_spoofing susfs_start_sdcard_monitor_fn susfs_is_current_ksu_domain \
                   ksu_handle_execveat ksu_handle_execveat_sucompat ksu_handle_post_execveat_sucompat ksu_handle_faccessat \
                   ksu_handle_stat ksu_handle_vfs_fstat ksu_handle_sys_read ksu_handle_input_handle_event \
                   ksu_handle_setresuid __ksu_is_allow_uid_for_current ksu_su_compat_enabled; do
            grep -qw "$s" "$RUNNER_TEMP/syms.txt" || { echo "::error::simbol $s tidak ada di vmlinux"; exit 1; }
          done
          echo "semua simbol SUSFS / SukiSU-Nova ada di vmlinux"

          # KPM tidak diaktifkan (opsional, bisa mengganggu stabilitas); preinit nonaktif
          grep -q '^CONFIG_KPM=y' out/.config && { echo "::error::KPM aktif padahal tidak diminta"; exit 1; } || true
          if grep -qw 'ksu_preinit_init' "$RUNNER_TEMP/syms.txt"; then echo "::error::preinit Nova ikut terkompilasi padahal dimatikan"; exit 1; fi

          # versi SUSFS (string log dari susfs_init)
          grep -aqF "version: $SUSFS_VER" out/vmlinux && echo "versi SUSFS di vmlinux: $SUSFS_VER (ok)" \
            || echo "::warning::string versi SUSFS $SUSFS_VER tidak terdeteksi di vmlinux (versi sudah diverifikasi dari patch)"
          grep -hE '^-- SukiSU-Nova version' ../audit.log ../build.log | head -n1 | tee "$RUNNER_TEMP/nova_ver.txt" || true
          NV="$(sed -n 's/^-- SukiSU-Nova version: \([0-9]*\).*/\1/p' "$RUNNER_TEMP/nova_ver.txt")"
          [ -n "$NV" ] && [ "$NV" -ge 30000 ] || echo "::warning::versi driver Nova tidak terbaca / memakai fallback (${NV:-kosong}); cek akses GitHub API saat build"

          # NoMount: terkompilasi + versi di objek = "<protokol> (<commit>)"
          test -f out/fs/nomount/nomount.o || { echo "::error::fs/nomount tidak ikut terkompilasi"; exit 1; }
          strings -a out/fs/nomount/nomount.o > "$RUNNER_TEMP/nm.str"
          grep -qxF "$NM_BASE ($NM_COUNT)" "$RUNNER_TEMP/nm.str" \
            || { echo "::error::versi NoMount di objek tidak sama dengan '$NM_BASE ($NM_COUNT)'"; grep -E '^[0-9]+ \(' "$RUNNER_TEMP/nm.str" | head; exit 1; }
          echo "NoMount di kernel: $NM_BASE ($NM_COUNT) = $NM_VER"
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Diagnostik selinux_hide / avc_spoof (hanya informasi)
        if: always()
        working-directory: lk
        run: |
          # tidak pernah menggagalkan build; hasil masuk artifact build-logs sebagai selinux_hide_diag.txt
          {
            echo "== Nova: isi KernelSU/kernel/feature =="; ls -la KernelSU/kernel/feature 2>&1
            echo; echo "== Kbuild / Kconfig / Makefile: baris terkait =="
            grep -rnE "selinux_hide|avc_spoof|SELINUX_HIDE|AVC_SPOOF" KernelSU/kernel --include=Kbuild --include=Kconfig --include=Makefile 2>&1
            echo; echo "== semua pemakai selinux_hide / avc_spoof di source Nova =="
            grep -rnE "selinux_hide|avc_spoof|SELINUX_HIDE|AVC_SPOOF" KernelSU/kernel 2>&1 | head -80
            echo; echo "== pengaman #if di selinux_hide.c =="
            grep -nE "^\s*#\s*(if|ifdef|ifndef|elif|else|endif)" KernelSU/kernel/feature/selinux_hide.c 2>&1 | head -60
            echo; echo "== ksu.c: include / init / pengaman #if terkait selinux_hide & avc_spoof =="
            grep -nE "selinux_hide|avc_spoof" KernelSU/kernel/ksu.c 2>&1
            echo; echo "== makro kompat yang dideteksi Makefile Nova (KSU_COMPAT_HAS_SELINUX_STATE dll.) =="
            grep -rhoE "KSU_COMPAT_HAS_[A-Z_]+|KSU_HAS_[A-Z_0-9]+" out/.config out/include/generated/autoconf.h 2>/dev/null | sort -u || true
            grep -c 'struct selinux_state ' security/selinux/include/security.h 2>&1 | sed 's/^/struct selinux_state di security.h: /'
            echo; echo "== simbol selinux_hide / avc_spoof di ksu.o =="
            "$HOME/neutron/bin/llvm-nm" out/drivers/kernelsu/ksu.o 2>&1 | grep -iE "selinux_hide|avc_spoof" || echo "(tidak ada di ksu.o)"
            echo; echo "== simbol di vmlinux =="
            if [ -s "$RUNNER_TEMP/syms.txt" ]; then grep -iE "selinux_hide|avc_spoof" "$RUNNER_TEMP/syms.txt" || echo "(tidak ada simbol selinux_hide/avc_spoof di vmlinux)"; else echo "(syms.txt belum dibuat)"; fi
            echo; echo "== objek hasil kompilasi =="
            ls -la out/drivers/kernelsu/*.o 2>/dev/null || true
          } > ../selinux_hide_diag.txt 2>&1 || true
          cat ../selinux_hide_diag.txt

      - name: Paket AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE ak3/patch ak3/ramdisk ak3/modules
          cp lk/out/arch/arm64/boot/Image.gz-dtb ak3/
          cat > ak3/anykernel.sh <<'ANYKERNEL_EOF'
          #!/sbin/sh
          # AnyKernel3 - LunarKnight / Xiaomi Redmi Note 5 Pro (whyred)
          properties() { '
          kernel.string=@KERNEL_NAME@ by @AUTHOR@
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          device.name1=whyred
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # whyred: non A/B, Image.gz-dtb (DTB attached), boot partition
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "@KERNEL_NAME@ (whyred)";
          ui_print "SukiSU-Nova + SUSFS @SUSFS_VER@ + NoMount @NM_VER@";
          ui_print "by @AUTHOR@";

          split_boot;
          flash_boot;
          ANYKERNEL_EOF
          sed -i "s|@KERNEL_NAME@|$EXPECT_RELEASE|g; s|@AUTHOR@|$KBUILD_BUILD_USER@$KBUILD_BUILD_HOST|g; s|@SUSFS_VER@|$SUSFS_VER|g; s|@NM_VER@|$NM_VER|g" ak3/anykernel.sh
          grep -q '@[A-Z_]*@' ak3/anykernel.sh && { echo "::error::placeholder anykernel.sh belum terisi"; exit 1; }
          cd ak3
          ZIP="LunarKnight-whyred-$EXPECT_RELEASE-SukiSU-Nova-SUSFS-NoMount-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP" . -x '*.git*'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unggah zip
        uses: actions/upload-artifact@v6
        with:
          name: LunarKnight-whyred
          path: ${{ env.ZIP }}

      - name: Unggah log dan config
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            build.log
            audit.log
            hook.log
            patch.log
            selinux_hide_diag.txt
            lk/out/.config
            lk/**/*.rej
          if-no-files-found: ignore
