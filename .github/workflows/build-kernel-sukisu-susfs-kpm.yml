name: Build Kernel Whyred (LunarKnight + SukiSU Ultra + SUSFS inline hook + KPM)

# Taruh di .github/workflows/build-kernel.yml, lalu Actions -> Run workflow.
#
# Komponen (semuanya dipasang ke source LunarKnight 4.19 saat build, tidak ada yang perlu di-commit ke source):
#   - SukiSU Ultra  : branch `builtin` lewat setup.sh resmi (Kconfig: KSU, KSU_SUSFS*, KPM)
#   - SUSFS         : mode INLINE HOOK. Sisi-kernel SUSFS v2.3.0 untuk 4.19 (fs/susfs.c, include/linux/susfs*.h)
#                     + hook inline SUSFS (exec, faccessat, stat, read, input, reboot, setresuid) dari repo
#                     JackA1ltman/NonGKI_Kernel_Build_2nd. Tanpa kprobes, tanpa hook manual buatan sendiri.
#   - KPM           : CONFIG_KPM=y (+ KALLSYMS_ALL), lalu Image di-patch dengan patch_linux (KernelPatch).
#
# SukiSU builtin TIDAK membawa sisi-kernel SUSFS maupun patch hook-nya, jadi dua hal itu diambil dari repo di atas.
# Skrip hook komunitas itu ditulis untuk varian KSU lain: tipe `ksu_su_compat_enabled` (static key vs bool) dan
# argumen `ksu_handle_sys_read` berbeda dari SukiSU. Dua hal itu disesuaikan otomatis dengan definisi di source
# SukiSU yang ter-clone, lalu SEMUA deklarasi ksu_* di kernel diaudit tipe + jumlah argumennya (gagal keras kalau beda).
#
# Urutan (error integrasi muncul di menit ke-1, bukan ke-40):
#   checkout -> penamaan kernel -> SukiSU -> SUSFS sisi-kernel -> hook inline + audit -> Neutron Clang -> config
#   -> kompilasi driver KSU + semua file yang kena hook (gagal cepat) -> build penuh -> verifikasi -> KPM -> AnyKernel3.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repo source kernel (owner/nama)"
        type: string
        default: "IndraSenzZ/LunarKnight"
      kernel_ref:
        description: "Branch / tag / commit source kernel"
        type: string
        default: "back"
      defconfig:
        description: "Defconfig (kosong = auto-detect, whyred-perf di arch/arm64/configs/vendor)"
        type: string
        default: ""
      kernel_name:
        description: "Kernel release string (uname -r)"
        type: string
        default: "4.19.325-st20-LunarKnight"
      ksu_ref:
        description: "Branch SukiSU-Ultra (builtin = tanpa kprobes, SUSFS inline hook, KPM)"
        type: string
        default: "builtin"
      susfs_repo_ref:
        description: "Ref repo JackA1ltman/NonGKI_Kernel_Build_2nd (sumber patch SUSFS 4.19 + skrip hook inline)"
        type: string
        default: "mainline"
      susfs_log:
        description: "Aktifkan CONFIG_KSU_SUSFS_ENABLE_LOG (log SUSFS ke dmesg)"
        type: boolean
        default: false
      kpm:
        description: "Aktifkan CONFIG_KPM (KernelPatch Module)"
        type: boolean
        default: true
      kpm_patch:
        description: "Patch Image dengan patch_linux (KernelPatch). Zip tanpa patch tetap dibuat sebagai cadangan"
        type: boolean
        default: true
      linker:
        description: "Linker kernel"
        type: choice
        options: [lld, gnu]
        default: lld
      release:
        description: "Upload zip ke GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build whyred
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_REF: ${{ inputs.kernel_ref }}
      DEFCONFIG_IN: ${{ inputs.defconfig }}
      KNAME_IN: ${{ inputs.kernel_name }}
      KSU_REF: ${{ inputs.ksu_ref }}
      SUSFS_REPO_REF: ${{ inputs.susfs_repo_ref }}
      SUSFS_LOG: ${{ inputs.susfs_log }}
      KPM: ${{ inputs.kpm }}
      KPM_PATCH: ${{ inputs.kpm_patch }}
      LINKER: ${{ inputs.linker }}
      KBUILD_BUILD_USER: Shirakumo
      KBUILD_BUILD_HOST: Github
      LC_ALL: C
      GH_TOKEN: ${{ github.token }}

    steps:
      # ------------------------------------------------------------------ source
      - name: Checkout source kernel
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: ${{ inputs.kernel_ref }}
          path: kernel
          fetch-depth: 1

      - name: Siapkan environment & dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            libelf-dev libssl-dev lz4 patch patchelf python3 python-is-python3 xz-utils zip unzip zstd \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          git config --global --add safe.directory '*'
          mkdir -p "$GITHUB_WORKSPACE/reports"
          {
            echo "KSRC=$GITHUB_WORKSPACE/kernel"
            echo "REPORTS=$GITHUB_WORKSPACE/reports"
            echo "KCF=-Wno-unknown-warning-option -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -Wno-incompatible-function-pointer-types -Wno-deprecated-non-prototype -Wno-strict-prototypes -Wno-unused-but-set-variable -Wno-array-bounds"
          } >> "$GITHUB_ENV"

      - name: Buat helper build (kmake.sh)
        run: |
          cat > "$GITHUB_WORKSPACE/kmake.sh" <<'EOF'
          #!/usr/bin/env bash
          cd "$KSRC" || exit 1
          LDARG=()
          [ "${LINKER:-lld}" = "lld" ] && LDARG=(LD=ld.lld)
          # LOCALVERSION= (kosong tapi terdefinisi) mencegah setlocalversion menambah '+' / -dirty
          exec make O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ "${LDARG[@]}" \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="$KCF" \
            LOCALVERSION= \
            "$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/kmake.sh"

          cat > "$GITHUB_WORKSPACE/relax_werror.sh" <<'EOF'
          #!/usr/bin/env bash
          # Hapus -Werror polos dari Makefile/Kbuild vendor + driver KSU (symlink tidak diikuti find, jadi KDIR eksplisit)
          set -eo pipefail
          cd "$KSRC"
          n=0
          while IFS= read -r f; do
            if grep -qE '(^|[[:space:]])-Werror([[:space:]]|$)' "$f"; then
              sed -E -i 's/(^|[[:space:]])-Werror([[:space:]]|$)/\1\2/g' "$f"
              n=$((n+1))
            fi
          done < <(find drivers techpack fs net sound security kernel mm lib block crypto arch/arm64 "${KDIR:-drivers/kernelsu}" \
                     -type f \( -name Makefile -o -name Kbuild -o -name 'Makefile.*' \) 2>/dev/null)
          echo "[i] -Werror dihapus dari $n Makefile"
          EOF
          chmod +x "$GITHUB_WORKSPACE/relax_werror.sh"

      # -------------------------------------------------- versi, nama kernel, defconfig
      - name: Deteksi versi, defconfig & terapkan nama kernel
        run: |
          cd "$KSRC"
          VER=$(sed -nE 's/^VERSION[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' Makefile | head -n1)
          PL=$(sed -nE 's/^PATCHLEVEL[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' Makefile | head -n1)
          SL=$(sed -nE 's/^SUBLEVEL[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' Makefile | head -n1)
          EV=$(sed -nE 's/^EXTRAVERSION[[:space:]]*=[[:space:]]*(.*)$/\1/p' Makefile | head -n1)
          BASE="$VER.$PL.$SL"
          KVER=$(make -s kernelversion)
          SHA=$(git rev-parse --short HEAD)
          echo "[i] Source: $KVER @ $SHA (base=$BASE, EXTRAVERSION='$EV')"
          [ "$VER.$PL" = "4.19" ] || { echo "::error::workflow ini khusus kernel 4.19, source ini $VER.$PL"; exit 1; }

          # ---- defconfig
          if [ -n "$DEFCONFIG_IN" ]; then
            DEF="$DEFCONFIG_IN"
          else
            DEF=""
            for c in vendor/whyred-perf_defconfig whyred-perf_defconfig vendor/whyred_defconfig whyred_defconfig; do
              if [ -f "arch/arm64/configs/$c" ]; then DEF="$c"; break; fi
            done
            if [ -z "$DEF" ]; then
              DEF=$(cd arch/arm64/configs && find . -type f -name '*whyred*' | sed 's|^\./||' | sort | sed -n '1p')
            fi
          fi
          if [ -z "$DEF" ] || [ ! -f "arch/arm64/configs/$DEF" ]; then
            echo "::error::defconfig whyred tidak ditemukan. Isi input 'defconfig'. Daftar config:"
            find arch/arm64/configs -type f | sort | sed -n '1,80p'
            exit 1
          fi
          echo "[i] Defconfig: $DEF"

          # ---- nama kernel: release = BASE + LV, LV diletakkan di CONFIG_LOCALVERSION
          KNAME="$KNAME_IN"
          case "$KNAME" in
            "$BASE"*) LV="${KNAME#"$BASE"}" ;;
            *)
              LV="-${KNAME#*-}"
              echo "::warning::kernel_name '$KNAME' tidak diawali versi source ($BASE). Release dipakai: ${BASE}${LV}"
              ;;
          esac
          [ -n "$LV" ] || { echo "::error::kernel_name tidak memuat suffix"; exit 1; }
          REL="${BASE}${LV}"
          [ "${#REL}" -le 60 ] || { echo "::error::release '$REL' terlalu panjang (batas UTS 64)"; exit 1; }
          echo "[i] Release target: $REL"

          # EXTRAVERSION lama + file localversion* + .scmversion akan mengotori release
          if [ -n "$EV" ]; then
            echo "[i] EXTRAVERSION '$EV' dikosongkan"
            sed -i -E 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION =/' Makefile
          fi
          for f in localversion*; do
            [ -e "$f" ] || continue
            echo "[i] hapus $f ('$(cat "$f")')"
            rm -f "$f"
          done
          : > .scmversion

          # Karakter khusus shell (mis. tanda kurung) di release merusak rule utsrelease.h bawaan Makefile.
          if [[ "$REL" =~ [^A-Za-z0-9._+-] ]]; then
            echo "::error::kernel_name memuat karakter selain [A-Za-z0-9._+-]; gunakan karakter aman saja"; exit 1
          fi

          {
            echo "KVER=$KVER"
            echo "KBASE=$BASE"
            echo "KSHA=$SHA"
            echo "DEF=$DEF"
            echo "KNAME=$KNAME"
            echo "LV=$LV"
            echo "REL=$REL"
          } >> "$GITHUB_ENV"

      - name: Pastikan source bersih dari sisa KernelSU / SUSFS / NoMount lama
        run: |
          cd "$KSRC"
          LEFT=$(grep -rIlE 'CONFIG_KSU|\bksu_handle_|susfs|CONFIG_NOMOUNT' \
                   --include=*.c --include=*.h --include=Makefile --include=Kconfig --include=Kbuild \
                   fs kernel drivers include security mm block arch net init lib ipc 2>/dev/null || true)
          if [ -e drivers/kernelsu ] || [ -e KernelSU ] || [ -e fs/susfs.c ] || [ -n "$LEFT" ]; then
            echo "::error::source sudah memuat sisa KernelSU/SUSFS/NoMount. Bersihkan dulu dari source (workflow ini memasang semuanya sendiri):"
            ls -d drivers/kernelsu KernelSU fs/susfs.c 2>/dev/null || true
            echo "$LEFT" | sed -n '1,40p'
            exit 1
          fi
          echo "[OK] source bersih"

      # --------------------------------------------------------- add-on 1: SukiSU-Ultra
      - name: Integrasi SukiSU-Ultra (setup.sh resmi)
        run: |
          cd "$KSRC"
          # setup.sh resmi: clone repo ke KernelSU/, symlink drivers/kernelsu, tambah entri drivers/Makefile + drivers/Kconfig
          curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$KSU_REF"

          # setup.sh berakhir dengan 'git checkout "$1" || echo ...': ref yang salah TIDAK error, diam-diam tetap di branch default
          [ -L drivers/kernelsu ] || { echo "::error::drivers/kernelsu bukan symlink, setup.sh gagal"; exit 1; }
          KD=$(readlink -f drivers/kernelsu)
          KROOT=$(git -C "$KD" rev-parse --show-toplevel)
          BR=$(git -C "$KROOT" rev-parse --abbrev-ref HEAD)
          [ "$BR" = "$KSU_REF" ] || { echo "::error::setup.sh tetap di branch '$BR', bukan '$KSU_REF' (branch tidak ada?)"; git -C "$KROOT" branch -r | sed -n '1,30p'; exit 1; }
          [ -f "$KD/Kconfig" ] && [ -f "$KD/Makefile" ] || { echo "::error::isi $KD tidak valid"; exit 1; }
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig && grep -q 'kernelsu' drivers/Makefile \
            || { echo "::error::entri KSU belum ada di drivers/Kconfig / drivers/Makefile"; exit 1; }
          grep -q 'config KSU_SUSFS$' "$KD/Kconfig" || { echo "::error::branch '$KSU_REF' tidak punya CONFIG_KSU_SUSFS (bukan builtin?)"; exit 1; }

          # versi KSU dihitung dari jumlah commit -> clone dangkal bikin manager menolak kernel
          if [ "$(git -C "$KROOT" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$KROOT" fetch --unshallow --tags || echo "::warning::unshallow gagal"
          fi
          KSU_SHA=$(git -C "$KROOT" rev-parse HEAD)
          echo "[i] SukiSU-Ultra@${KSU_REF} = $KSU_SHA ($(git -C "$KROOT" rev-list --count HEAD) commit)"
          {
            echo "KDIR=$(realpath --relative-to="$KSRC" "$KD")"
            echo "KSU_SHA=${KSU_SHA:0:9}"
          } >> "$GITHUB_ENV"
          echo "----- simbol Kconfig SukiSU -----"
          find "$KD" -type f \( -name 'Kconfig' -o -name 'Kconfig.*' \) -exec sed -nE 's/^[[:space:]]*config[[:space:]]+([A-Z0-9_]+).*/\1/p' {} + | sort -u | tr '\n' ' '
          echo

      # ------------------------------------------------------------ SUSFS sisi-kernel
      - name: Ambil patch SUSFS 4.19 + skrip hook inline (JackA1ltman/NonGKI_Kernel_Build_2nd)
        run: |
          NG="$RUNNER_TEMP/nongki"
          rm -rf "$NG"
          git clone --depth 1 --branch "$SUSFS_REPO_REF" https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd "$NG" \
            || { echo "::error::gagal clone JackA1ltman/NonGKI_Kernel_Build_2nd@$SUSFS_REPO_REF"; exit 1; }
          for f in Patches/Patch/susfs_patch_to_4.19.patch Patches/susfs_inline_hook_patches.sh; do
            [ -f "$NG/$f" ] || { echo "::error::$f tidak ada di repo itu (struktur berubah?)"; ls -R "$NG/Patches" | sed -n '1,40p'; exit 1; }
          done
          grep -q 'SUSFS v2.3.00 onwards' "$NG/Patches/susfs_inline_hook_patches.sh" \
            || echo "::warning::skrip hook inline tidak lagi menyebut 'SUSFS v2.3.00'; periksa kecocokan versi"
          echo "NG=$NG" >> "$GITHUB_ENV"
          echo "[i] NonGKI_Kernel_Build_2nd @ $(git -C "$NG" rev-parse --short HEAD)"

      - name: Pasang SUSFS sisi-kernel (susfs_patch_to_4.19.patch)
        run: |
          cat > "$RUNNER_TEMP/susfs_apply.sh" <<'EOF'
          #!/usr/bin/env bash
          # Pasang SUSFS sisi-kernel (fs/susfs.c, include/linux/susfs*.h + hook SUSFS di fs/, kernel/, mm/, security/).
          # Env: KSRC (root source kernel), NG (clone NonGKI_Kernel_Build_2nd), REPORTS (folder laporan)
          set -euo pipefail
          cd "$KSRC"
          P="$NG/Patches/Patch/susfs_patch_to_4.19.patch"
          LOG="$REPORTS/susfs_apply.log"
          : > "$LOG"
          [ -f "$P" ] || { echo "::error::patch SUSFS 4.19 tidak ada di $P"; exit 1; }
          grep -q '^diff --git' "$P" && grep -qi susfs "$P" || { echo "::error::$P bukan patch SUSFS"; exit 1; }
          cp "$P" "$REPORTS/susfs_patch_used.patch"
          echo "[i] patch: $(basename "$P") ($(grep -c '^diff --git' "$P") file)"

          # fuzz 3 = konteks include/blank diabaikan di ujung hunk. Hunk berisi logika tidak ikut "nyasar" karena
          # semua hasilnya dikompilasi dan dicek simbolnya di langkah berikutnya.
          if ! patch -p1 -F3 --no-backup-if-mismatch < "$P" >> "$LOG" 2>&1; then
            echo "[i] ada hunk yang ditolak, mencoba perbaikan yang dikenal"
          fi
          grep -E 'FAILED|fuzz' "$LOG" | sed -n '1,30p' || true

          # Hunk yang dikenal gagal di 4.19.325 + mount API backport: vfs_kern_mount() versi lama memanggil
          # alloc_vfsmnt() langsung, sedangkan di source ini alloc_vfsmnt() dipanggil dari vfs_create_mount().
          if [ -f fs/namespace.c.rej ]; then
            python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path
          rej = Path('fs/namespace.c.rej').read_text()
          if rej.count('@@') != 2 or 'susfs_alloc_non_unshare_ksu_vfsmnt(name ?:"none")' not in rej:
              print('::error::fs/namespace.c.rej berisi hunk yang tidak dikenal, tidak ditambal otomatis')
              print(rej[:3000]); sys.exit(1)
          p = Path('fs/namespace.c'); t = p.read_text()
          if 'susfs_alloc_non_unshare_ksu_vfsmnt' not in t:
              print('::error::helper susfs_alloc_non_unshare_ksu_vfsmnt tidak ada di namespace.c (hunk lain gagal?)'); sys.exit(1)
          m = re.search(r'(?m)^struct vfsmount \*vfs_create_mount\(struct fs_context \*fc\)\n\{.*?^\}\n', t, re.S)
          if not m:
              print('::error::vfs_create_mount() tidak ditemukan di fs/namespace.c'); sys.exit(1)
          fn = m.group(0)
          old = '\tmnt = alloc_vfsmnt(fc->source ?: "none");\n'
          if fn.count(old) != 1:
              print('::error::pola alloc_vfsmnt di vfs_create_mount() tidak unik'); sys.exit(1)
          new = ('#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                 '\t// proses ksu: pakai mnt_id palsu sampai /sdcard terdekripsi (hunk vfs_kern_mount, dipindah ke vfs_create_mount)\n'
                 '\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n'
                 '\t\tif (susfs_is_current_ksu_domain()) {\n'
                 '\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: "none");\n'
                 '\t\t\tgoto bypass_orig_flow;\n'
                 '\t\t}\n'
                 '\t}\n'
                 '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n'
                 + old +
                 '\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                 'bypass_orig_flow:\n'
                 '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n')
          p.write_text(t.replace(fn, fn.replace(old, new)))
          Path('fs/namespace.c.rej').unlink()
          print('[+] hunk vfs_kern_mount dipindah ke vfs_create_mount()')
          PYEOF
          fi
          if find . \( -name '*.rej' -o -name '*.orig' \) -not -path './out/*' | grep -q .; then
            echo "::error::masih ada .rej/.orig setelah patch SUSFS:"; find . \( -name '*.rej' -o -name '*.orig' \) | head
            exit 1
          fi
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            [ -f "$f" ] || { echo "::error::$f tidak ada setelah patch SUSFS"; exit 1; }
          done
          grep -q 'susfs' fs/Makefile || { echo "::error::fs/Makefile tidak memuat susfs.o"; exit 1; }
          SV=$(sed -nE 's/^#define[[:space:]]+SUSFS_VERSION[[:space:]]+"v?([0-9][0-9.]*)".*/\1/p' include/linux/susfs.h | head -n1)
          echo "[OK] SUSFS sisi-kernel terpasang: v${SV:-?}"
          echo "SUSFS_NUM=${SV:-}" >> "$GITHUB_ENV"
          EOF
          bash "$RUNNER_TEMP/susfs_apply.sh"

      # ------------------------------------------------------------- hook SUSFS inline
      - name: Hook SUSFS inline + penyesuaian ke API SukiSU + audit simbol
        run: |
          cd "$KSRC"
          echo "----- skrip hook inline SUSFS (komunitas) -----"
          bash "$NG/Patches/susfs_inline_hook_patches.sh" 2>&1 | tee "$REPORTS/hooks_script.log" | grep -E '^\[|Patched|failed|Warning|Skipped|Code in here|ksu_handle' || true
          if grep -q 'patch failed' "$REPORTS/hooks_script.log"; then
            echo "::error::ada file yang gagal di-hook oleh skrip komunitas (lihat reports/hooks_script.log)"
            grep -n 'patch failed' "$REPORTS/hooks_script.log"
            exit 1
          fi
          for f in fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c kernel/reboot.c; do
            grep -q 'ksu_handle' "$f" || { echo "::error::$f tidak memuat hook ksu_handle_* setelah skrip hook"; exit 1; }
          done
          cat > "$RUNNER_TEMP/ksu_adapt.py" <<'EOF'
          #!/usr/bin/env python3
          """Sesuaikan hook SUSFS inline (skrip komunitas v2.3.00, ditulis untuk varian KSU lain) dengan API SukiSU-Ultra
          yang BENAR-BENAR ter-clone, lalu audit. Tidak ada tebakan: tipe dibaca dari source SukiSU; kalau tidak cocok -> gagal.
          Env: KDIR (drivers/kernelsu), REPORTS"""
          import os, re, subprocess, sys
          from pathlib import Path

          KDIR = Path(os.environ['KDIR'])
          REPORT = Path(os.environ['REPORTS']) / 'hooks_audit.txt'
          rep = []

          def die(m):
              print(f'::error::{m}')
              REPORT.write_text('\n'.join(rep + ['ERROR: ' + m]))
              sys.exit(1)

          def log(m):
              print(m); rep.append(m)

          rd = lambda p: Path(p).read_bytes().decode('utf-8', 'surrogateescape')
          wr = lambda p, t: Path(p).write_bytes(t.encode('utf-8', 'surrogateescape'))

          src_files = [p for p in sorted(KDIR.rglob('*')) if p.is_file() and p.suffix in ('.c', '.h') and 'preinit' not in p.parts]
          src = '\n'.join(rd(p) for p in src_files)
          nosusfs = lambda s: s  # (tidak ada pembersihan ifdef: definisi dicari apa adanya)

          def arity_of(params):
              params = ' '.join(params.split())
              if params in ('', 'void'):
                  return 0
              d, n = 0, 1
              for ch in params:
                  d += (ch == '(') - (ch == ')')
                  if ch == ',' and d == 0:
                      n += 1
              return n

          def func_defs(name):
              """semua definisi (bukan deklarasi) name di source SukiSU -> daftar arity"""
              out = []
              for m in re.finditer(r'(?m)^(?!extern\b|#)(?:[A-Za-z_][\w \t\*\(\)]*?)?\b' + re.escape(name) + r'[ \t]*\(', src):
                  i, depth, j = m.end(), 1, m.end()
                  while j < len(src) and depth:
                      depth += (src[j] == '(') - (src[j] == ')')
                      j += 1
                  rest = re.sub(r'(?m)^[ \t]*#.*$', '', src[j:j + 400]).lstrip()
                  if rest.startswith('{'):
                      out.append(arity_of(src[i:j - 1]))
              return out

          def var_kind(name):
              """'static_key' | 'plain' | None"""
              if re.search(r'DEFINE_STATIC_KEY_(TRUE|FALSE)\(\s*' + re.escape(name) + r'\s*\)', src):
                  return 'static_key'
              if re.search(r'(?m)^[A-Za-z_][\w \t\*]*\b' + re.escape(name) + r'\b\s*(__read_mostly\s*)?(=[^;]*)?;', src):
                  return 'plain'
              return None

          # ---- 1) ksu_su_compat_enabled: SukiSU = bool biasa, skrip hook mengira static key
          HOOK_FILES = ['fs/exec.c', 'fs/open.c', 'fs/stat.c', 'fs/read_write.c', 'drivers/input/input.c', 'kernel/reboot.c', 'kernel/sys.c']
          k = var_kind('ksu_su_compat_enabled')
          log(f'[i] ksu_su_compat_enabled di SukiSU: {k}')
          if k is None:
              die('ksu_su_compat_enabled tidak didefinisikan SukiSU ref ini')
          if k == 'plain':
              for f in HOOK_FILES:
                  t = rd(f); o = t
                  t = t.replace('extern struct static_key_true ksu_su_compat_enabled;', 'extern bool ksu_su_compat_enabled;')
                  t = re.sub(r'static_branch_(?:un)?likely\(\s*&ksu_su_compat_enabled\s*\)', 'likely(ksu_su_compat_enabled)', t)
                  if t != o:
                      wr(f, t); log(f'[+] {f}: ksu_su_compat_enabled -> bool')

          # ---- 2) ksu_handle_sys_read: samakan arity dengan SukiSU
          ar = func_defs('ksu_handle_sys_read')
          log(f'[i] ksu_handle_sys_read di SukiSU: arity {ar}')
          if not ar:
              die('ksu_handle_sys_read tidak didefinisikan SukiSU ref ini')
          if 3 in ar:
              t = rd('fs/read_write.c'); o = t
              t = re.sub(r'extern __attribute__\(\(cold\)\) int ksu_handle_sys_read\(unsigned int fd\);',
                         'extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);', t)
              t = re.sub(r'\bksu_handle_sys_read\(fd\);', 'ksu_handle_sys_read(fd, &buf, &count);', t)
              if t != o:
                  wr('fs/read_write.c', t); log('[+] fs/read_write.c: ksu_handle_sys_read -> (fd, &buf, &count)')

          # ---- 3) audit semua deklarasi ksu_* di luar driver
          DIRS = ['fs', 'kernel', 'drivers', 'include', 'security', 'mm', 'block', 'arch', 'net', 'init', 'lib', 'ipc']
          files = subprocess.run(['grep', '-rIlE', r'\b(__)?ksu_[a-z0-9_]+', '--include=*.c', '--include=*.h'] + DIRS,
                                 capture_output=True, text=True).stdout.splitlines()
          ext = [f for f in files if f and not f.startswith('drivers/kernelsu/') and not f.startswith('KernelSU/')]
          log('[i] file kernel yang memanggil/mendeklarasikan simbol ksu_*: ' + ', '.join(ext))
          used = {}
          problems = []
          for f in ext:
              text = rd(f)
              # deklarasi extern
              for m in re.finditer(r'extern\s+([^;{}]*?)\b((?:__)?ksu_[a-z0-9_]+)\s*(\([^;{}]*\))?\s*;', text, re.S):
                  decl, name, params = m.group(1), m.group(2), m.group(3)
                  used.setdefault(name, set()).add(f)
                  if params is None:      # variabel
                      kind = var_kind(name)
                      want = 'static_key' if 'static_key' in decl else 'plain'
                      if kind is None:
                          problems.append(f'{f}: variabel {name} tidak didefinisikan SukiSU')
                      elif kind != want:
                          problems.append(f'{f}: variabel {name} dideklarasikan sebagai {want}, SukiSU mendefinisikan {kind}')
                  else:
                      ar = func_defs(name)
                      n = arity_of(params[1:-1])
                      if not ar:
                          problems.append(f'{f}: fungsi {name} tidak didefinisikan SukiSU')
                      elif n not in ar:
                          problems.append(f'{f}: {name} dideklarasikan {n} argumen, SukiSU {sorted(set(ar))}')
              # panggilan ganda di satu fungsi
              for ch in re.split(r'(?m)^\}\s*$', text):
                  cnt = {}
                  for l in ch.split('\n'):
                      s = re.sub(r'"(?:\\.|[^"\\])*"', '""', l.strip())
                      if s.startswith(('*', '/*', '//')) or 'extern' in s:
                          continue
                      for sym in re.findall(r'\b(ksu_handle_[a-z0-9_]+)\s*\(', s):
                          cnt[sym] = cnt.get(sym, 0) + 1
                  for sym, c in cnt.items():
                      if c > 1 and sym not in ('ksu_handle_execveat', 'ksu_handle_execveat_sucompat'):
                          problems.append(f'{f}: {sym} dipanggil {c}x dalam satu fungsi')
          if problems:
              die('Hook kernel tidak cocok dengan SukiSU ref ini:\n  ' + '\n  '.join(problems))
          if not used:
              die('tidak ada satu pun hook ksu_* terpasang di kernel')
          log(f'[OK] {len(used)} simbol ksu_* dari kernel cocok dengan definisi SukiSU: ' + ', '.join(sorted(used)))
          REPORT.write_text('\n'.join(rep))
          EOF
          python3 -I "$RUNNER_TEMP/ksu_adapt.py"
          echo "----- ringkasan hook -----"
          git diff --stat -- fs kernel drivers/input security mm block | tail -n 40

      # ---------------------------------------------------------------- toolchain
      - name: Pasang Neutron Clang
        run: |
          mkdir -p "$HOME/neutron"
          cd "$HOME/neutron"
          curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
          chmod +x antman
          if ! ./antman -S || [ ! -x bin/clang ]; then
            echo "::warning::antman gagal, fallback ke release clang-build-catalogue"
            URL=$(gh api repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
                    --jq '[.assets[] | select(.name | endswith(".tar.zst"))][0].browser_download_url')
            [ -n "$URL" ] || { echo "::error::tidak menemukan asset Neutron Clang"; exit 1; }
            curl -fsSL "$URL" | tar --zstd -x
          fi
          [ -x bin/clang ] || { echo "::error::Neutron Clang tidak terpasang"; exit 1; }
          export PATH="$HOME/neutron/bin:$PATH"
          if ! clang --version >/dev/null 2>&1; then
            echo "::warning::clang tidak bisa jalan, mencoba antman --patch=glibc"
            ./antman --patch=glibc
          fi
          clang --version | sed -n '1p'
          ld.lld --version | sed -n '1p'
          command -v aarch64-linux-gnu-elfedit arm-linux-gnueabi-ld
          echo "$HOME/neutron/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------- konfigurasi
      - name: Konfigurasi kernel
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          cd "$KSRC"
          rm -rf out
          "$GITHUB_WORKSPACE/kmake.sh" "$DEF"

          CFG=out/.config
          sc() { scripts/config --file "$CFG" "$@"; }

          DEFINED=$(find "$KDIR" -type f \( -name 'Kconfig' -o -name 'Kconfig.*' \) -exec cat {} + \
                    | sed -nE 's/^[[:space:]]*config[[:space:]]+([A-Z0-9_]+)[[:space:]]*$/\1/p' | sort -u)
          has_sym() { printf '%s\n' "$DEFINED" | grep -qx "$1"; }
          die() { echo "::error::$*"; exit 1; }

          # --- SukiSU-Ultra builtin (tanpa kprobes: hook inline SUSFS ada di source kernel)
          has_sym KSU || die "simbol KSU tidak ada di Kconfig SukiSU (ref salah?)"
          sc -e KSU
          for s in KSU_KPROBES_KSUD KSU_TAMPER_SYSCALL_TABLE KSU_HACK_ARM64_BRANCH_LINK KSU_DEBUG KSU_NOPRINTK KSU_SUSFS_SUS_SU; do
            has_sym "$s" && sc -d "$s"
          done

          # --- SUSFS (mode inline hook): semua opsi yang didefinisikan branch ini
          has_sym KSU_SUSFS || die "KSU_SUSFS tidak ada di Kconfig SukiSU branch ini"
          SUSFS_ON=""
          for s in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME \
                   KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            if has_sym "$s"; then
              sc -e "$s"
              SUSFS_ON="$SUSFS_ON $s"
            else
              echo "::warning::$s tidak ada di Kconfig branch ini -> dilewati"
            fi
          done
          if has_sym KSU_SUSFS_ENABLE_LOG; then
            if [ "$SUSFS_LOG" = "true" ]; then sc -e KSU_SUSFS_ENABLE_LOG; else sc -d KSU_SUSFS_ENABLE_LOG; fi
          fi

          # --- KPM
          if [ "$KPM" = "true" ]; then
            has_sym KPM || die "CONFIG_KPM tidak ada di Kconfig SukiSU ref ini"
            sc -e KPM
          fi

          # --- baseline Zygisk / KPM: SELinux + KALLSYMS_ALL (dan dependensinya)
          sc -e KEYS -e SECURITY -e SECURITY_SELINUX
          sc -e DEBUG_KERNEL -e KALLSYMS -e KALLSYMS_ALL -e STACKTRACE

          # --- nama kernel
          sc --set-str LOCALVERSION "$LV"
          sc -d LOCALVERSION_AUTO

          "$GITHUB_WORKSPACE/kmake.sh" olddefconfig

          if grep -qx 'CONFIG_COMPAT_VDSO=y' "$CFG" && ! command -v arm-linux-gnueabi-gcc >/dev/null 2>&1; then
            echo "::warning::CONFIG_COMPAT_VDSO=y tapi arm-linux-gnueabi-gcc tidak ada -> dimatikan"
            sc -d COMPAT_VDSO
            "$GITHUB_WORKSPACE/kmake.sh" olddefconfig
          fi

          fail=0
          need() { grep -qx "$1" "$CFG" || { echo "::error::$CFG tidak memuat $1 (dependency tidak terpenuhi?)"; fail=1; }; }
          forbid() { if grep -qx "$1" "$CFG"; then echo "::error::$1 aktif padahal harus mati"; fail=1; fi; }
          need CONFIG_KSU=y
          need CONFIG_SECURITY=y
          need CONFIG_SECURITY_SELINUX=y
          need CONFIG_DEBUG_KERNEL=y
          need CONFIG_KALLSYMS=y
          need CONFIG_KALLSYMS_ALL=y
          need CONFIG_STACKTRACE=y
          [ "$KPM" != "true" ] || need CONFIG_KPM=y
          for s in $SUSFS_ON; do need "CONFIG_${s}=y"; done
          need "CONFIG_LOCALVERSION=\"$LV\""
          forbid CONFIG_LOCALVERSION_AUTO=y
          forbid CONFIG_KSU_KPROBES_KSUD=y
          forbid CONFIG_KSU_SUSFS_SUS_SU=y
          forbid CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          forbid CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          if [ "$fail" != 0 ]; then
            echo "::group::Kconfig SukiSU (untuk diagnosa dependency)"
            find "$KDIR" -type f \( -name 'Kconfig' -o -name 'Kconfig.*' \) -exec cat {} +
            echo "::endgroup::"
            exit 1
          fi
          echo "SUSFS_ON=$SUSFS_ON" >> "$GITHUB_ENV"
          echo "----- ringkasan config -----"
          grep -E '^(# )?CONFIG_(KSU|KPM|KEYS|SECURITY_SELINUX|DEBUG_KERNEL|STACKTRACE|KPROBES|KALLSYMS|LOCALVERSION|LTO|CC_STACKPROTECTOR)' "$CFG" || true

      - name: Compat - makro fallthrough (hanya jika kernel belum punya)
        run: |
          cd "$KSRC"
          if grep -rqE '^[[:space:]]*#[[:space:]]*define[[:space:]]+fallthrough\b' include/linux include/uapi 2>/dev/null; then
            echo "[=] makro fallthrough sudah ada di kernel"
          else
            cat >> include/linux/compiler.h <<'EOF'

          /* LunarKnight CI: makro fallthrough (kernel < 5.4 belum punya; dipakai driver SukiSU) */
          #ifndef fallthrough
          # ifdef __has_attribute
          #  if __has_attribute(__fallthrough__)
          #   define fallthrough __attribute__((__fallthrough__))
          #  endif
          # endif
          # ifndef fallthrough
          #  define fallthrough do {} while (0)
          # endif
          #endif
          EOF
            echo "[+] makro fallthrough ditambahkan ke include/linux/compiler.h"
          fi

      - name: Relax -Werror bawaan vendor
        run: bash "$GITHUB_WORKSPACE/relax_werror.sh"

      # Driver SukiSU branch builtin ditulis untuk kernel >= 5.x. Di 4.19 beberapa header/API belum ada
      # (terbukti dari log: 'linux/static_call.h' file not found). Semua penyesuaian di bawah IDEMPOTEN,
      # hanya menyentuh pola yang memang ada, dan dilaporkan ke reports/driver_adapt.log.
      - name: Adaptasi driver SukiSU ke kernel 4.19 (header / API yang belum ada)
        run: |
          cd "$KSRC"
          cat > "$RUNNER_TEMP/ksu_419.py" <<'EOF'
          import os, re, pathlib
          KSRC = pathlib.Path(os.environ['KSRC'])
          KD = KSRC / os.environ['KDIR']
          REP = pathlib.Path(os.environ['REPORTS']) / 'driver_adapt.log'
          rep = []
          def log(m):
              print(m); rep.append(m)

          def have_header(h):
              for base in ('include', 'include/uapi', 'arch/arm64/include', 'arch/arm64/include/uapi',
                           'arch/arm64/include/generated', 'out/include', 'out/include/generated'):
                  if (KSRC / base / h).exists():
                      return True
              return False

          # header yang tidak ada di 4.19 -> pengganti ('' = hapus include)
          HDR = {'linux/static_call.h': '', 'linux/hex.h': 'linux/kernel.h', 'uapi/linux/mount.h': 'linux/fs.h'}
          missing = {h: r for h, r in HDR.items() if not have_header(h)}
          log('[i] header tidak ada di kernel: ' + (', '.join(sorted(missing)) or '-'))

          # access_ok 2 argumen (>=5.0) vs 3 argumen (4.19: access_ok(type, addr, size))
          up = KSRC / 'arch/arm64/include/asm/uaccess.h'
          three_arg = up.exists() and re.search(r'access_ok\(\s*(int\s+)?type\b', up.read_text(errors='ignore')) is not None
          log(f'[i] access_ok kernel ini: {"3 argumen (VERIFY_*)" if three_arg else "2 argumen"}')

          def fix_access_ok(t):
              pat = re.compile(r'\baccess_ok\s*\(')
              out, i, n = [], 0, 0
              while True:
                  m = pat.search(t, i)
                  if not m:
                      out.append(t[i:]); break
                  ls = t.rfind('\n', 0, m.start()) + 1
                  if t[ls:m.start()].lstrip().startswith('#'):      # #define / #undef: jangan disentuh
                      out.append(t[i:m.end()]); i = m.end(); continue
                  out.append(t[i:m.end()])
                  j, d, cur, args = m.end(), 1, m.end(), []
                  while j < len(t) and d > 0:
                      c = t[j]
                      if c in '([{': d += 1
                      elif c in ')]}': d -= 1
                      elif c == ',' and d == 1:
                          args.append(t[cur:j]); cur = j + 1
                      j += 1
                  args.append(t[cur:j-1])
                  if len(args) == 2:
                      out.append('VERIFY_READ, ' + ','.join(args).lstrip()); n += 1
                  else:
                      out.append(','.join(args))
                  out.append(')'); i = j
              return ''.join(out), n

          changed = {}
          for f in sorted(KD.rglob('*')):
              if not f.is_file() or f.suffix not in ('.c', '.h'):
                  continue
              t0 = f.read_text(errors='ignore'); t = t0
              for h, repl in missing.items():
                  rx = re.compile(r'^([ \t]*)#[ \t]*include[ \t]*<' + re.escape(h) + r'>.*$', re.M)
                  if rx.search(t):
                      new = (r'\1/* LunarKnight CI: <' + h + '> tidak ada di 4.19 */') if not repl \
                            else (r'\1#include <' + repl + r'>  /* LunarKnight CI: pengganti <' + h + '> */')
                      t = rx.sub(new, t)
                      changed.setdefault(str(f.relative_to(KD)), []).append('include ' + h)
              if three_arg and 'access_ok' in t:
                  t, n = fix_access_ok(t)
                  if n:
                      changed.setdefault(str(f.relative_to(KD)), []).append(f'access_ok x{n} -> VERIFY_READ')
              if t != t0:
                  f.write_text(t)
          for f, what in changed.items():
              log(f'[+] {f}: ' + '; '.join(what))
          if not changed:
              log('[=] tidak ada penyesuaian yang perlu diterapkan')

          # Peringatan keamanan runtime: sucompat(..., NULL, NULL, NULL) di fs/exec.c bisa NULL-deref di driver yang
          # menyentuh argv (bootloop saat execve pertama). Hanya dilaporkan, supaya tidak false-positive.
          ex = (KSRC / 'fs/exec.c').read_text(errors='ignore')
          bad = [l.strip() for l in ex.splitlines() if re.search(r'ksu_handle_execveat_sucompat\s*\(.*NULL\s*,\s*NULL\s*,\s*NULL', l)]
          if bad:
              log('::warning::fs/exec.c memanggil ksu_handle_execveat_sucompat dengan argv/envp NULL: ' + ' | '.join(bad))
          REP.write_text('\n'.join(rep) + '\n')
          EOF
          python3 -I "$RUNNER_TEMP/ksu_419.py"
          git -C "$KDIR/.." diff --stat 2>/dev/null | tail -n 15 || true

      # Probe: driver KSU + semua file kernel yang kena patch (beberapa menit) supaya kegagalan hook/API ketahuan
      # sebelum build penuh. Objek hasilnya dipakai ulang oleh build penuh.
      - name: Kompilasi driver KSU + file yang kena hook (gagal cepat)
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          cd "$KSRC"
          LOG="$GITHUB_WORKSPACE/reports/probe.log"
          OBJS=$( { git diff --name-only; git ls-files -o --exclude-standard; } \
                  | grep -E '\.c$' | grep -vE '^(KernelSU|out)/' | grep -E '^(fs|kernel|mm|security|drivers|block|net|lib)/' \
                  | sed 's/\.c$/.o/' | sort -u )
          echo "[i] objek yang dikompilasi dulu:"; echo "$OBJS" | tr '\n' ' '; echo
          # Siapkan header hasil generate (autoconf.h, utsrelease.h, compile.h, dst). Tanpa ini driver KSU gagal:
          #   kernel_includes.h: fatal error: 'generated/compile.h' file not found
          # compile.h di 4.19 dibuat oleh init/Makefile (prasyarat init/version.o), bukan oleh target 'prepare'.
          if ! { "$GITHUB_WORKSPACE/kmake.sh" -j"$(nproc)" prepare scripts \
                 && "$GITHUB_WORKSPACE/kmake.sh" -j"$(nproc)" init/version.o; } > "$LOG" 2>&1 \
             || [ ! -s out/include/generated/compile.h ]; then
            echo "::group::Prepare gagal"; tail -n 60 "$LOG"; echo "::endgroup::"
            echo "::error::gagal menyiapkan header generated (prepare / compile.h). Lihat reports/probe.log"
            exit 1
          fi
          echo "[OK] out/include/generated/compile.h siap"
          # -k: lanjutkan semua objek supaya SEMUA error terlihat sekaligus, bukan hanya yang pertama
          # shellcheck disable=SC2086
          if ! "$GITHUB_WORKSPACE/kmake.sh" -k -j"$(nproc)" drivers/kernelsu/ $OBJS >> "$LOG" 2>&1 \
             || ! find out/drivers/kernelsu -name '*.o' 2>/dev/null | grep -q .; then
            echo "::group::Probe gagal - daftar error"
            grep -nE 'error:|Error [0-9]+|undefined reference|ld(\.lld)?: error' "$LOG" | sed -n '1,80p' || true
            echo "::endgroup::"
            echo "::error::Driver SukiSU-Ultra@${KSU_REF} atau file yang kena hook gagal kompilasi di kernel ini. Lihat reports/probe.log"
            exit 1
          fi
          if grep -q 'You have not integrated susfs' "$LOG"; then
            echo "::error::Kbuild SukiSU melaporkan SUSFS belum terintegrasi di kernel. Lihat reports/probe.log"
            exit 1
          fi
          grep -aE -- '-- (SukiSU|SUSFS_VERSION|KERNEL_TYPE|KPM|.*using SUSFS_INLINE_HOOK)' "$LOG" | sort -u | sed -n '1,10p' || true
          grep -aq 'using SUSFS_INLINE_HOOK' "$LOG" \
            || { echo "::error::Kbuild SukiSU tidak melaporkan 'using SUSFS_INLINE_HOOK' (CONFIG_KSU_SUSFS tidak aktif?)"; exit 1; }
          echo "[OK] driver + file hook terkompilasi, mode SUSFS_INLINE_HOOK aktif"

      - name: Gerbang nama kernel (utsrelease.h harus persis sama)
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          cd "$KSRC"
          "$GITHUB_WORKSPACE/kmake.sh" include/generated/utsrelease.h > "$RUNNER_TEMP/uts.log" 2>&1 \
            || { cat "$RUNNER_TEMP/uts.log"; echo "::error::gagal membuat utsrelease.h dengan release '$REL'"; exit 1; }
          GOT=$(sed -nE 's/^#define UTS_RELEASE "(.*)"$/\1/p' out/include/generated/utsrelease.h)
          echo "[i] UTS_RELEASE = $GOT"
          [ "$GOT" = "$REL" ] || { echo "::error::UTS_RELEASE '$GOT' != '$REL'"; exit 1; }
          [ "$(cat out/include/config/kernel.release)" = "$REL" ] \
            || { echo "::error::kernel.release '$(cat out/include/config/kernel.release)' != '$REL'"; exit 1; }
          echo "[OK] nama kernel: $REL"

      # ------------------------------------------------------------------------ build
      - name: Build kernel
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          cd "$KSRC"
          set +e
          "$GITHUB_WORKSPACE/kmake.sh" -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Build gagal (rc=$rc)"
            echo "::group::Ringkasan error"
            grep -nE 'error:|Error [0-9]+|undefined reference|ld(\.lld)?: error' "$GITHUB_WORKSPACE/build.log" | sed -n '1,60p' || true
            echo "::endgroup::"
            echo "::group::Re-run -j1 (error pertama yang bersih)"
            "$GITHUB_WORKSPACE/kmake.sh" -j1 2>&1 | tail -n 80 || true
            echo "::endgroup::"
            exit 1
          fi
          ls -la out/arch/arm64/boot

      - name: Verifikasi hasil build (KSU, SUSFS inline, KPM, nama kernel)
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          set -euo pipefail
          cd "$KSRC"
          # Zygisk Next mendokumentasikan minimum KernelSU kernel 10940
          KSU_CODE=$(grep -aoE -- '-- .*(KernelSU|SukiSU)[A-Za-z -]*[Vv]ersion: *[0-9]+' "$GITHUB_WORKSPACE/build.log" | tail -n1 | grep -oE '[0-9]+$' || true)
          if [ -z "$KSU_CODE" ]; then
            echo "::warning::versi kernel-side SukiSU tidak terbaca dari build.log; gerbang minimum Zygisk Next (10940) dilewati"
            KSU_CODE="?"
          else
            echo "[i] kernel-side SukiSU version code: $KSU_CODE"
            [ "$KSU_CODE" -ge 10940 ] || { echo "::error::versi $KSU_CODE di bawah minimum Zygisk Next 10940"; exit 1; }
          fi
          for c in CONFIG_KSU=y CONFIG_KSU_SUSFS=y CONFIG_SECURITY=y CONFIG_SECURITY_SELINUX=y CONFIG_DEBUG_KERNEL=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_STACKTRACE=y; do
            grep -qx "$c" out/.config || { echo "::error::$c wajib"; exit 1; }
          done
          [ "$KPM" != "true" ] || grep -qx 'CONFIG_KPM=y' out/.config || { echo "::error::CONFIG_KPM=y tidak aktif"; exit 1; }
          grep -aq 'You have not integrated susfs' "$GITHUB_WORKSPACE/build.log" \
            && { echo "::error::Kbuild SukiSU melaporkan SUSFS belum terintegrasi"; exit 1; } || true
          SV=$(grep -aoE -- '-- SUSFS_VERSION: *v?[0-9][0-9.]*' "$GITHUB_WORKSPACE/build.log" | tail -n1 | grep -oE '[0-9][0-9.]*$' || true)
          [ -n "$SV" ] && echo "[i] SUSFS_VERSION: v$SV" || SV="${SUSFS_NUM:-}"
          echo "SUSFS_NUM=$SV" >> "$GITHUB_ENV"
          REL_BUILT=$(cat out/include/config/kernel.release)
          [ "$REL_BUILT" = "$REL" ] || { echo "::error::kernel.release '$REL_BUILT' != '$REL'"; exit 1; }
          grep -aqF "Linux version $REL" out/arch/arm64/boot/Image \
            || { echo "::error::string 'Linux version $REL' tidak ada di Image"; exit 1; }

          llvm-nm out/vmlinux > "$RUNNER_TEMP/syms.txt"
          fail=0
          for s in ksu_handle_execveat ksu_handle_execveat_sucompat ksu_handle_faccessat ksu_handle_stat ksu_handle_sys_reboot ksu_handle_vfs_fstat ksu_handle_sys_read ksu_handle_input_handle_event path_umount; do
            grep -qw "$s" "$RUNNER_TEMP/syms.txt" || { echo "::error::simbol $s tidak ada di vmlinux"; fail=1; }
          done
          grep -qi 'susfs' "$RUNNER_TEMP/syms.txt" || { echo "::error::simbol susfs tidak ada di vmlinux (SUSFS tidak ter-link)"; fail=1; }
          # kprobes TIDAK boleh dipakai KSU di mode ini
          if grep -qE ' [tT] (ksu_kprobe|ksu_.*kretprobe|ksu_.*register_kprobe)' "$RUNNER_TEMP/syms.txt"; then
            echo "::warning::ada simbol kprobe milik KSU di vmlinux (tidak diharapkan di mode inline)"
          fi
          if [ "$KPM" = "true" ]; then
            if grep -qi 'kpm' "$RUNNER_TEMP/syms.txt"; then
              echo "[OK] simbol KPM ada di vmlinux: $(grep -ci 'kpm' "$RUNNER_TEMP/syms.txt") simbol"
            else
              echo "::warning::CONFIG_KPM=y tapi tidak ada simbol kpm di vmlinux. Uji dengan demo-hello.kpm setelah boot."
            fi
          fi
          [ "$fail" = 0 ] || exit 1
          echo "KSU_DRIVER_CODE=$KSU_CODE" >> "$GITHUB_ENV"
          echo "[OK] semua komponen ter-link; Image memuat 'Linux version $REL'"
          grep -E ' (ksu_handle_|susfs_)' "$RUNNER_TEMP/syms.txt" | sed -n '1,40p' || true

      # --------------------------------------------------------------------- KPM patch
      - name: Patch Image dengan KernelPatch (patch_linux) - opsional, gagal = lanjut tanpa patch
        if: ${{ inputs.kpm && inputs.kpm_patch }}
        run: |
          BOOT="$KSRC/out/arch/arm64/boot"
          W="$RUNNER_TEMP/kpm"
          rm -rf "$W"; mkdir -p "$W"
          skip() { echo "::warning::$*"; echo "KPM_PATCHED=false" >> "$GITHUB_ENV"; exit 0; }
          [ -f "$BOOT/Image" ] && [ -f "$BOOT/Image.gz" ] && [ -f "$BOOT/Image.gz-dtb" ] \
            || skip "Image / Image.gz / Image.gz-dtb mentah tidak lengkap, patch KPM dilewati"
          cp "$BOOT/Image" "$W/Image"
          # sumber utama: release resmi; cadangan: kpm/patch_linux di repo SukiSU_patch
          URL=$(gh api repos/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest \
                  --jq '[.assets[] | select(.name=="patch_linux")][0].browser_download_url' 2>/dev/null || true)
          if [ -n "$URL" ] && [ "$URL" != "null" ] && curl -fsSL "$URL" -o "$W/patch_linux"; then
            echo "[i] patch_linux: $URL"
          else
            echo "[i] release patch_linux tidak tersedia, pakai repo SukiSU_patch"
            git clone --depth 1 https://github.com/ShirkNeko/SukiSU_patch "$RUNNER_TEMP/sukisu_patch" \
              && cp "$RUNNER_TEMP/sukisu_patch/kpm/patch_linux" "$W/patch_linux" \
              || skip "gagal mendapatkan patch_linux"
          fi
          chmod +x "$W/patch_linux"
          cd "$W"
          ./patch_linux > patch.log 2>&1 || { cat patch.log; skip "patch_linux gagal"; }
          tail -n 20 patch.log
          [ -s oImage ] || skip "oImage tidak dihasilkan"
          A=$(stat -c %s Image); B=$(stat -c %s oImage)
          echo "[i] Image=$A oImage=$B"
          [ "$B" -ge "$A" ] && [ "$B" -le $((A + 8000000)) ] || skip "ukuran oImage ($B) tidak wajar vs Image ($A)"
          GZS=$(stat -c %s "$BOOT/Image.gz")
          cmp -s -n "$GZS" "$BOOT/Image.gz-dtb" "$BOOT/Image.gz" || skip "Image.gz-dtb bukan 'Image.gz + dtb', tidak bisa dirakit ulang dengan aman"
          tail -c +$((GZS + 1)) "$BOOT/Image.gz-dtb" > dtbs.bin
          [ -s dtbs.bin ] || skip "payload dtb kosong"
          gzip -n -9 -c oImage > Image.gz.kpm
          cat Image.gz.kpm dtbs.bin > Image.gz-dtb.kpm
          echo "KPM_PATCHED=true" >> "$GITHUB_ENV"
          echo "KPM_IMG=$W/Image.gz-dtb.kpm" >> "$GITHUB_ENV"
          echo "[OK] Image ter-patch KPM: $(stat -c %s Image.gz-dtb.kpm) bytes"

      # --------------------------------------------------------------------- packaging
      - name: Package AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3
          grep -q '^split_boot()' tools/ak3-core.sh && grep -q '^flash_boot()' tools/ak3-core.sh \
            || { echo "::error::AnyKernel3 terbaru tidak punya split_boot/flash_boot, sesuaikan anykernel.sh"; exit 1; }
          rm -rf .git .github README.md

          cat > anykernel.sh <<'EOF'
          #!/sbin/sh
          # AnyKernel3 - LunarKnight / Xiaomi Redmi Note 5 Pro (whyred)
          properties() { '
          kernel.string=@KNAME@ by Shirakumo@Github
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          '; } # end properties

          # whyred: non A/B, kernel Image.gz-dtb (appended DTB), partisi boot
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "@KNAME@";
          ui_print "by Shirakumo@Github";
          ui_print "SukiSU Ultra + SUSFS@SUSFSV@ (inline hook) + @KPM@";
          ui_print " ";

          split_boot;
          flash_boot;

          ui_print " ";
          ui_print "Selesai. Reboot, lalu pakai manager SukiSU Ultra yang cocok dengan kernel ini.";
          EOF
          SUSFSV=""
          [ -z "${SUSFS_NUM:-}" ] || SUSFSV=" v${SUSFS_NUM}"
          KPM_TXT="tanpa KPM"
          [ "$KPM" != "true" ] || KPM_TXT="KPM"
          sed -i "s|@KNAME@|${KNAME}|g; s|@SUSFSV@|${SUSFSV}|g; s|@KPM@|${KPM_TXT}|g" anykernel.sh
          grep -n 'kernel.string' anykernel.sh

          BOOT="$KSRC/out/arch/arm64/boot"
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp "$BOOT/Image.gz-dtb" "$RUNNER_TEMP/Image.gz-dtb.plain"
          elif [ -f "$BOOT/Image.gz" ]; then
            echo "::warning::Image.gz-dtb tidak ada, merakit Image.gz + dtb"
            mapfile -t DTBS < <(find "$BOOT/dts" -name '*whyred*.dtb' | sort)
            [ "${#DTBS[@]}" -gt 0 ] || mapfile -t DTBS < <(find "$BOOT/dts" -name '*sdm636*.dtb' | sort)
            [ "${#DTBS[@]}" -gt 0 ] || { echo "::error::DTB whyred tidak ditemukan"; ls -R "$BOOT" | sed -n '1,60p'; exit 1; }
            cat "$BOOT/Image.gz" "${DTBS[@]}" > "$RUNNER_TEMP/Image.gz-dtb.plain"
          else
            echo "::error::tidak ada Image.gz-dtb / Image.gz di $BOOT"; ls -la "$BOOT"; exit 1
          fi
          SZ=$(stat -c %s "$RUNNER_TEMP/Image.gz-dtb.plain")
          echo "[i] Image.gz-dtb = $SZ bytes"
          [ "$SZ" -gt 4000000 ] || { echo "::error::Image.gz-dtb terlalu kecil ($SZ bytes), build tidak wajar"; exit 1; }

          STAMP=$(TZ=Asia/Jakarta date +%Y%m%d-%H%M)
          TAG="LunarKnight-whyred-${KBASE}-st20-SukiSU-susfs${SUSFS_NUM}-inline"
          [ "$KPM" != "true" ] || TAG="${TAG}-KPM"

          mkzip() {
            local img="$1" zip="$2"
            cp "$img" Image.gz-dtb
            rm -f "$GITHUB_WORKSPACE/$zip"
            zip -r9 "$GITHUB_WORKSPACE/$zip" . -x '*.git*' -x 'Image.gz-dtb.*' > /dev/null
            unzip -l "$GITHUB_WORKSPACE/$zip" | grep -E 'anykernel.sh|Image.gz-dtb|update-binary'
          }
          if [ "${KPM_PATCHED:-false}" = "true" ]; then
            ZIP_MAIN="${TAG}-patched-${STAMP}-${KSHA}.zip"
            ZIP_ALT="${TAG}-unpatched-fallback-${STAMP}-${KSHA}.zip"
            mkzip "$KPM_IMG" "$ZIP_MAIN"
            mkzip "$RUNNER_TEMP/Image.gz-dtb.plain" "$ZIP_ALT"
          else
            ZIP_MAIN="${TAG}-${STAMP}-${KSHA}.zip"
            ZIP_ALT=""
            mkzip "$RUNNER_TEMP/Image.gz-dtb.plain" "$ZIP_MAIN"
          fi
          {
            echo "ZIP=$ZIP_MAIN"
            echo "ZIP_ALT=$ZIP_ALT"
            echo "STAMP=$STAMP"
          } >> "$GITHUB_ENV"
          cp "$KSRC/out/.config" "$GITHUB_WORKSPACE/kernel.config"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: LunarKnight-whyred-${{ env.STAMP }}
          path: ${{ github.workspace }}/LunarKnight-whyred-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload log, config & laporan integrasi
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/build.log
            ${{ github.workspace }}/kernel.config
            ${{ github.workspace }}/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Ringkasan
        if: success()
        run: |
          {
            echo "### LunarKnight whyred — ${REL}"
            echo "- Kernel: \`${KERNEL_REPO}@${KERNEL_REF}\` (${KSHA}), defconfig \`${DEF}\`"
            echo "- SukiSU-Ultra: \`SukiSU-Ultra/SukiSU-Ultra@${KSU_REF}\` (${KSU_SHA}), mode SUSFS inline hook (tanpa kprobes)"
            echo "- SUSFS: v${SUSFS_NUM:-?} | opsi:${SUSFS_ON} | log: ${SUSFS_LOG}"
            echo "- Patch/hook SUSFS 4.19: \`JackA1ltman/NonGKI_Kernel_Build_2nd@${SUSFS_REPO_REF}\`"
            echo "- KPM: CONFIG_KPM=${KPM}, Image ter-patch: ${KPM_PATCHED:-false}"
            echo "- Zygisk: KALLSYMS_ALL=y, SELinux=y, kernel-side KSU code ${KSU_DRIVER_CODE} (Zygisk Next min 10940)"
            echo "- Zip utama: \`${ZIP}\`"
            [ -z "${ZIP_ALT}" ] || echo "- Zip cadangan (tanpa patch KPM): \`${ZIP_ALT}\`"
            echo
            echo "Setelah boot: manager SukiSU harus versi yang cocok dengan kernel; uji KPM dengan demo-hello.kpm."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release (opsional)
        if: ${{ inputs.release }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release create "whyred-${STAMP}" LunarKnight-whyred-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "LunarKnight whyred ${KBASE} (${STAMP})" \
            --notes "Release ${REL} | ${KERNEL_REPO}@${KERNEL_REF} @ ${KSHA} | SukiSU-Ultra ${KSU_REF} @ ${KSU_SHA} | SUSFS v${SUSFS_NUM:-?} inline hook | KPM ${KPM} (patched: ${KPM_PATCHED:-false})"
