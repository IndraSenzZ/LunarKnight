name: Build Kernel Whyred (LunarKnight + SukiSU Ultra builtin + SUSFS 2.3.0 + NoMount + KPM)

# Taruh di .github/workflows/build-kernel.yml, lalu Actions -> Run workflow.
#
# Urutan (integrasi dulu, toolchain belakangan, supaya error integrasi muncul di menit ke-1, bukan ke-40):
#   checkout LunarKnight -> penamaan kernel -> bersihkan sisa KSU/SUSFS lama
#   -> SukiSU-Ultra (branch builtin) -> SUSFS v2.3.0 (4.19) -> hook manual sesuai panduan SukiSU
#   -> audit API hook -> NoMount -> backport path_umount -> Neutron Clang -> config
#   -> build -> verifikasi -> (opsional) patch KPM -> AnyKernel3.
#
# CATATAN JUJUR: SUSFS v2.3.0 untuk kernel 4.19 TIDAK ada yang resmi (branch kernel-4.19 susfs4ksu
# berhenti di v1.5.5). Mode susfs_mode=port memakai port komunitas (satu tree) dan diterapkan TANPA
# fuzz. Kalau ada hunk yang tidak cocok dengan LunarKnight, workflow berhenti di tahap itu dan
# mengunggah laporan (reports/susfs.log), tidak pernah menghasilkan kernel "setengah SUSFS".
# susfs_mode=off menghasilkan baseline SukiSU + KPM + NoMount untuk memvalidasi sisa stack lebih dulu.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repo source kernel (owner/nama)"
        type: string
        default: "IndraSenzZ/LunarKnight"
      kernel_ref:
        description: "Branch / tag / commit source kernel"
        type: string
        default: "back"
      defconfig:
        description: "Defconfig (kosong = auto-detect *whyred* di arch/arm64/configs)"
        type: string
        default: ""
      kernel_name:
        description: "Kernel release string (uname -r)"
        type: string
        default: "4.19.325-ST20-LunarKnight"
      ksu_repo:
        description: "Repo SukiSU-Ultra (owner/nama)"
        type: string
        default: "SukiSU-Ultra/SukiSU-Ultra"
      ksu_ref:
        description: "Branch SukiSU-Ultra. 'builtin' = tanpa kprobes, hook manual (non-GKI / GKI1)"
        type: string
        default: "builtin"
      hook_mode:
        description: "manual = patch hook sesuai panduan SukiSU | branch_link = CONFIG_KSU_HACK_ARM64_BRANCH_LINK (tanpa patch hook)"
        type: choice
        options: [manual, branch_link]
        default: manual
      susfs_mode:
        description: "port = SUSFS v2.3.0 port 4.19 (strict) | patch = patch buatan sendiri dari repo ini | off = tanpa SUSFS"
        type: choice
        options: [port, patch, "off"]
        default: port
      susfs_port_repo:
        description: "Repo port SUSFS v2.3.0 untuk 4.19 (mode port)"
        type: string
        default: "fabiannabil1/susfs-4.19-nongki"
      susfs_port_ref:
        description: "Branch/tag repo port (mode port)"
        type: string
        default: "main"
      susfs_patch_path:
        description: "Path patch SUSFS di repo workflow ini (mode patch)"
        type: string
        default: "patches/susfs-v2.3.0-4.19.patch"
      nomount_ref:
        description: "Ref NoMount: 'latest' = release terbaru, atau tag/branch/commit"
        type: string
        default: "latest"
      kpm:
        description: "Aktifkan CONFIG_KPM (KernelPatch Module)"
        type: boolean
        default: true
      kpm_patch:
        description: "Patch Image dengan patch_linux (KernelPatch). Zip tanpa patch tetap dibuat sebagai cadangan"
        type: boolean
        default: true
      linker:
        description: "Linker kernel"
        type: choice
        options: [lld, gnu]
        default: lld
      release:
        description: "Upload zip ke GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build whyred
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_REF: ${{ inputs.kernel_ref }}
      DEFCONFIG_IN: ${{ inputs.defconfig }}
      KNAME_IN: ${{ inputs.kernel_name }}
      KSU_REPO: ${{ inputs.ksu_repo }}
      KSU_REF: ${{ inputs.ksu_ref }}
      HOOK_MODE: ${{ inputs.hook_mode }}
      SUSFS_MODE: ${{ inputs.susfs_mode }}
      SUSFS_PORT_REPO: ${{ inputs.susfs_port_repo }}
      SUSFS_PORT_REF: ${{ inputs.susfs_port_ref }}
      SUSFS_PATCH_PATH: ${{ inputs.susfs_patch_path }}
      NOMOUNT_REF_IN: ${{ inputs.nomount_ref }}
      KPM: ${{ inputs.kpm }}
      KPM_PATCH: ${{ inputs.kpm_patch }}
      LINKER: ${{ inputs.linker }}
      KBUILD_BUILD_USER: Shirakumo
      KBUILD_BUILD_HOST: Github
      LC_ALL: C
      GH_TOKEN: ${{ github.token }}

    steps:
      # ------------------------------------------------------------------ source
      - name: Checkout source kernel
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: ${{ inputs.kernel_ref }}
          path: kernel
          fetch-depth: 1

      - name: Checkout repo workflow (hanya untuk patch SUSFS buatan sendiri)
        if: ${{ inputs.susfs_mode == 'patch' }}
        uses: actions/checkout@v6
        with:
          path: wf
          fetch-depth: 1

      - name: Siapkan environment & dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            libelf-dev libssl-dev lz4 patch patchelf python3 python-is-python3 xz-utils zip unzip zstd \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          git config --global --add safe.directory '*'
          mkdir -p "$GITHUB_WORKSPACE/reports"
          {
            echo "KSRC=$GITHUB_WORKSPACE/kernel"
            echo "KCF=-Wno-unknown-warning-option -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -Wno-incompatible-function-pointer-types -Wno-deprecated-non-prototype -Wno-strict-prototypes -Wno-unused-but-set-variable -Wno-array-bounds"
          } >> "$GITHUB_ENV"

      - name: Buat helper build (kmake.sh)
        run: |
          cat > "$GITHUB_WORKSPACE/kmake.sh" <<'EOF'
          #!/usr/bin/env bash
          cd "$KSRC" || exit 1
          LDARG=()
          [ "${LINKER:-lld}" = "lld" ] && LDARG=(LD=ld.lld)
          # LOCALVERSION= (kosong tapi terdefinisi) mencegah setlocalversion menambah '+' / -dirty
          exec make O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ "${LDARG[@]}" \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="$KCF" \
            LOCALVERSION= \
            "$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/kmake.sh"

      # -------------------------------------------------- versi, nama kernel, defconfig
      - name: Deteksi versi, defconfig & terapkan nama kernel
        run: |
          cd "$KSRC"
          VER=$(sed -nE 's/^VERSION[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' Makefile | head -n1)
          PL=$(sed -nE 's/^PATCHLEVEL[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' Makefile | head -n1)
          SL=$(sed -nE 's/^SUBLEVEL[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' Makefile | head -n1)
          EV=$(sed -nE 's/^EXTRAVERSION[[:space:]]*=[[:space:]]*(.*)$/\1/p' Makefile | head -n1)
          BASE="$VER.$PL.$SL"
          KVER=$(make -s kernelversion)
          SHA=$(git rev-parse --short HEAD)
          echo "[i] Source: $KVER @ $SHA  (base=$BASE, EXTRAVERSION='$EV')"

          # ---- defconfig
          if [ -n "$DEFCONFIG_IN" ]; then
            DEF="$DEFCONFIG_IN"
          else
            DEF=""
            for c in whyred_defconfig vendor/whyred_defconfig whyred-perf_defconfig vendor/whyred-perf_defconfig; do
              if [ -f "arch/arm64/configs/$c" ]; then DEF="$c"; break; fi
            done
            if [ -z "$DEF" ]; then
              DEF=$(cd arch/arm64/configs && find . -type f -name '*whyred*' | sed 's|^\./||' | sort | sed -n '1p')
            fi
          fi
          if [ -z "$DEF" ] || [ ! -f "arch/arm64/configs/$DEF" ]; then
            echo "::error::defconfig whyred tidak ditemukan. Isi input 'defconfig'. Daftar config:"
            find arch/arm64/configs -type f | sort | sed -n '1,80p'
            exit 1
          fi
          echo "[i] Defconfig: $DEF"

          # ---- nama kernel: release = BASE + LV, LV diletakkan di CONFIG_LOCALVERSION
          KNAME="$KNAME_IN"
          case "$KNAME" in
            "$BASE"*) LV="${KNAME#"$BASE"}" ;;
            *)
              LV="-${KNAME#*-}"
              echo "::warning::kernel_name '$KNAME' tidak diawali versi source ($BASE). Release dipakai: ${BASE}${LV}"
              ;;
          esac
          [ -n "$LV" ] || { echo "::error::kernel_name tidak memuat suffix"; exit 1; }
          REL="${BASE}${LV}"
          [ "${#REL}" -le 60 ] || { echo "::error::release '$REL' terlalu panjang (batas UTS 64)"; exit 1; }
          echo "[i] Release target: $REL"

          # EXTRAVERSION lama + file localversion* + .scmversion akan mengotori release
          if [ -n "$EV" ]; then
            echo "[i] EXTRAVERSION '$EV' dikosongkan"
            sed -i -E 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION =/' Makefile
          fi
          for f in localversion*; do
            [ -e "$f" ] || continue
            echo "[i] hapus $f ('$(cat "$f")')"
            rm -f "$f"
          done
          : > .scmversion

          # Karakter khusus shell (mis. tanda kurung) di release merusak rule utsrelease.h bawaan
          # Makefile. Quoting HANYA dibutuhkan kalau release memuat karakter semacam itu; untuk
          # release aman ([A-Za-z0-9._+-]) Makefile dibiarkan apa adanya.
          if [[ "$REL" =~ [^A-Za-z0-9._+-] ]]; then
          echo "[i] release memuat karakter khusus, quote rule utsrelease.h"
          python3 - <<'PYEOF'
          from pathlib import Path
          import sys
          p = Path('Makefile')
          t = p.read_text()
          old = '\\"$(KERNELRELEASE)\\"'
          new = '\\""$(KERNELRELEASE)"\\"'
          if new in t:
              print('[=] rule utsrelease.h sudah ter-quote')
          elif old in t:
              p.write_text(t.replace(old, new))
              print(f'[+] rule utsrelease.h di-quote ({t.count(old)} tempat)')
          else:
              print('::error::pola UTS_RELEASE di Makefile tidak dikenali; tidak aman memakai tanda kurung di release')
              sys.exit(1)
          PYEOF
          else
            echo "[i] release '$REL' aman, quoting utsrelease.h tidak diperlukan"
          fi

          {
            echo "KVER=$KVER"
            echo "KBASE=$BASE"
            echo "KSHA=$SHA"
            echo "DEF=$DEF"
            echo "KNAME=$KNAME"
            echo "LV=$LV"
            echo "REL=$REL"
          } >> "$GITHUB_ENV"

      # ---------------------------------------------- bersihkan sisa integrasi lama
      - name: Bersihkan sisa KernelSU / SUSFS lama dari source
        run: |
          cat > "$RUNNER_TEMP/strip_ksu.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Hapus semua blok #if*CONFIG_KSU* (hook KSU / SUSFS lama) dari source kernel.
          Blok positif: isi 'then' dibuang, isi '#else' dipertahankan. Blok negatif: sebaliknya.
          Bentuk non-standar (#elif, kondisi campuran) -> berhenti, tidak mengarang."""
          import re, subprocess, sys
          from pathlib import Path

          def die(m):
              print(f'::error::{m}')
              sys.exit(1)

          DIRS = ['fs', 'kernel', 'drivers', 'include', 'security', 'mm', 'block', 'arch',
                  'net', 'init', 'lib', 'ipc', 'sound', 'techpack']
          out = subprocess.run(
              ['grep', '-rIlE', 'CONFIG_KSU|ksu_|susfs', '--include=*.c', '--include=*.h', '--include=*.S'] + DIRS,
              capture_output=True, text=True).stdout.splitlines()
          cands = [c for c in out if c and not c.startswith('drivers/kernelsu/')]

          DIR_RE = re.compile(r'^[ \t]*#[ \t]*(ifdef|ifndef|if|elif|else|endif)\b(.*)$')
          KSU_RE = re.compile(r'(!\s*)?(?:defined\s*\(\s*)?CONFIG_KSU\w*')

          def classify(kind, rest, path):
              if 'CONFIG_KSU' not in rest:
                  return 'other'
              if kind == 'ifndef':
                  return 'neg'
              if kind == 'ifdef':
                  return 'pos'
              if '||' in rest:
                  die(f'{path}: kondisi campuran "{rest.strip()}" tidak bisa dibersihkan otomatis')
              m = KSU_RE.search(rest)
              return 'neg' if (m and m.group(1)) else 'pos'

          def strip(text, path):
              res, stack, changed = [], [], False
              for line in text.split('\n'):
                  m = DIR_RE.match(line)
                  if not m:
                      if all(e[1] for e in stack):
                          res.append(line)
                      continue
                  kind, rest = m.group(1), m.group(2)
                  if kind in ('if', 'ifdef', 'ifndef'):
                      t = classify(kind, rest, path)
                      parent = all(e[1] for e in stack)
                      if t == 'pos':
                          stack.append(['pos', False]); changed = True
                      elif t == 'neg':
                          stack.append(['neg', True]); changed = True
                      else:
                          stack.append(['other', True])
                          if parent:
                              res.append(line)
                      continue
                  if not stack:
                      die(f'{path}: #{kind} tanpa pasangan')
                  top = stack[-1]
                  if kind == 'elif':
                      if top[0] != 'other':
                          die(f'{path}: #elif di dalam blok KSU tidak didukung pembersih otomatis')
                      if all(e[1] for e in stack[:-1]):
                          res.append(line)
                  elif kind == 'else':
                      if top[0] == 'pos':
                          top[1] = True
                      elif top[0] == 'neg':
                          top[1] = False
                      elif all(e[1] for e in stack[:-1]):
                          res.append(line)
                  else:  # endif
                      stack.pop()
                      if top[0] == 'other' and all(e[1] for e in stack):
                          res.append(line)
              if stack:
                  die(f'{path}: #if tidak seimbang setelah pembersihan')
              return '\n'.join(res), changed

          n = 0
          for c in cands:
              p = Path(c)
              t = p.read_bytes().decode('utf-8', 'surrogateescape')
              t2, ch = strip(t, c)
              if ch:
                  p.write_bytes(t2.encode('utf-8', 'surrogateescape'))
                  n += 1
                  print(f'[-] blok KSU dibuang dari {c}')
          print(f'[i] {n} file dibersihkan')

          # sisa yang masih berupa kode (bukan komentar)
          left = []
          for c in cands:
              for i, l in enumerate(Path(c).read_text(errors='replace').split('\n'), 1):
                  s = l.strip()
                  if s.startswith(('*', '/*', '//')):
                      continue
                  if re.search(r'CONFIG_KSU|\bksu_[a-z0-9_]+\b', l):
                      left.append(f'{c}:{i}: {s}')
          if left:
              print('::error::masih ada referensi KSU lama berbentuk non-standar (hapus manual dari source):')
              print('\n'.join(left[:80]))
              sys.exit(1)
          print('[OK] tidak ada sisa referensi ksu_/CONFIG_KSU di luar drivers/kernelsu')
          PYEOF
          cd "$KSRC"
          # file SUSFS lama + referensi build-nya
          rm -f fs/susfs.c include/linux/susfs*.h
          [ -f fs/Makefile ] && sed -i '/susfs/d' fs/Makefile
          # KernelSU lama
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile
          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          python3 "$RUNNER_TEMP/strip_ksu.py"

      # --------------------------------------------------------- add-on 1: SukiSU-Ultra
      - name: Integrasi SukiSU-Ultra (setup.sh resmi + verifikasi ref + fallback)
        run: |
          cd "$KSRC"
          REPO_URL="https://github.com/${KSU_REPO}.git"

          # setup.sh semua fork diakhiri 'git checkout "$1" || echo ...': ref salah TIDAK error,
          # diam-diam tetap di branch default. Validasi dulu.
          if ! { git ls-remote --exit-code --heads "$REPO_URL" "$KSU_REF" >/dev/null 2>&1 \
                 || git ls-remote --exit-code --tags "$REPO_URL" "$KSU_REF" >/dev/null 2>&1 \
                 || [[ "$KSU_REF" =~ ^[0-9a-f]{7,40}$ ]]; }; then
            echo "::error::ref '$KSU_REF' tidak ada di $KSU_REPO. Branch yang tersedia:"
            git ls-remote --heads "$REPO_URL" | sed 's#.*refs/heads/##'
            exit 1
          fi

          clean_ksu() {
            rm -rf KernelSU KernelSU-Next drivers/kernelsu
            sed -i '/kernelsu/d' drivers/Makefile
            sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          }

          ksu_ok() {
            [ -L drivers/kernelsu ] || { echo "[!] drivers/kernelsu bukan symlink"; return 1; }
            local kd kroot origin head refsha
            kd=$(readlink -f drivers/kernelsu)
            [ -f "$kd/Kconfig" ] && { [ -f "$kd/Makefile" ] || [ -f "$kd/Kbuild" ]; } \
              || { echo "[!] isi drivers/kernelsu tidak valid"; return 1; }
            kroot=$(git -C "$kd" rev-parse --show-toplevel 2>/dev/null) \
              || { echo "[!] $kd bukan git repo"; return 1; }
            [ "$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig)" = "1" ] \
              || { echo "[!] source Kconfig KSU bukan tepat 1x di drivers/Kconfig"; return 1; }
            grep -q 'kernelsu' drivers/Makefile || { echo "[!] drivers/Makefile belum memuat kernelsu"; return 1; }
            origin=$(git -C "$kroot" remote get-url origin 2>/dev/null || true)
            case "${origin,,}" in
              *"${KSU_REPO,,}"*) ;;
              *) echo "[!] origin = '$origin', bukan $KSU_REPO"; return 1 ;;
            esac
            head=$(git -C "$kroot" rev-parse HEAD)
            refsha=$(git -C "$kroot" rev-parse -q --verify "origin/${KSU_REF}^{commit}" 2>/dev/null \
                     || git -C "$kroot" rev-parse -q --verify "${KSU_REF}^{commit}" 2>/dev/null || true)
            if [ -z "$refsha" ] || [ "$head" != "$refsha" ]; then
              echo "[!] HEAD=$head tidak sama dengan ref '$KSU_REF' ($refsha)"
              return 1
            fi
            return 0
          }

          manual_ksu() {
            echo "[i] fallback integrasi manual SukiSU-Ultra"
            clean_ksu
            git clone --branch "$KSU_REF" "$REPO_URL" KernelSU || {
              git clone "$REPO_URL" KernelSU && git -C KernelSU checkout "$KSU_REF"; }
            ln -sfn ../KernelSU/kernel drivers/kernelsu
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
            python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('drivers/Kconfig')
          lines = p.read_text().split('\n')
          idx = max(i for i, l in enumerate(lines) if l.strip() == 'endmenu')
          lines.insert(idx, 'source "drivers/kernelsu/Kconfig"')
          p.write_text('\n'.join(lines))
          PYEOF
          }

          clean_ksu
          # panduan resmi SukiSU: setup.sh diambil dari 'main', branch lewat argumen
          SETUP_URL="https://raw.githubusercontent.com/${KSU_REPO}/main/kernel/setup.sh"
          echo "[i] setup.sh: $SETUP_URL  (arg: $KSU_REF)"
          if curl -fsSL "$SETUP_URL" | bash -s "$KSU_REF" && ksu_ok; then
            echo "[OK] setup.sh resmi berhasil dan lolos verifikasi"
          else
            echo "::warning::setup.sh resmi gagal / tidak lolos verifikasi, pakai integrasi manual"
            manual_ksu
          fi
          ksu_ok || { echo "::error::integrasi SukiSU-Ultra gagal setelah fallback"; exit 1; }

          KD=$(readlink -f drivers/kernelsu)
          KROOT=$(git -C "$KD" rev-parse --show-toplevel)
          # versi KSU dihitung dari jumlah commit -> clone dangkal bikin manager menolak kernel
          if [ "$(git -C "$KROOT" rev-parse --is-shallow-repository)" = "true" ]; then
            echo "[i] clone dangkal terdeteksi, unshallow supaya versi KSU benar"
            git -C "$KROOT" fetch --unshallow --tags || echo "::warning::unshallow gagal"
          fi
          KSU_SHA=$(git -C "$KROOT" rev-parse HEAD)
          echo "[i] SukiSU-Ultra ${KSU_REPO}@${KSU_REF} = $KSU_SHA ($(git -C "$KROOT" rev-list --count HEAD) commit)"
          {
            echo "KDIR=$(realpath --relative-to="$KSRC" "$KD")"
            echo "KROOT=$(realpath --relative-to="$KSRC" "$KROOT")"
            echo "KSU_SHA=${KSU_SHA:0:9}"
          } >> "$GITHUB_ENV"
          echo "----- simbol Kconfig SukiSU -----"
          find "$KD" -type f \( -name 'Kconfig' -o -name 'Kconfig.*' \) -exec sed -nE 's/^[[:space:]]*config[[:space:]]+([A-Z0-9_]+).*/\1/p' {} + | sort -u | tr '\n' ' '
          echo

      # ------------------------------------------------------------ add-on 3: SUSFS v2.3.0
      - name: Integrasi SUSFS v2.3.0 untuk 4.19 (strict, tanpa fuzz)
        run: |
          cd "$KSRC"
          REPORT="$GITHUB_WORKSPACE/reports/susfs.log"
          : > "$REPORT"
          case "$SUSFS_MODE" in
            off)
              echo "[i] susfs_mode=off: build baseline SukiSU + KPM + NoMount (tanpa SUSFS)"
              echo "SUSFS_ACTIVE=false" >> "$GITHUB_ENV"
              echo "SUSFS_SRC=off" >> "$GITHUB_ENV"
              exit 0
              ;;
            port)
              git clone --depth 1 --branch "$SUSFS_PORT_REF" "https://github.com/${SUSFS_PORT_REPO}.git" "$RUNNER_TEMP/susfs-port"
              PATCH=$(find "$RUNNER_TEMP/susfs-port/patches" -type f -name '0002-susfs-v2.3.0-4.19*.patch' | sort | head -n1)
              if [ -z "$PATCH" ]; then
                echo "::error::patch SUSFS v2.3.0 4.19 tidak ditemukan di ${SUSFS_PORT_REPO}@${SUSFS_PORT_REF}. Isi repo:"
                find "$RUNNER_TEMP/susfs-port" -path '*/.git' -prune -o -type f -print | sed -n '1,60p'
                exit 1
              fi
              SUSFS_SRC="port:${SUSFS_PORT_REPO}@$(git -C "$RUNNER_TEMP/susfs-port" rev-parse --short HEAD)"
              ;;
            patch)
              PATCH="$GITHUB_WORKSPACE/wf/$SUSFS_PATCH_PATH"
              [ -f "$PATCH" ] || { echo "::error::patch '$SUSFS_PATCH_PATH' tidak ada di repo workflow"; exit 1; }
              SUSFS_SRC="patch:${SUSFS_PATCH_PATH}"
              ;;
            *) echo "::error::susfs_mode '$SUSFS_MODE' tidak dikenal"; exit 1 ;;
          esac

          echo "[i] patch: $PATCH ($(grep -c '^diff --git' "$PATCH") file)"
          if git apply --check --whitespace=nowarn "$PATCH" > "$REPORT.check" 2>&1; then
            git apply --whitespace=nowarn "$PATCH"
            echo "[OK] patch SUSFS cocok 100% (tanpa fuzz) dan diterapkan"
          else
            {
              echo "=== git apply --check ==="
              cat "$REPORT.check"
              echo
              echo "=== patch --dry-run -F0 (daftar hunk gagal per file) ==="
              patch -p1 --dry-run -F0 --no-backup-if-mismatch < "$PATCH" 2>&1 || true
            } > "$REPORT"
            echo "::group::Hunk SUSFS yang tidak cocok dengan source ini"
            grep -E 'FAILED|can.t find file|Hunk #|^checking file' "$REPORT" | grep -B1 -E 'FAILED|can.t find' | sed -n '1,160p' || true
            echo "::endgroup::"
            echo "::error::Patch SUSFS v2.3.0 tidak cocok dengan source ini. Patch asli hanya teruji di satu tree (LG sm8250); fuzz sengaja dimatikan karena hunk yang 'berhasil' dengan fuzz bisa mendarat di fungsi yang salah. Unduh artifact build-log -> reports/susfs.log lalu porting hunk yang gagal ke patches/susfs-v2.3.0-4.19.patch dan jalankan ulang dengan susfs_mode=patch (atau susfs_mode=off untuk baseline)."
            exit 1
          fi

          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            [ -f "$f" ] || { echo "::error::$f tidak ada setelah patch"; exit 1; }
          done
          grep -q 'susfs' fs/Makefile || { echo "::error::fs/Makefile tidak memuat susfs.o"; exit 1; }
          grep -q 'v2\.3\.0' fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h \
            || { echo "::error::string versi v2.3.0 tidak ditemukan di source SUSFS hasil patch"; exit 1; }
          echo "SUSFS_ACTIVE=true" >> "$GITHUB_ENV"
          echo "SUSFS_SRC=$SUSFS_SRC" >> "$GITHUB_ENV"

      # ------------------------------------------------- hook manual (panduan SukiSU builtin)
      - name: Hook manual SukiSU builtin + audit API (idempotent, gagal keras)
        run: |
          cat > "$RUNNER_TEMP/ksu_hooks.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Hook manual SukiSU-Ultra (branch builtin) sesuai https://sukisu.org/guide/how-to-integrate
          - prototype dibaca dari source SukiSU yang benar-benar di-clone
          - hook TIDAK dipasang kalau fungsi syscall itu sudah memuat hook ksu_* (mis. dari patch SUSFS)
          - setelah itu: audit duplikat + audit simbol yang dipanggil kernel tapi tidak didefinisikan KSU"""
          import os, re, subprocess, sys
          from pathlib import Path

          KDIR = Path(os.environ['KDIR'])
          MODE = os.environ.get('HOOK_MODE', 'manual')
          REPORT = Path(os.environ['GITHUB_WORKSPACE']) / 'reports' / 'hooks.txt'
          rep = []

          def die(m):
              print(f'::error::{m}')
              REPORT.write_text('\n'.join(rep + ['ERROR: ' + m]))
              sys.exit(1)

          def warn(m):
              print(f'::warning::{m}')
              rep.append('WARN: ' + m)

          def log(m):
              print(m)
              rep.append(m)

          def rd(p):
              return Path(p).read_bytes().decode('utf-8', 'surrogateescape')

          def wr(p, t):
              Path(p).write_bytes(t.encode('utf-8', 'surrogateescape'))

          if not KDIR.is_dir():
              die(f'{KDIR} tidak ada')
          ksrc_files = [p for p in sorted(KDIR.rglob('*')) if p.is_file() and p.suffix in ('.c', '.h')]
          src = '\n'.join(rd(p) for p in ksrc_files)

          def find_def(name):
              """(params, arity) kalau name didefinisikan (bukan sekadar dideklarasikan) di source KSU."""
              for m in re.finditer(r'(?m)^(?!extern\b|#)(?:[A-Za-z_][\w \t\*\(\)]*?)?\b' + re.escape(name) + r'[ \t]*\(', src):
                  i = m.end()
                  depth, j = 1, i
                  while j < len(src) and depth:
                      depth += (src[j] == '(') - (src[j] == ')')
                      j += 1
                  params = ' '.join(src[i:j - 1].split())
                  rest = src[j:j + 40].lstrip()
                  if not rest.startswith('{'):
                      continue
                  if params in ('', 'void'):
                      return params, 0
                  d, n = 0, 1
                  for ch in params:
                      if ch == '(':
                          d += 1
                      elif ch == ')':
                          d -= 1
                      elif ch == ',' and d == 0:
                          n += 1
                  return params, n
              return None

          # key, simbol, argumen, wajib
          SPEC = [
              ('execveat', 'ksu_handle_execveat', 5, True),
              ('faccessat', 'ksu_handle_faccessat', 4, True),
              ('stat', 'ksu_handle_stat', 3, True),
              ('reboot', 'ksu_handle_sys_reboot', 4, True),
              ('newfstat', 'ksu_handle_newfstat_ret', 2, False),
          ]
          use = {}
          bad = []
          for key, sym, arity, req in SPEC:
              d = find_def(sym)
              if d is None:
                  (bad.append(f'{sym} tidak didefinisikan SukiSU') if req
                   else warn(f'{sym} tidak ada di SukiSU -> hook {key} dilewati (Android 16+ butuh newfstat_ret)'))
                  use[key] = False
              elif d[1] != arity:
                  (bad.append(f'{sym}: {d[1]} argumen, panduan: {arity} ({d[0]})') if req
                   else warn(f'{sym}: {d[1]} argumen, panduan: {arity} -> dilewati'))
                  use[key] = False
              else:
                  use[key] = True
                  log(f'[i] {sym}({d[0]})')
          if bad and MODE == 'manual':
              die('Versi SukiSU ini tidak cocok dengan template hook panduan: ' + '; '.join(bad))

          def func_span(text, func_re):
              m = re.search(func_re, text, re.M)
              if not m:
                  return None
              end = text.find('\n}', m.end())
              return (m.start(), end) if end >= 0 else None

          def hook(path, label, func_res, anchors, block, last=False, required=True):
              if not Path(path).exists():
                  return (die if required else warn)(f'{path} tidak ada')
              t = rd(path)
              sp = None
              for fr in func_res:
                  sp = func_span(t, fr)
                  if sp:
                      break
              if not sp:
                  return (die if required else warn)(f'{path}: fungsi untuk hook {label} tidak ditemukan')
              s, e = sp
              body = t[s:e]
              if re.search(r'\bksu_\w+', body):
                  return log(f'[=] {path}: {label} sudah memuat hook ksu_* di fungsinya -> dilewati')
              am = None
              for a in anchors:
                  ms = list(re.finditer(a, body, re.M))
                  if ms:
                      am = ms[-1] if last else ms[0]
                      break
              if not am:
                  return (die if required else warn)(f'{path}: anchor hook {label} tidak ditemukan')
              ls = t.rfind('\n', 0, s + am.start()) + 1
              pe = ls - 1
              ps = t.rfind('\n', 0, pe) + 1
              prev = t[ps:pe].strip()
              if prev.startswith('/*') and prev.endswith('*/'):
                  ls = ps
              wr(path, t[:ls] + block + t[ls:])
              log(f'[+] {path}: hook {label} terpasang')

          EXEC = ('#ifdef CONFIG_KSU\n'
                  '\textern int ksu_handle_execveat(int *, struct filename **, void *, void *, int *);\n'
                  '\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n'
                  '#endif\n\n')
          FACC = ('#ifdef CONFIG_KSU\n'
                  '\textern int ksu_handle_faccessat(int *, const char __user **, int *, int *);\n'
                  '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n'
                  '#endif\n')
          STAT = ('#ifdef CONFIG_KSU\n'
                  '\textern int ksu_handle_stat(int *, const char __user **, int *);\n'
                  '\tksu_handle_stat(&dfd, &filename, &flag);\n'
                  '#endif\n\n')
          NFST = ('#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_KSUD)\n'
                  '#pragma GCC diagnostic push\n'
                  '#pragma GCC diagnostic ignored "-Wdeclaration-after-statement"\n'
                  '\textern void ksu_handle_newfstat_ret(unsigned int *, struct stat __user **);\n'
                  '\tksu_handle_newfstat_ret(&fd, &statbuf);\n'
                  '#pragma GCC diagnostic pop\n'
                  '#endif\n\n')
          REBT = ('#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_KSUD)\n'
                  '\textern int ksu_handle_sys_reboot(int, int, unsigned int, void __user **);\n'
                  '\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n'
                  '#endif\n\n')

          if MODE == 'manual':
              hook('fs/exec.c', 'execveat',
                   [r'^static int __do_execve_file\([^{]*\{', r'^static int do_execveat_common\([^{]*\{'],
                   [r'^[ \t]*if \(IS_ERR\(filename\)\)'], EXEC)
              hook('fs/open.c', 'faccessat', [r'^SYSCALL_DEFINE3\(faccessat,[^{]*\{'],
                   [r'^[ \t]*return do_faccessat\(dfd, filename, mode(?:, 0)?\);', r'^[ \t]*if \(mode & ~S_IRWXO\)'], FACC)
              ST_ANCHOR = [r'^[ \t]*error = vfs_fstatat\(dfd, filename, &stat, flag\);']
              hook('fs/stat.c', 'newfstatat', [r'^SYSCALL_DEFINE4\(newfstatat,[^{]*\{'], ST_ANCHOR, STAT)
              hook('fs/stat.c', 'fstatat64 (32-bit)', [r'^SYSCALL_DEFINE4\(fstatat64,[^{]*\{'], ST_ANCHOR, STAT, required=False)
              if use['newfstat']:
                  hook('fs/stat.c', 'newfstat_ret (Android 16+)', [r'^SYSCALL_DEFINE2\(newfstat,[^{]*\{'],
                       [r'^[ \t]*return error;'], NFST, last=True, required=False)
              hook('kernel/reboot.c', 'sys_reboot', [r'^SYSCALL_DEFINE4\(reboot,[^{]*\{'],
                   [r'^[ \t]*if \(!ns_capable\(pid_ns->user_ns, CAP_SYS_BOOT\)\)'], REBT)
          else:
              log('[i] hook_mode=branch_link: tidak ada patch hook (CONFIG_KSU_HACK_ARM64_BRANCH_LINK)')

          # ------------------------------------------------------------ audit
          DIRS = ['fs', 'kernel', 'drivers', 'include', 'security', 'mm', 'block', 'arch', 'net', 'init', 'lib', 'ipc']
          files = subprocess.run(['grep', '-rIlE', r'\bksu_[a-z0-9_]+', '--include=*.c', '--include=*.h'] + DIRS,
                                 capture_output=True, text=True).stdout.splitlines()
          ext = [f for f in files if f and not f.startswith(str(KDIR) + '/') and not f.startswith('drivers/kernelsu/')]

          log('----- inventaris hook ksu_* di luar driver KSU -----')
          used = {}
          for f in ext:
              text = rd(f)
              chunks = re.split(r'(?m)^\}\s*$', text)
              for ch in chunks:
                  cnt = {}
                  for l in ch.split('\n'):
                      s = l.strip()
                      if s.startswith(('*', '/*', '//')) or 'extern' in s:
                          continue
                      for sym in re.findall(r'\b(ksu_[a-z0-9_]+)\s*\(', s):
                          cnt[sym] = cnt.get(sym, 0) + 1
                  for sym, c in cnt.items():
                      if c > 1:
                          die(f'{f}: {sym} dipanggil {c}x di satu fungsi (hook ganda). Sisa hook lama / patch SUSFS + hook manual bentrok')
              for i, l in enumerate(text.split('\n'), 1):
                  s = l.strip()
                  if s.startswith(('*', '/*', '//')):
                      continue
                  for sym in re.findall(r'\b(ksu_[a-z0-9_]+)\b', s):
                      used.setdefault(sym, set()).add(f)
                  if re.search(r'\bksu_[a-z0-9_]+\s*\(', s) and 'extern' not in s:
                      log(f'    {f}:{i}: {s}')
          if not used and MODE == 'manual':
              die('tidak ada satu pun hook ksu_* terpasang di kernel')

          def defined_in_ksu(sym):
              return re.search(r'(?m)^(?!extern\b)(?!#)[A-Za-z_][^\n]*\b' + re.escape(sym) + r'\b', src) is not None

          missing = sorted(s for s in used if not defined_in_ksu(s))
          if missing:
              die('Kernel memanggil simbol KSU yang TIDAK didefinisikan SukiSU ref ini (API tidak cocok, akan gagal link): '
                  + ', '.join(f'{s} [{", ".join(sorted(used[s]))}]' for s in missing))
          log(f'[OK] {len(used)} simbol ksu_* yang dipakai kernel semuanya didefinisikan oleh SukiSU')

          if os.environ.get('SUSFS_ACTIVE') == 'true':
              ssym = sorted(set(re.findall(r'\b(susfs_[a-z0-9_]+)\b', src)))
              nodef = []
              for s in ssym:
                  r = subprocess.run(['grep', '-rEq', r'^[A-Za-z_][^;]*\b' + s + r'\b[ \t]*\(',
                                      '--include=*.c', '--include=*.h', 'fs', 'include', 'kernel', 'mm', 'security', 'drivers/input'],
                                     capture_output=True)
                  if r.returncode != 0:
                      nodef.append(s)
              if nodef:
                  warn('SukiSU memakai fungsi susfs_* yang tidak ditemukan definisinya di kernel (cek kecocokan API SUSFS): ' + ', '.join(nodef))
              else:
                  log(f'[OK] {len(ssym)} simbol susfs_* yang dipakai SukiSU ada di kernel')
          REPORT.write_text('\n'.join(rep))
          print('[OK] hook + audit selesai')
          PYEOF
          cd "$KSRC"
          python3 "$RUNNER_TEMP/ksu_hooks.py"
          echo "----- ringkasan hook -----"
          git diff --stat -- fs kernel drivers/input security | tail -n 40

      # ------------------------------------------------------------ add-on 2: NoMount
      - name: Integrasi NoMount (built-in)
        run: |
          cd "$KSRC"
          REF="$NOMOUNT_REF_IN"
          if [ "$REF" = "latest" ]; then
            REF=$(gh api repos/maxsteeel/nomount/releases/latest --jq .tag_name 2>/dev/null || true)
            [ -n "$REF" ] || { echo "::warning::gagal resolve release terbaru NoMount, pakai master"; REF=master; }
          fi
          echo "[i] NoMount ref: $REF"
          echo "NOMOUNT_REF=$REF" >> "$GITHUB_ENV"

          rm -rf fs/nomount
          sed -i '/nomount/d' fs/Kconfig fs/Makefile
          OLD=$(grep -rIl 'nomount' fs include kernel --include='*.c' --include='*.h' 2>/dev/null | grep -v '^fs/nomount/' || true)
          [ -z "$OLD" ] || echo "::warning::Sisa referensi 'nomount' di luar fs/nomount (hook NoMount lama?): $OLD"

          nm_ok() {
            [ -f fs/nomount/Kconfig ] && [ -f fs/nomount/Makefile ] \
              && ls fs/nomount/*.c >/dev/null 2>&1 \
              && grep -q 'nomount/Kconfig' fs/Kconfig \
              && grep -q 'nomount/' fs/Makefile \
              && grep -q 'config NOMOUNT' fs/nomount/Kconfig
          }

          if curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/${REF}/kernel/setup.sh" \
               -o "$RUNNER_TEMP/nomount_setup.sh" && bash "$RUNNER_TEMP/nomount_setup.sh" "$REF"; then
            :
          else
            echo "::warning::setup.sh resmi NoMount gagal untuk ref '$REF'"
          fi

          if ! nm_ok; then
            echo "[i] fallback integrasi manual (Method 3)"
            rm -rf fs/nomount "$RUNNER_TEMP/nomount-src"
            git clone --depth 1 --branch "$REF" https://github.com/maxsteeel/nomount "$RUNNER_TEMP/nomount-src"
            mkdir -p fs/nomount
            cp -f "$RUNNER_TEMP"/nomount-src/kernel/src/* fs/nomount/
            sed -i '/nomount/d' fs/Kconfig fs/Makefile
            printf '\nsource "fs/nomount/Kconfig"\n' >> fs/Kconfig
            printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
          fi
          nm_ok || { echo "::error::integrasi NoMount gagal"; ls -la fs/nomount || true; exit 1; }
          [ "$(grep -c 'nomount/Kconfig' fs/Kconfig)" = "1" ] || { echo "::error::source NoMount ganda di fs/Kconfig"; exit 1; }
          [ "$(grep -c 'nomount/' fs/Makefile)" = "1" ] || { echo "::error::obj NoMount ganda di fs/Makefile"; exit 1; }
          echo "----- fs/nomount -----"
          ls -la fs/nomount
          cat fs/nomount/Kconfig

      # ------------------------------------------------------------- path_umount backport
      - name: Backport path_umount untuk kernel 4.19 (verifikasi ketat)
        run: |
          cd "$KSRC"
          python3 - <<'PYEOF'
          import re
          import sys
          from pathlib import Path

          def die(message):
              print(f"::error::{message}")
              sys.exit(1)

          ns_path = Path("fs/namespace.c")
          ih_path = Path("fs/internal.h")
          if not ns_path.is_file() or not ih_path.is_file():
              die("fs/namespace.c atau fs/internal.h tidak ditemukan")

          src = ns_path.read_text()

          def defined(name):
              pattern = rf"(?m)^[ \t]*(?:static[ \t]+)?int[ \t]+{re.escape(name)}[ \t]*\([^;{{}}]*\)[ \t\r\n]*\{{"
              return re.search(pattern, src) is not None

          can_exists = defined("can_umount")
          path_exists = defined("path_umount")
          blocks = []

          if not can_exists:
              blocks.append(r'''static int can_umount(const struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);

              if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                  return -EINVAL;
              if (!may_mount())
                  return -EPERM;
              if (path->dentry != path->mnt->mnt_root)
                  return -EINVAL;
              if (!check_mnt(mnt))
                  return -EINVAL;
              if (mnt->mnt.mnt_flags & MNT_LOCKED)
                  return -EINVAL;
              if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                  return -EPERM;
              return 0;
          }''')

          if not path_exists:
              blocks.append(r'''int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              int ret;

              ret = can_umount(path, flags);
              if (!ret)
                  ret = do_umount(mnt, flags);

              /* Do not use path_put(): it would clear mnt_expiry_mark. */
              dput(path->dentry);
              mntput_no_expire(mnt);
              return ret;
          }''')

          if blocks:
              if not can_exists and path_exists:
                  anchor = re.search(r"(?m)^int[ \t]+path_umount\s*\(", src)
              else:
                  anchor = re.search(r"(?m)^static bool is_mnt_ns_file\s*\(", src)
              if anchor is None:
                  die("anchor namespace.c tidak ditemukan; tidak akan menambal secara spekulatif")
              patch = "\n\n" + "\n\n".join(blocks) + "\n\n"
              src = src[:anchor.start()] + patch + src[anchor.start():]
              ns_path.write_text(src)
              print("[+] Backport path_umount diterapkan pada fs/namespace.c")
          else:
              print("[i] can_umount dan path_umount sudah memiliki definisi")

          for name in ("can_umount", "path_umount"):
              pattern = rf"(?m)^[ \t]*(?:static[ \t]+)?int[ \t]+{re.escape(name)}[ \t]*\([^;{{}}]*\)[ \t\r\n]*\{{"
              count = len(re.findall(pattern, src))
              if count != 1:
                  die(f"definisi {name} harus tepat satu, ditemukan {count}")

          header = ih_path.read_text()
          prototype = r"(?m)^int[ \t]+path_umount\s*\(struct path \*path, int flags\);\s*$"
          if not re.search(prototype, header):
              h_anchor = re.search(r"(?m)^extern void __init mnt_init\(void\);\s*$", header)
              if h_anchor is None:
                  die("anchor deklarasi mnt_init di fs/internal.h tidak ditemukan")
              end = h_anchor.end()
              header = header[:end] + "\nint path_umount(struct path *path, int flags);" + header[end:]
              ih_path.write_text(header)
              print("[+] Prototype path_umount ditambahkan ke fs/internal.h")

          if not re.search(prototype, ih_path.read_text()):
              die("prototype path_umount tidak terverifikasi")
          print("[OK] Definisi path_umount unik")
          PYEOF

      # ---------------------------------------------------------------- toolchain
      - name: Pasang Neutron Clang
        run: |
          mkdir -p "$HOME/neutron"
          cd "$HOME/neutron"
          curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
          chmod +x antman
          if ! ./antman -S || [ ! -x bin/clang ]; then
            echo "::warning::antman gagal, fallback ke release clang-build-catalogue"
            URL=$(gh api repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
                  --jq '[.assets[] | select(.name | endswith(".tar.zst"))][0].browser_download_url')
            [ -n "$URL" ] || { echo "::error::tidak menemukan asset Neutron Clang"; exit 1; }
            curl -fsSL "$URL" | tar --zstd -x
          fi
          [ -x bin/clang ] || { echo "::error::Neutron Clang tidak terpasang"; exit 1; }
          export PATH="$HOME/neutron/bin:$PATH"
          if ! clang --version >/dev/null 2>&1; then
            echo "::warning::clang tidak bisa jalan, mencoba antman --patch=glibc"
            ./antman --patch=glibc
          fi
          clang --version | sed -n '1p'
          ld.lld --version | sed -n '1p'
          command -v aarch64-linux-gnu-elfedit arm-linux-gnueabi-ld
          echo "$HOME/neutron/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------- konfigurasi
      - name: Konfigurasi kernel
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          cd "$KSRC"
          rm -rf out
          "$GITHUB_WORKSPACE/kmake.sh" "$DEF"

          CFG=out/.config
          sc() { scripts/config --file "$CFG" "$@"; }

          DEFINED=$(find "$KDIR" -type f \( -name 'Kconfig' -o -name 'Kconfig.*' \) -exec cat {} + \
                    | sed -nE 's/^[[:space:]]*config[[:space:]]+([A-Z0-9_]+)[[:space:]]*$/\1/p' | sort -u)
          has_sym() { printf '%s\n' "$DEFINED" | grep -qx "$1"; }
          die() { echo "::error::$*"; exit 1; }

          # --- SukiSU-Ultra builtin
          has_sym KSU || die "simbol KSU tidak ada di Kconfig SukiSU (ref salah?)"
          sc -e KSU
          if [ "$HOOK_MODE" = "branch_link" ]; then
            has_sym KSU_HACK_ARM64_BRANCH_LINK || die "KSU_HACK_ARM64_BRANCH_LINK tidak ada di ref ini"
            sc -e KSU_HACK_ARM64_BRANCH_LINK
            has_sym KSU_TAMPER_SYSCALL_TABLE && sc -d KSU_TAMPER_SYSCALL_TABLE
          else
            for s in KSU_HACK_ARM64_BRANCH_LINK KSU_TAMPER_SYSCALL_TABLE; do
              has_sym "$s" && sc -d "$s"
            done
          fi
          for s in KSU_KPROBES_KSUD KSU_DEBUG KSU_NOPRINTK; do
            has_sym "$s" && sc -d "$s"
          done

          # --- KPM
          if [ "$KPM" = "true" ]; then
            has_sym KPM || die "CONFIG_KPM tidak ada di Kconfig SukiSU ref ini"
            sc -e KPM
          fi

          # --- SUSFS (hanya simbol yang benar-benar didefinisikan SukiSU)
          SUSFS_ON=""
          if [ "${SUSFS_ACTIVE:-false}" = "true" ]; then
            has_sym KSU_SUSFS || die "KSU_SUSFS tidak ada di Kconfig SukiSU ref ini"
            for s in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME \
                     KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
              if has_sym "$s"; then sc -e "$s"; SUSFS_ON="$SUSFS_ON $s"; else echo "::warning::$s tidak ada di Kconfig -> dilewati"; fi
            done
            has_sym KSU_SUSFS_ENABLE_LOG && sc -d KSU_SUSFS_ENABLE_LOG
          else
            has_sym KSU_SUSFS && sc -d KSU_SUSFS
          fi

          # --- NoMount + kebutuhan mount modul
          sc -e KEYS -e NOMOUNT -e OVERLAY_FS -e TMPFS_XATTR -e TMPFS_POSIX_ACL

          # --- baseline Zygisk / KPM: SELinux + KALLSYMS_ALL (dan dependensinya)
          sc -e SECURITY -e SECURITY_SELINUX
          sc -e DEBUG_KERNEL -e KALLSYMS -e KALLSYMS_ALL -e STACKTRACE

          # --- nama kernel
          sc --set-str LOCALVERSION "$LV"
          sc -d LOCALVERSION_AUTO

          "$GITHUB_WORKSPACE/kmake.sh" olddefconfig

          if grep -qx 'CONFIG_COMPAT_VDSO=y' "$CFG" && ! command -v arm-linux-gnueabi-gcc >/dev/null 2>&1; then
            echo "::warning::CONFIG_COMPAT_VDSO=y tapi arm-linux-gnueabi-gcc tidak ada -> dimatikan"
            sc -d COMPAT_VDSO
            "$GITHUB_WORKSPACE/kmake.sh" olddefconfig
          fi

          fail=0
          need() { grep -qx "$1" "$CFG" || { echo "::error::$CFG tidak memuat $1 (dependency tidak terpenuhi?)"; fail=1; }; }
          forbid() { if grep -qx "$1" "$CFG"; then echo "::error::$1 aktif padahal harus mati"; fail=1; fi; }
          need CONFIG_KSU=y
          need CONFIG_NOMOUNT=y
          need CONFIG_KEYS=y
          need CONFIG_OVERLAY_FS=y
          need CONFIG_SECURITY=y
          need CONFIG_SECURITY_SELINUX=y
          need CONFIG_DEBUG_KERNEL=y
          need CONFIG_KALLSYMS=y
          need CONFIG_KALLSYMS_ALL=y
          need CONFIG_STACKTRACE=y
          [ "$KPM" != "true" ] || need CONFIG_KPM=y
          for s in $SUSFS_ON; do need "CONFIG_${s}=y"; done
          need "CONFIG_LOCALVERSION=\"$LV\""
          forbid CONFIG_LOCALVERSION_AUTO=y
          forbid CONFIG_KSU_KPROBES_KSUD=y
          if [ "$HOOK_MODE" = "manual" ]; then
            forbid CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
            forbid CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          else
            need CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          fi
          if [ "$fail" != 0 ]; then
            echo "::group::Kconfig SukiSU (untuk diagnosa dependency)"
            find "$KDIR" -type f \( -name 'Kconfig' -o -name 'Kconfig.*' \) -exec cat {} +
            echo "::endgroup::"
            exit 1
          fi
          echo "----- ringkasan config -----"
          grep -E '^(# )?CONFIG_(KSU|KPM|NOMOUNT|KEYS|OVERLAY_FS|SECURITY_SELINUX|DEBUG_KERNEL|STACKTRACE|KPROBES|KALLSYMS|LOCALVERSION|LTO|CC_STACKPROTECTOR)' "$CFG" || true

      - name: Gerbang nama kernel (utsrelease.h harus persis sama)
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          cd "$KSRC"
          "$GITHUB_WORKSPACE/kmake.sh" include/generated/utsrelease.h > "$RUNNER_TEMP/uts.log" 2>&1 \
            || { cat "$RUNNER_TEMP/uts.log"; echo "::error::gagal membuat utsrelease.h dengan release '$REL'"; exit 1; }
          GOT=$(sed -nE 's/^#define UTS_RELEASE "(.*)"$/\1/p' out/include/generated/utsrelease.h)
          echo "[i] UTS_RELEASE = $GOT"
          [ "$GOT" = "$REL" ] || { echo "::error::UTS_RELEASE '$GOT' != '$REL'"; exit 1; }
          [ "$(cat out/include/config/kernel.release)" = "$REL" ] \
            || { echo "::error::kernel.release '$(cat out/include/config/kernel.release)' != '$REL'"; exit 1; }
          echo "[OK] nama kernel: $REL"

      - name: Relax -Werror bawaan vendor
        run: |
          cd "$KSRC"
          n=0
          while IFS= read -r f; do
            if grep -qE '(^|[[:space:]])-Werror([[:space:]]|$)' "$f"; then
              sed -E -i 's/(^|[[:space:]])-Werror([[:space:]]|$)/\1\2/g' "$f"
              n=$((n+1))
            fi
          done < <(find drivers techpack fs net sound security kernel mm lib block crypto arch/arm64 "$KDIR" \
                     -type f \( -name Makefile -o -name Kbuild -o -name 'Makefile.*' \) 2>/dev/null)
          echo "[i] -Werror dihapus dari $n Makefile"

      # ------------------------------------------------------------------------ build
      - name: Build kernel
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          cd "$KSRC"
          set +e
          "$GITHUB_WORKSPACE/kmake.sh" -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Build gagal (rc=$rc)"
            echo "::group::Ringkasan error"
            grep -nE 'error:|Error [0-9]+|undefined reference|ld(\.lld)?: error' "$GITHUB_WORKSPACE/build.log" | sed -n '1,60p' || true
            echo "::endgroup::"
            echo "::group::Re-run -j1 (error pertama yang bersih)"
            "$GITHUB_WORKSPACE/kmake.sh" -j1 2>&1 | tail -n 80 || true
            echo "::endgroup::"
            exit 1
          fi
          ls -la out/arch/arm64/boot

      - name: Verifikasi baseline KSU / Zygisk / KPM
        run: |
          set -euo pipefail
          cd "$KSRC"
          # Zygisk Next mendokumentasikan minimum KernelSU kernel 10940
          KSU_CODE=$(grep -aoE -- '-- .*(KernelSU|SukiSU)[A-Za-z -]*[Vv]ersion: *[0-9]+' "$GITHUB_WORKSPACE/build.log" | tail -n1 | grep -oE '[0-9]+$' || true)
          if [ -z "$KSU_CODE" ]; then
            echo "::warning::versi kernel-side SukiSU tidak terbaca dari build.log (format Kbuild berbeda); gerbang minimum Zygisk Next (10940) dilewati"
            KSU_CODE="?"
          else
            echo "[i] kernel-side SukiSU version code: $KSU_CODE"
            [ "$KSU_CODE" -ge 10940 ] || { echo "::error::versi $KSU_CODE di bawah minimum Zygisk Next 10940"; exit 1; }
          fi
          for c in CONFIG_SECURITY=y CONFIG_SECURITY_SELINUX=y CONFIG_DEBUG_KERNEL=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_STACKTRACE=y; do
            grep -qx "$c" out/.config || { echo "::error::$c wajib (Zygisk/KPM)"; exit 1; }
          done
          if [ "$KPM" = "true" ]; then
            grep -qx 'CONFIG_KPM=y' out/.config || { echo "::error::CONFIG_KPM=y tidak aktif"; exit 1; }
          fi
          REL_BUILT=$(cat out/include/config/kernel.release)
          [ "$REL_BUILT" = "$REL" ] || { echo "::error::kernel.release '$REL_BUILT' != '$REL'"; exit 1; }
          grep -aqF "Linux version $REL" out/arch/arm64/boot/Image \
            || { echo "::error::string 'Linux version $REL' tidak ada di Image"; exit 1; }
          echo "KSU_DRIVER_CODE=$KSU_CODE" >> "$GITHUB_ENV"
          echo "[OK] baseline tervalidasi; Image memuat 'Linux version $REL'"

      - name: Verifikasi simbol hasil build
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          cd "$KSRC"
          llvm-nm out/vmlinux > "$RUNNER_TEMP/syms.txt"
          fail=0
          NEED="path_umount"
          if [ "$HOOK_MODE" = "manual" ]; then
            NEED="$NEED ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_sys_reboot"
          fi
          for s in $NEED; do
            grep -qw "$s" "$RUNNER_TEMP/syms.txt" || { echo "::error::simbol $s tidak ada di vmlinux"; fail=1; }
          done
          find out/fs/nomount -name '*.o' 2>/dev/null | grep -q . || { echo "::error::objek NoMount tidak terkompilasi"; fail=1; }
          grep -qi 'nomount' "$RUNNER_TEMP/syms.txt" || { echo "::error::simbol NoMount tidak ada di vmlinux"; fail=1; }
          if [ "${SUSFS_ACTIVE:-false}" = "true" ]; then
            grep -qi 'susfs' "$RUNNER_TEMP/syms.txt" || { echo "::error::SUSFS aktif tapi simbol susfs tidak ada di vmlinux"; fail=1; }
            grep -aq 'v2\.3\.0' out/vmlinux || echo "::warning::string v2.3.0 tidak ditemukan di vmlinux"
          fi
          if [ "$KPM" = "true" ]; then
            if grep -qi 'kpm' "$RUNNER_TEMP/syms.txt"; then
              echo "[OK] simbol KPM ada di vmlinux: $(grep -ci 'kpm' "$RUNNER_TEMP/syms.txt") simbol"
            else
              echo "::warning::CONFIG_KPM=y tapi tidak ada simbol kpm di vmlinux (loader KPM kemungkinan stub di ref SukiSU ini). Uji dengan demo-hello.kpm setelah boot."
            fi
          fi
          [ "$fail" = 0 ] || exit 1
          echo "[OK] semua komponen ter-link di vmlinux"
          grep -E ' (ksu_handle_|susfs_)' "$RUNNER_TEMP/syms.txt" | sed -n '1,40p' || true

      # --------------------------------------------------------------------- KPM patch
      - name: Patch Image dengan KernelPatch (patch_linux) - opsional, gagal = lanjut tanpa patch
        if: ${{ inputs.kpm && inputs.kpm_patch }}
        run: |
          BOOT="$KSRC/out/arch/arm64/boot"
          W="$RUNNER_TEMP/kpm"
          rm -rf "$W"; mkdir -p "$W"
          skip() { echo "::warning::$*"; echo "KPM_PATCHED=false" >> "$GITHUB_ENV"; exit 0; }
          [ -f "$BOOT/Image" ] && [ -f "$BOOT/Image.gz" ] && [ -f "$BOOT/Image.gz-dtb" ] \
            || skip "Image / Image.gz / Image.gz-dtb mentah tidak lengkap, patch KPM dilewati"
          cp "$BOOT/Image" "$W/Image"
          URL=$(gh api repos/ShirkNeko/SukiSU_KernelPatch_patch/releases/latest \
                  --jq '[.assets[] | select(.name=="patch_linux")][0].browser_download_url' 2>/dev/null || true)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
          fi
          echo "[i] patch_linux: $URL"
          curl -fsSL "$URL" -o "$W/patch_linux" || skip "gagal mengunduh patch_linux"
          chmod +x "$W/patch_linux"
          cd "$W"
          ./patch_linux > patch.log 2>&1 || { cat patch.log; skip "patch_linux gagal"; }
          cat patch.log | tail -n 20
          [ -s oImage ] || skip "oImage tidak dihasilkan"
          A=$(stat -c %s Image); B=$(stat -c %s oImage)
          echo "[i] Image=$A oImage=$B"
          [ "$B" -ge "$A" ] && [ "$B" -le $((A + 8000000)) ] || skip "ukuran oImage ($B) tidak wajar vs Image ($A)"
          GZS=$(stat -c %s "$BOOT/Image.gz")
          cmp -s -n "$GZS" "$BOOT/Image.gz-dtb" "$BOOT/Image.gz" || skip "Image.gz-dtb bukan 'Image.gz + dtb', tidak bisa dirakit ulang dengan aman"
          tail -c +$((GZS + 1)) "$BOOT/Image.gz-dtb" > dtbs.bin
          [ -s dtbs.bin ] || skip "payload dtb kosong"
          gzip -n -9 -c oImage > Image.gz.kpm
          cat Image.gz.kpm dtbs.bin > Image.gz-dtb.kpm
          echo "KPM_PATCHED=true" >> "$GITHUB_ENV"
          echo "KPM_IMG=$W/Image.gz-dtb.kpm" >> "$GITHUB_ENV"
          echo "[OK] Image ter-patch KPM: $(stat -c %s Image.gz-dtb.kpm) bytes"

      # --------------------------------------------------------------------- packaging
      - name: Package AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3
          grep -q '^split_boot()' tools/ak3-core.sh && grep -q '^flash_boot()' tools/ak3-core.sh \
            || { echo "::error::AnyKernel3 terbaru tidak punya split_boot/flash_boot, sesuaikan anykernel.sh"; exit 1; }
          rm -rf .git .github README.md

          cat > anykernel.sh <<'EOF'
          #!/sbin/sh
          # AnyKernel3 - LunarKnight / Xiaomi Redmi Note 5 Pro (whyred)
          properties() { '
          kernel.string=@KNAME@
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          '; } # end properties

          # whyred: non A/B, kernel Image.gz-dtb (appended DTB), partisi boot
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "@KNAME@";
          ui_print "SukiSU Ultra (builtin) + @SUSFS@ + NoMount + @KPM@";
          ui_print " ";

          split_boot;
          flash_boot;
          EOF
          SUSFS_TXT="tanpa SUSFS"
          [ "${SUSFS_ACTIVE:-false}" != "true" ] || SUSFS_TXT="SUSFS v2.3.0"
          KPM_TXT="tanpa KPM"
          [ "$KPM" != "true" ] || KPM_TXT="KPM"
          sed -i "s|@KNAME@|${KNAME}|g; s|@SUSFS@|${SUSFS_TXT}|g; s|@KPM@|${KPM_TXT}|g" anykernel.sh
          grep -n 'kernel.string' anykernel.sh

          BOOT="$KSRC/out/arch/arm64/boot"
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp "$BOOT/Image.gz-dtb" "$RUNNER_TEMP/Image.gz-dtb.plain"
          elif [ -f "$BOOT/Image.gz" ]; then
            echo "::warning::Image.gz-dtb tidak ada, merakit Image.gz + dtb"
            mapfile -t DTBS < <(find "$BOOT/dts" -name '*whyred*.dtb' | sort)
            [ "${#DTBS[@]}" -gt 0 ] || mapfile -t DTBS < <(find "$BOOT/dts" -name '*sdm636*.dtb' | sort)
            [ "${#DTBS[@]}" -gt 0 ] || { echo "::error::DTB whyred tidak ditemukan"; ls -R "$BOOT" | sed -n '1,60p'; exit 1; }
            cat "$BOOT/Image.gz" "${DTBS[@]}" > "$RUNNER_TEMP/Image.gz-dtb.plain"
          else
            echo "::error::tidak ada Image.gz-dtb / Image.gz di $BOOT"; ls -la "$BOOT"; exit 1
          fi
          SZ=$(stat -c %s "$RUNNER_TEMP/Image.gz-dtb.plain")
          echo "[i] Image.gz-dtb = $SZ bytes"
          [ "$SZ" -gt 4000000 ] || { echo "::error::Image.gz-dtb terlalu kecil ($SZ bytes), build tidak wajar"; exit 1; }

          STAMP=$(TZ=Asia/Jakarta date +%Y%m%d-%H%M)
          TAG="LunarKnight-whyred-${KBASE}-ST20-SukiSU"
          [ "${SUSFS_ACTIVE:-false}" != "true" ] || TAG="${TAG}-susfs2.3.0"
          TAG="${TAG}-NoMount"
          [ "$KPM" != "true" ] || TAG="${TAG}-KPM"

          mkzip() {
            local img="$1" zip="$2"
            cp "$img" Image.gz-dtb
            rm -f "$GITHUB_WORKSPACE/$zip"
            zip -r9 "$GITHUB_WORKSPACE/$zip" . -x '*.git*' -x 'Image.gz-dtb.*' > /dev/null
            unzip -l "$GITHUB_WORKSPACE/$zip" | grep -E 'anykernel.sh|Image.gz-dtb|update-binary'
          }
          if [ "${KPM_PATCHED:-false}" = "true" ]; then
            ZIP_MAIN="${TAG}-patched-${STAMP}-${KSHA}.zip"
            ZIP_ALT="${TAG}-unpatched-fallback-${STAMP}-${KSHA}.zip"
            mkzip "$KPM_IMG" "$ZIP_MAIN"
            mkzip "$RUNNER_TEMP/Image.gz-dtb.plain" "$ZIP_ALT"
          else
            ZIP_MAIN="${TAG}-${STAMP}-${KSHA}.zip"
            ZIP_ALT=""
            mkzip "$RUNNER_TEMP/Image.gz-dtb.plain" "$ZIP_MAIN"
          fi
          {
            echo "ZIP=$ZIP_MAIN"
            echo "ZIP_ALT=$ZIP_ALT"
            echo "STAMP=$STAMP"
          } >> "$GITHUB_ENV"
          cp "$KSRC/out/.config" "$GITHUB_WORKSPACE/kernel.config"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: LunarKnight-whyred-${{ env.STAMP }}
          path: ${{ github.workspace }}/LunarKnight-whyred-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload log, config & laporan integrasi
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/build.log
            ${{ github.workspace }}/kernel.config
            ${{ github.workspace }}/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Ringkasan
        if: success()
        run: |
          {
            echo "### LunarKnight whyred — ${REL}"
            echo "- Kernel: \`${KERNEL_REPO}@${KERNEL_REF}\` (${KSHA}), defconfig \`${DEF}\`"
            echo "- SukiSU-Ultra: \`${KSU_REPO}@${KSU_REF}\` (${KSU_SHA}), hook mode: ${HOOK_MODE}"
            echo "- SUSFS: ${SUSFS_SRC:-off}"
            echo "- NoMount: \`${NOMOUNT_REF}\` (built-in)"
            echo "- KPM: CONFIG_KPM=${KPM}, Image ter-patch: ${KPM_PATCHED:-false}"
            echo "- Zygisk: KALLSYMS_ALL=y, SELinux=y, kernel-side KSU code ${KSU_DRIVER_CODE} (Zygisk Next min 10940)"
            echo "- Zip utama: \`${ZIP}\`"
            [ -z "${ZIP_ALT}" ] || echo "- Zip cadangan (tanpa patch KPM): \`${ZIP_ALT}\`"
            echo
            echo "Setelah boot: manager SukiSU harus versi yang cocok dengan kernel; uji KPM dengan demo-hello.kpm."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release (opsional)
        if: ${{ inputs.release }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release create "whyred-${STAMP}" LunarKnight-whyred-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "LunarKnight whyred ${KBASE} (${STAMP})" \
            --notes "Release ${REL} | ${KERNEL_REPO}@${KERNEL_REF} @ ${KSHA} | SukiSU-Ultra ${KSU_REF} @ ${KSU_SHA} | SUSFS ${SUSFS_SRC:-off} | NoMount ${NOMOUNT_REF} | KPM ${KPM} (patched: ${KPM_PATCHED:-false}) | Neutron Clang"
