name: LunarKnight whyred (FinaSU + NoMount)

# Kernel 4.19 SDM660 (Redmi Note 5 Pro / whyred)
# FinaSU  : https://github.com/LyraVoid/FinaSU     (driver kernel masuk drivers/kernelsu)
# NoMount : https://github.com/maxsteeel/nomount   (built-in, fs/nomount, CONFIG_NOMOUNT=y)
# Simpan sebagai .github/workflows/whyred-finasu-nomount.yml lalu jalankan dari tab Actions.

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Branch kernel LunarKnight
        type: string
        default: back
        required: true
      finasu_ref:
        description: Branch / tag / commit FinaSU (kosong = branch default)
        type: string
        default: ''
        required: false
      nomount_ref:
        description: Argumen setup.sh NoMount, mis. dev (kosong = default setup.sh)
        type: string
        default: ''
        required: false
      defconfig:
        description: Nama defconfig (auto = cari *whyred*defconfig)
        type: string
        default: auto
        required: true
      path_umount:
        description: Backport path_umount() ke fs/namespace.c (wajib untuk kernel di bawah 5.9)
        type: boolean
        default: true
      release:
        description: Upload juga ke GitHub Releases
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whyred-finasu-nomount-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: IndraSenzZ/LunarKnight
  FINASU_REPO: LyraVoid/FinaSU
  KBUILD_BUILD_USER: lunarknight
  KBUILD_BUILD_HOST: github-actions
  MAKE_FLAGS: >-
    O=out ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++
    LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
    READELF=llvm-readelf STRIP=llvm-strip
    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
    CLANG_TRIPLE=aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Siapkan runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio zip unzip python3 xz-utils zstd lz4 \
            dwarves libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          df -h / | tail -n 1

      - name: Ambil source kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ inputs.kernel_branch }}
          fetch-depth: 1
          path: kernel

      - name: Pasang Neutron Clang
        run: |
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
          chmod +x antman
          ./antman -S
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -n 1

      - name: Integrasi FinaSU
        env:
          FINASU_REF: ${{ inputs.finasu_ref }}
        run: |
          set -euo pipefail
          cd kernel

          # Ambil FinaSU di dalam tree kernel (cara yang sama dengan setup.sh KernelSU)
          git init -q FinaSU
          git -C FinaSU remote add origin "https://github.com/${FINASU_REPO}.git"
          git -C FinaSU fetch -q --depth=1 origin "${FINASU_REF:-HEAD}"
          git -C FinaSU checkout -q FETCH_HEAD
          echo "FINASU_SHA=$(git -C FinaSU rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

          if [ ! -f FinaSU/kernel/Kconfig ] || { [ ! -f FinaSU/kernel/Kbuild ] && [ ! -f FinaSU/kernel/Makefile ]; }; then
            echo "::error::FinaSU/kernel tidak punya Kconfig + Kbuild/Makefile untuk build built-in. Isi folder:"
            ls -la FinaSU/kernel
            exit 1
          fi
          if ! grep -qE '^config KSU$' FinaSU/kernel/Kconfig; then
            echo "::error::Simbol 'config KSU' tidak ada di Kconfig FinaSU. Simbol yang tersedia:"
            grep -E '^config ' FinaSU/kernel/Kconfig || true
            exit 1
          fi

          # Hapus sisa integrasi lama kalau berupa folder asli
          if [ -d drivers/kernelsu ] && [ ! -L drivers/kernelsu ]; then rm -rf drivers/kernelsu; fi
          ln -sfn ../FinaSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'kernelsu' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "Simbol Kconfig FinaSU:"
          grep -E '^config ' FinaSU/kernel/Kconfig || true

      - name: Integrasi NoMount (built-in)
        env:
          NOMOUNT_REF: ${{ inputs.nomount_ref }}
        run: |
          set -euo pipefail
          cd kernel
          curl -fsSL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh -o /tmp/nomount-setup.sh
          # shellcheck disable=SC2086
          bash /tmp/nomount-setup.sh $NOMOUNT_REF

          test -f fs/nomount/Kconfig || { echo "::error::fs/nomount/Kconfig tidak ada, setup.sh NoMount gagal"; exit 1; }
          grep -q 'fs/nomount/Kconfig' fs/Kconfig || { echo "::error::fs/Kconfig belum memuat NoMount"; exit 1; }
          grep -q 'nomount' fs/Makefile || { echo "::error::fs/Makefile belum memuat NoMount"; exit 1; }
          echo "NOMOUNT_FP=$(cat fs/nomount/* | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Backport path_umount (kernel < 5.9)
        if: ${{ inputs.path_umount }}
        run: |
          set -euo pipefail
          cd kernel
          python3 - <<'PY'
          import sys
          p = "fs/namespace.c"
          s = open(p).read()
          if "path_umount" in s:
              print("path_umount sudah ada, dilewati")
              sys.exit(0)
          code = '''static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	/* we mustn't call path_put() as that would clear mnt_expiry_mark */
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }

          '''
          code = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in code.split("\n"))
          anchors = [
              "/*\n * Now umount can handle mount points as well as block devices.",
              "SYSCALL_DEFINE2(umount, char __user *, name, int, flags)",
          ]
          for a in anchors:
              if a in s:
                  s = s.replace(a, code + a, 1)
                  open(p, "w").write(s)
                  print("path_umount ditambahkan sebelum:", a.splitlines()[0])
                  break
          else:
              sys.exit("anchor umount tidak ditemukan di fs/namespace.c")
          PY

      - name: Siapkan defconfig
        env:
          DEFCONFIG_IN: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          cd kernel
          cfgdir=arch/arm64/configs
          if [ "$DEFCONFIG_IN" = "auto" ]; then
            mapfile -t found < <(cd "$cfgdir" && find . -type f -name '*whyred*defconfig' | sed 's|^\./||' | sort)
            [ "${#found[@]}" -gt 0 ] || { echo "::error::defconfig whyred tidak ditemukan di $cfgdir"; exit 1; }
            printf 'Kandidat defconfig:\n'; printf '  %s\n' "${found[@]}"
            DEFCONFIG="${found[0]}"
          else
            DEFCONFIG="$DEFCONFIG_IN"
          fi
          test -f "$cfgdir/$DEFCONFIG" || { echo "::error::$cfgdir/$DEFCONFIG tidak ada"; exit 1; }
          echo "Memakai defconfig: $DEFCONFIG"

          cp "$cfgdir/$DEFCONFIG" "$cfgdir/lunarknight_defconfig"
          sed -i -E '/^(# )?CONFIG_(KSU|NOMOUNT|KPROBES|HAVE_KPROBES|KPROBE_EVENTS|OVERLAY_FS)[= ]/d' "$cfgdir/lunarknight_defconfig"
          cat >> "$cfgdir/lunarknight_defconfig" <<'EOF'

          # --- FinaSU + NoMount ---
          CONFIG_KSU=y
          CONFIG_NOMOUNT=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          EOF
          sed -i 's/^          //' "$cfgdir/lunarknight_defconfig"

          # shellcheck disable=SC2086
          make $MAKE_FLAGS lunarknight_defconfig

          # KPROBES bergantung pada MODULES di 4.19. FinaSU memakai kprobe untuk hook reboot.
          if ! grep -q '^CONFIG_KPROBES=y' out/.config; then
            echo "::warning::CONFIG_KPROBES hilang setelah resolve (kemungkinan CONFIG_MODULES mati). Mengaktifkan MODULES + KPROBES."
            scripts/config --file out/.config -e MODULES -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
            # shellcheck disable=SC2086
            make $MAKE_FLAGS olddefconfig
          fi

          missing=0
          for sym in KSU NOMOUNT KPROBES OVERLAY_FS; do
            if grep -q "^CONFIG_${sym}=y" out/.config; then
              echo "OK   CONFIG_${sym}=y"
            else
              echo "::error::CONFIG_${sym} tidak aktif di out/.config"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Tambal kernel/module.c (bila MODULES aktif)
        run: |
          set -euo pipefail
          cd kernel
          if ! grep -q '^CONFIG_MODULES=y' out/.config; then
            echo "CONFIG_MODULES mati, tambalan tidak diperlukan"
            exit 0
          fi
          python3 - <<'PY'
          import re, subprocess, sys
          p = "kernel/module.c"
          s = open(p).read()
          defn = re.compile(r'^\s*(#\s*define\s+module_assert_mutex\b|(static\s+)?(inline\s+)?(void|int)\s+module_assert_mutex\s*\()', re.M)
          if defn.search(s):
              print("module_assert_mutex sudah didefinisikan di module.c, dilewati")
              sys.exit(0)
          hdr = subprocess.run(
              ["grep", "-rnE", r"(define\s+module_assert_mutex\b|(void|int)\s+module_assert_mutex\s*\()",
               "include", "kernel"], capture_output=True, text=True).stdout
          if hdr.strip():
              print("module_assert_mutex sudah ada di:\n" + hdr)
              sys.exit(0)
          lines = s.split("\n")
          last = -1
          for i, l in enumerate(lines[:200]):
              if l.startswith("#include"):
                  last = i
          if last < 0:
              sys.exit("blok #include tidak ditemukan di kernel/module.c")
          patch = [
              "",
              "#ifndef module_assert_mutex",
              "static inline void module_assert_mutex(void)",
              "{",
              "\tlockdep_assert_held(&module_mutex);",
              "}",
              "#endif",
          ]
          lines[last + 1:last + 1] = patch
          open(p, "w").write("\n".join(lines))
          print("module_assert_mutex ditambahkan setelah baris", last + 1)
          PY
          grep -n 'module_assert_mutex' kernel/module.c | head -n 5

      - name: Build kernel
        run: |
          cd kernel
          set +e
          # shellcheck disable=SC2086
          make $MAKE_FLAGS -j"$(nproc)" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### Build gagal"
              echo
              echo "Error pertama:"
              echo '```'
              grep -m 15 -E 'error:|Error [0-9]+|undefined reference' build.log || true
              echo '```'
              echo "40 baris terakhir:"
              echo '```'
              tail -n 40 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

          boot=out/arch/arm64/boot
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "$boot/$f" ]; then echo "KERNEL_IMAGE=$boot/$f" >> "$GITHUB_ENV"; break; fi
          done
          echo "KERNEL_REL=$(make $MAKE_FLAGS -s kernelrelease 2>/dev/null | tail -n 1)" >> "$GITHUB_ENV"

      - name: Verifikasi hasil build
        run: |
          set -euo pipefail
          cd kernel
          [ -n "${KERNEL_IMAGE:-}" ] || { echo "::error::Image kernel tidak ditemukan"; exit 1; }
          raw=out/arch/arm64/boot/Image
          grep -a -q -i 'nomount' "$raw" && echo "OK   NoMount ada di Image" || { echo "::error::NoMount tidak ada di Image"; exit 1; }
          grep -a -q -i 'ksu' "$raw" && echo "OK   KSU ada di Image" || { echo "::error::KSU tidak ada di Image"; exit 1; }
          grep -a -q -i 'susfs' "$raw" && echo "info SUSFS ada di Image" || echo "info SUSFS tidak ada di Image (tidak diminta)"

      - name: Paketkan AnyKernel3
        run: |
          set -euo pipefail
          git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE
          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=LunarKnight (FinaSU + NoMount) - Redmi Note 5 Pro
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' ak3/anykernel.sh
          cp "kernel/$KERNEL_IMAGE" "ak3/$(basename "$KERNEL_IMAGE")" 2>/dev/null || cp "$KERNEL_IMAGE" "ak3/$(basename "$KERNEL_IMAGE")"

          stamp="$(date -u +%Y%m%d-%H%M)"
          zipname="LunarKnight-whyred-FinaSU-NoMount-${KERNEL_REL:-4.19}-${stamp}.zip"
          mkdir -p dist
          (cd ak3 && zip -r9q "../dist/${zipname}" . -x '.git*')
          echo "ZIP_NAME=${zipname}" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Unduh manager FinaSU (opsional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download --repo "$FINASU_REPO" --pattern '*.apk' --dir dist --clobber
          ls -lh dist

      - name: Ringkasan
        if: ${{ success() }}
        run: |
          {
            echo "### Build berhasil"
            echo
            echo "- Kernel: \`${KERNEL_REL:-?}\` dari \`${KERNEL_REPO}\` branch \`${{ inputs.kernel_branch }}\`"
            echo "- FinaSU: commit \`${FINASU_SHA:-?}\`"
            echo "- NoMount: fingerprint source \`${NOMOUNT_FP:-?}\`"
            echo "- Paket: \`${ZIP_NAME}\`"
            echo
            echo "Setelah flash, pasang manager FinaSU dari artifact, buka Pengaturan > backend mount, lalu cek status driver NoMount."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarKnight-whyred-FinaSU-NoMount
          path: dist/*
          if-no-files-found: error

      - name: Rilis
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: whyred-finasu-${{ github.run_number }}
          name: "LunarKnight whyred FinaSU + NoMount (run ${{ github.run_number }})"
          files: dist/*
          body: |
            Kernel ${{ env.KERNEL_REL }}, FinaSU ${{ env.FINASU_SHA }}, NoMount built-in.
