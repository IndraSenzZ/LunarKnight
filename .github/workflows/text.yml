            --notes "Kernel ${KVER}-st20 @ ${KSHA} | KernelSU-Next ${KSUN_REPO}@${KSUN_REF} (manual hooks, SUSFS built-in) | NoMount ${NOMOUNT_REF} (built-in) | Neutron Clang"