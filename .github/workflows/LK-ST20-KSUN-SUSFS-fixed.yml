name: Build LunarKnight whyred 4.19 (KSU-Next legacy latest + SUSFS v2.4.0 + NoMount dev + AOSP Clang r547379)

# Taruh file ini di .github/workflows/build-kernel.yml
# Di root repo harus ada:
#   susfs_patch_to_4.19.patch   (isi: SUSFS v2.4.0; nama susfs_patch_to_4_19.patch juga diterima)
#   susfs_inline_hook_patches.sh

on:
  workflow_dispatch:
    inputs:
      nomount_branch:
        description: "Branch NoMount untuk integrasi kernel (dev = 2.2.0-dev-<jumlah commit>)"
        required: false
        default: "dev"
      susfs_variant_label:
        description: "Label SUSFS_VARIANT yang ditampilkan ke userspace/manager (GKI atau NON-GKI)"
        required: false
        default: "GKI"

env:
  KERNEL_REPO: https://github.com/IndraSenzZ/LunarKnight.git
  KERNEL_BRANCH: back
  DEFCONFIG: vendor/whyred-perf_defconfig
  LOCALVERSION_TAG: "-LunarKnight"
  EXPECT_RELEASE: "4.19.325-st20-LunarKnight"
  KBUILD_BUILD_USER: Shirakumo
  KBUILD_BUILD_HOST: Github
  # toolchain: AOSP prebuilts clang-r547379 = clang 20.0.0 + LLD 20.0.0
  AOSP_CLANG_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  AOSP_CLANG_BRANCH: main-kernel
  AOSP_CLANG_DIR: clang-r547379
  EXPECT_CLANG_VER: "20.0.0"
  EXPECT_LLD_VER: "20.0.0"
  NOMOUNT_MIN_COMMITS: "680"
  # versi SUSFS yang wajib ada di patch (build berhenti kalau patch di repo bukan versi ini)
  SUSFS_EXPECT_VER: "v2.4.0"
  # override versi KernelSU-Next TIDAK ditulis manual: dibaca dari kernel/Kbuild source KSU-Next legacy
  # (step "Integrasi KernelSU-Next legacy") lalu diekspor ke GITHUB_ENV

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo (file patch ada di sini)
        uses: actions/checkout@v6

      - name: Cek file masukan
        run: |
          set -euo pipefail
          echo "branch workflow: $GITHUB_REF_NAME"
          echo "file susfs di root checkout:"; ls -la | grep -i susfs || echo "(tidak ada)"
          P="$(ls susfs_patch_to_4.19.patch* susfs_patch_to_4_19.patch* 2>/dev/null | head -n1 || true)"
          H="$(ls susfs_inline_hook_patches.sh* 2>/dev/null | head -n1 || true)"
          [ -n "$P" ] || { echo "::error::susfs_patch_to_4.19.patch tidak ada di branch '$GITHUB_REF_NAME'. Jalankan workflow dari branch yang berisi file itu."; exit 1; }
          [ -n "$H" ] || { echo "::error::susfs_inline_hook_patches.sh tidak ada di branch '$GITHUB_REF_NAME'."; exit 1; }
          [ "$P" = susfs_patch_to_4.19.patch ] || cp "$P" susfs_patch_to_4.19.patch
          [ "$H" = susfs_inline_hook_patches.sh ] || cp "$H" susfs_inline_hook_patches.sh
          echo "patch=$P hook=$H"

      - name: Paket build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio zip zstd lz4 xz-utils \
            patch python3 git curl wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache binutils

      - name: AOSP Clang r547379 (clang 20.0.0 + LLD 20)
        run: |
          set -euo pipefail
          # partial clone (tanpa blob) + shallow + sparse: hanya folder $AOSP_CLANG_DIR yang diunduh
          git clone --depth=1 --single-branch --no-tags --filter=blob:none --sparse \
            -b "$AOSP_CLANG_BRANCH" "$AOSP_CLANG_REPO" "$HOME/aosp-clang"
          cd "$HOME/aosp-clang"
          git sparse-checkout set "$AOSP_CLANG_DIR"
          CLANG_ROOT="$HOME/aosp-clang/$AOSP_CLANG_DIR"
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            test -x "$CLANG_ROOT/bin/$t" || { echo "::error::$t tidak ada / tidak executable di $CLANG_ROOT/bin"; ls "$CLANG_ROOT/bin" | head -n 60; exit 1; }
          done
          echo "$CLANG_ROOT/bin" >> "$GITHUB_PATH"
          echo "CLANG_ROOT=$CLANG_ROOT" >> "$GITHUB_ENV"
          du -sh "$CLANG_ROOT" "$HOME/aosp-clang/.git"

      - name: Verifikasi toolchain (clang + LLD)
        run: |
          set -euo pipefail
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            echo "$t -> $(command -v "$t")"
          done
          [ "$(command -v clang)" = "$CLANG_ROOT/bin/clang" ] || { echo "::error::clang yang terpakai bukan AOSP $AOSP_CLANG_DIR"; exit 1; }
          [ "$(command -v ld.lld)" = "$CLANG_ROOT/bin/ld.lld" ] || { echo "::error::ld.lld yang terpakai bukan AOSP $AOSP_CLANG_DIR"; exit 1; }
          echo "---- clang --version ----"; clang --version
          echo "---- ld.lld --version ----"; ld.lld --version
          clang --version | head -n 1 | grep -qF "based on ${AOSP_CLANG_DIR#clang-}" \
            || { echo "::error::clang bukan build ${AOSP_CLANG_DIR#clang-}"; exit 1; }
          clang --version | head -n 1 | grep -qF "clang version $EXPECT_CLANG_VER" \
            || { echo "::error::versi clang bukan $EXPECT_CLANG_VER"; exit 1; }
          ld.lld --version | head -n 1 | grep -qF "LLD $EXPECT_LLD_VER" \
            || { echo "::error::versi LLD bukan $EXPECT_LLD_VER"; exit 1; }

      - name: Clone kernel LunarKnight
        run: |
          set -euo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" lk
          head -n 5 lk/Makefile
          cat lk/localversion-st
          test -f "lk/arch/arm64/configs/$DEFCONFIG" || { echo "::error::defconfig $DEFCONFIG tidak ada"; exit 1; }

      - name: Integrasi KernelSU-Next legacy (resmi)
        working-directory: lk
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          test -d KernelSU-Next/kernel || { echo "::error::KernelSU-Next/kernel tidak ada"; exit 1; }
          test -L drivers/kernelsu || { echo "::error::symlink drivers/kernelsu tidak ada"; exit 1; }
          cd KernelSU-Next
          # 1) paksa ke ujung terbaru branch legacy resmi (bukan commit lama hasil cache)
          git fetch --tags --force origin legacy
          git reset -q --hard FETCH_HEAD
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --tags --force origin; fi
          REMOTE="$(git ls-remote origin refs/heads/legacy | cut -f1)"
          [ -n "$REMOTE" ] && [ "$(git rev-parse HEAD)" = "$REMOTE" ] \
            || { echo "::error::driver KernelSU-Next tidak sama dengan ujung branch legacy"; exit 1; }
          echo "KSUN legacy HEAD : $(git rev-parse HEAD)"
          echo "KSUN commit count: $(git rev-list --count HEAD)"
          # 2) override versi = nilai yang memang ada di kernel/Kbuild source KSU-Next legacy yang dipakai
          #    (dibaca otomatis, bukan angka tulis-tangan). Dipakai lagi di step build + verifikasi.
          KB=kernel/Kbuild
          echo "---- baris versi/override di Kbuild ----"
          grep -nE 'KSU_VERSION|KSU_GIT|_OVERRIDE|_FALLBACK|git describe|git rev-list' "$KB" | head -n 40 || true
          grep -q 'KSU_VERSION' "$KB" || { echo "::error::kernel/Kbuild tidak punya KSU_VERSION"; exit 1; }
          grep -q 'KSU_VERSION_TAG_OVERRIDE' "$KB" || { echo "::error::Kbuild legacy tidak punya KSU_VERSION_TAG_OVERRIDE"; exit 1; }
          COUNT="$(git rev-list --count HEAD)"
          OV="$(sed -nE 's/^[[:space:]]*KSU_VERSION_OVERRIDE[[:space:]]*:?=[[:space:]]*([0-9]+).*/\1/p' "$KB" | head -n1)"
          TV="$(sed -nE 's/^[[:space:]]*KSU_VERSION_TAG_OVERRIDE[[:space:]]*:?=[[:space:]]*"?([^"[:space:]#]+)"?.*/\1/p' "$KB" | head -n1)"
          SRC_OV="Kbuild: KSU_VERSION_OVERRIDE := $OV"
          if [ -z "$OV" ]; then
            # Kbuild tidak mengunci angka statis: pakai rumus Kbuild (base + jumlah commit + offset)
            BASE="$(grep -E 'expr [0-9]+ \+ \$\(KSU_GIT_VERSION\)' "$KB" | grep -oE 'expr [0-9]+' | awk '{print $2}' | tail -n1 || true)"
            BASE="${BASE:-30000}"
            OFF="$(grep -E "expr ${BASE} \+" "$KB" | grep -oE '\+[[:space:]]*[0-9]+' | tail -n1 | tr -dc '0-9' || true)"
            OV="$((BASE + COUNT + ${OFF:-0}))"
            SRC_OV="rumus Kbuild: $BASE + $COUNT commit + ${OFF:-0}"
          fi
          SRC_TV="Kbuild: KSU_VERSION_TAG_OVERRIDE := $TV"
          if [ -z "$TV" ]; then
            # Sesuai Kbuild: KSU_GIT_TAG := git describe --tags --abbrev=0
            RAW_TAG="$(git describe --tags --abbrev=0 2>/dev/null || git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            TV="$(printf '%s' "$RAW_TAG" | sed -E 's/-legacy.*$//')"
            SRC_TV="git describe (tag rilis terbaru di branch legacy: ${RAW_TAG:-none} -> $TV)"
          fi
          [[ "$OV" =~ ^[0-9]{5,}$ ]] || { echo "::error::override versi KSU tidak valid: '$OV'"; exit 1; }
          [[ "$TV" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::override tag KSU tidak valid: '$TV'"; exit 1; }
          echo "KSU_VERSION_OVERRIDE=$OV" >> "$GITHUB_ENV"
          echo "KSU_VERSION_TAG_OVERRIDE=$TV" >> "$GITHUB_ENV"
          echo "KSUN override dari source -> versi $OV ($SRC_OV) | tag $TV ($SRC_TV)"
          echo "KSUN commit      : $(git log -1 --format='%h %cd %s')"

      - name: Patch SUSFS (4.19)
        working-directory: lk
        env:
          SUSFS_VARIANT_LABEL: ${{ github.event.inputs.susfs_variant_label || 'GKI' }}
        run: |
          mkdir -p ../glue
          cat > ../glue/fix_rejects.py <<'FIX_REJECTS_PY_EOF'
          #!/usr/bin/env python3
          '''Finish the SUSFS 4.19 patch (v2.4.0) on a tree that is slightly different from the one
          the patch was made on.

          Only a few known hunks are re-applied here (include / declaration hunks and one anchored
          hunk that hooks the mount allocator: vfs_kern_mount() on a plain 4.19 tree, vfs_create_mount()
          on a tree that has the fs_context mount API backported). Every rejected hunk is classified by its own content, not by a
          counter or by a marker that may also come from another hunk (v2.4.0 uses the label
          `bypass_orig_flow:` in several functions of fs/namespace.c). Any hunk that is not known
          aborts the build and prints the hunk.
          Run from the kernel root right after `patch -p1`.
          '''
          import os, re, subprocess, sys


          def die(m):
              print("::error::" + m)
              sys.exit(1)


          def rd(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def wr(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def once(s, old, new, what):
              n = s.count(old)
              if n != 1:
                  die(f"{what}: anchor {old.strip()[:60]!r} found {n} times (need 1)")
              return s.replace(old, new)


          def plus_block_from_hunk(h):
              lines = []
              for ln in h.splitlines():
                  if ln.startswith("+") and not ln.startswith("+++"):
                      lines.append(ln[1:])
              return "\n".join(lines) + ("\n" if lines else "")


          INC_DEF = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n"

          # Support both single-line and multi-line return type formatting for vfs_kern_mount and vfs_create_mount
          MNT_SITES = (
              ("vfs_kern_mount", r"(?m)^(?:struct\s+vfsmount\s*\*+\s*)?\n?vfs_kern_mount\s*\(\s*struct\s+file_system_type\s*\*type,\s*int\s+flags,\s*const\s+char\s*\*name,\s*void\s*\*data\s*\)\s*\n"
                                 r"\{\n(.*?)^\}\n"),
              ("vfs_create_mount", r"(?m)^(?:struct\s+vfsmount\s*\*+\s*)?\n?vfs_create_mount\s*\(\s*struct\s+fs_context\s*\*fc\s*\)\s*\n"
                                   r"\{\n(.*?)^\}\n"),
          )
          ALLOC_RE = (r"\tmnt = alloc_vfsmnt\((?P<arg>[^;\n]+)\);\n"
                      r"\tif \(!mnt\)\n\t\treturn ERR_PTR\(-ENOMEM\);\n")


          def mnt_alloc_site(s):
              '''-> (function name, regex match of its body). The one function that calls alloc_vfsmnt().'''
              found = []
              for name, rx in MNT_SITES:
                  m = re.search(rx, s, re.S)
                  if m and "alloc_vfsmnt(" in m.group(1):
                      found.append((name, m))
              if len(found) != 1:
                  die("fs/namespace.c: expected exactly one of vfs_kern_mount()/vfs_create_mount() to call "
                      "alloc_vfsmnt(), found: " + (", ".join(n for n, _ in found) or "none"))
              return found[0]


          # ---- re-appliers: idempotent, each one checks its own result in its own scope ------------
          def fix_ns_include(h=None):
              p = "fs/namespace.c"
              s = rd(p)
              if "<linux/susfs_def.h>" in s:
                  return
              s = once(s, '#include "pnode.h"\n', INC_DEF + '\n#include "pnode.h"\n', p)
              s = once(s, '#include "internal.h"\n',
                       '#include "internal.h"\n\n'
                       '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                       'extern bool susfs_is_current_ksu_domain(void);\n'
                       'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n'
                       '#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n\n'
                       '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n', p)
              wr(p, s)


          def fix_ns_mount_alloc(h=None):
              p = "fs/namespace.c"
              s = rd(p)
              fn, m = mnt_alloc_site(s)
              body = m.group(1)
              if "susfs_alloc_non_unshare_ksu_vfsmnt" in body:
                  return
              am = list(re.finditer(ALLOC_RE, body))
              if len(am) != 1:
                  die(f"{p}: {fn}(): alloc_vfsmnt() anchor not found ({len(am)} matches)")
              arg = am[0].group("arg")                       # "name" or 'fc->source ?: "none"'
              sus_arg = arg if "?:" in arg else arg + ' ?:"none"'
              new = ("#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                     "\t// - We will just stop checking for ksu process if /sdcard/Android is accessible,\n"
                     "\t//   for the sake of performance\n"
                     "\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n"
                     "\t\tif (susfs_is_current_ksu_domain()) {\n"
                     f"\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt({sus_arg});\n"
                     "\t\t\tgoto bypass_orig_flow;\n"
                     "\t\t}\n"
                     "\t}\n"
                     "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n"
                     f"\tmnt = alloc_vfsmnt({arg});\n\n"
                     "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                     "bypass_orig_flow:\n"
                     "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                     "\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);\n")
              body = body[:am[0].start()] + new + body[am[0].end():]
              s = s[:m.start(1)] + body + s[m.end(1):]
              wr(p, s)
              print(f"  mount allocation hook placed in {fn}()")


          def fix_cmdline(h=None):
              p = "fs/proc/cmdline.c"
              s = rd(p)
              if "susfs_spoof_cmdline_or_bootconfig" in s:
                  return
              s = once(s, "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n",
                       "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                       "extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n"
                       "extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n"
                       "#endif\n\n"
                       "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n"
                       "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                       "\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n"
                       "\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n"
                       "\t\tseq_putc(m, '\\n');\n"
                       "\t\treturn 0;\n"
                       "\t}\n"
                       "#endif\n", p)
              wr(p, s)


          def fix_task_mmu_include(h=None):
              p = "fs/proc/task_mmu.c"
              s = rd(p)
              if "<linux/susfs_def.h>" in s:
                  return
              inc = plus_block_from_hunk(h) if h else (
                  "#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif // #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n\n"
              )
              s = once(s, "#include <asm/elf.h>\n", inc + "#include <asm/elf.h>\n", p)
              wr(p, s)


          def fix_super_include(h=None):
              p = "fs/super.c"
              s = rd(p)
              if "<linux/susfs_def.h>" in s:
                  return
              s = once(s, '#include "internal.h"\n',
                       INC_DEF + '#include "internal.h"\n\n'
                       '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                       'extern bool susfs_is_current_ksu_domain(void);\n'
                       'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n'
                       '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n', p)
              wr(p, s)


          INC_HUNK = r"(?m)^\+#include <linux/susfs_def\.h>"
          KNOWN = {
              "fs/namespace.c": [(INC_HUNK, fix_ns_include),
                                 (r"(?m)^\+.*susfs_alloc_non_unshare_ksu_vfsmnt\((?:name|fc->source)", fix_ns_mount_alloc)],
              "fs/proc/cmdline.c": [(r"susfs_spoof_cmdline_or_bootconfig", fix_cmdline)],
              "fs/proc/task_mmu.c": [(INC_HUNK, fix_task_mmu_include)],
              "fs/super.c": [(INC_HUNK, fix_super_include)],
          }

          rejs = subprocess.run(["find", ".", "-name", "*.rej"], capture_output=True, text=True).stdout.split()
          rejs = sorted(p[2:-4] if p.startswith("./") else p[:-4] for p in rejs)
          print("rejected files:", rejs or "none")

          for f in rejs:
              if f not in KNOWN:
                  print(rd(f + ".rej"))
                  die(f"unexpected reject in {f}")
              hunks = [h for h in re.split(r"(?m)^(?=@@ )", rd(f + ".rej")) if h.startswith("@@ ")]
              todo = []
              for h in hunks:
                  for pat, fn in KNOWN[f]:
                      if re.search(pat, h):
                          if not any(existing_fn == fn for existing_fn, _ in todo):
                              todo.append((fn, h))
                          break
                  else:
                      print(h)
                      die(f"{f}: rejected hunk is not one of the known ones (see above)")
              for fn, h in todo:
                  fn(h)
                  print(f"re-applied {fn.__name__} ({f})")
              os.remove(f + ".rej")
              if os.path.exists(f + ".orig"):
                  os.remove(f + ".orig")

          # ---- final consistency check (each marker is checked in its own scope) ------------------
          ns = rd("fs/namespace.c")
          for m in ("<linux/susfs_def.h>", "#define CL_COPY_MNT_NS", "susfs_alloc_non_unshare_ksu_vfsmnt(const char *name)",
                    "susfs_alloc_unshare_ksu_vfsmnt(const char *name, int old_mnt_id)"):
              if m not in ns:
                  die(f"fs/namespace.c: missing {m!r} after fix")
          fn, mm = mnt_alloc_site(ns)
          for m in ("susfs_alloc_non_unshare_ksu_vfsmnt(", "susfs_is_current_ksu_domain()", "bypass_orig_flow:", "alloc_vfsmnt("):
              if m not in mm.group(1):
                  die(f"fs/namespace.c: {fn}() is missing {m!r} after fix")
          if mm.group(1).index("bypass_orig_flow:") < mm.group(1).index("alloc_vfsmnt("):
              die(f"fs/namespace.c: {fn}(): bypass_orig_flow label is before alloc_vfsmnt()")
          mnt_grp = re.search(r"(?m)^static int mnt_alloc_group_id\(.*?^\}\n", ns, re.S | re.M)
          if not mnt_grp or "susfs_is_current_ksu_domain()" not in mnt_grp.group(0):
              die("fs/namespace.c: mnt_alloc_group_id() hunk missing")
          checks = {
              "fs/proc/cmdline.c": ["susfs_spoof_cmdline_or_bootconfig"],
              "fs/proc/task_mmu.c": ["<linux/susfs_def.h>"],
              "fs/super.c": ["<linux/susfs_def.h>", "susfs_is_current_ksu_domain"],
          }
          for f, marks in checks.items():
              s = rd(f)
              for m in marks:
                  if m not in s:
                      die(f"{f}: missing {m!r} after fix")
          print("SUSFS patch completed (rejects re-applied: %s)" % (", ".join(rejs) or "none"))
          FIX_REJECTS_PY_EOF
          set +e
          patch -p1 --no-backup-if-mismatch < ../susfs_patch_to_4.19.patch 2>&1 | tee ../patch.log
          set -e
          # `patch` is allowed to reject hunks (fix_rejects.py re-applies the known ones), but every
          # other failure mode (file missing, already applied, corrupt patch) must stop the build here
          if grep -qE 'No file to patch|Skipping patch|Reversed \(or previously applied\)|malformed patch|can.t find file' ../patch.log; then
            echo "::error::patch gagal bukan karena hunk ditolak (file tidak ada / sudah terpasang / patch rusak):"
            grep -nE 'No file to patch|Skipping patch|Reversed \(or previously applied\)|malformed patch|can.t find file' ../patch.log
            exit 1
          fi
          python3 ../glue/fix_rejects.py
          test -z "$(find . -name '*.rej')" || { echo "::error::masih ada hunk yang ditolak"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          test -f include/linux/susfs.h && test -f include/linux/susfs_def.h
          if [ "$SUSFS_VARIANT_LABEL" = "GKI" ]; then
            sed -i 's/"NON-GKI"/"GKI"/g' include/linux/susfs.h
            if grep -Fq '"NON-GKI"' include/linux/susfs.h; then echo "::error::literal \"NON-GKI\" masih ada di susfs.h"; exit 1; fi
            grep -q 'define SUSFS_VARIANT "GKI"' include/linux/susfs.h || { echo "::error::SUSFS_VARIANT tidak berubah"; exit 1; }
          fi
          SUSFS_VER="$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h | head -n1)"
          [ -n "$SUSFS_VER" ] || { echo "::error::SUSFS_VERSION tidak terbaca dari susfs.h"; exit 1; }
          [ "$SUSFS_VER" = "$SUSFS_EXPECT_VER" ] || { echo "::error::versi SUSFS di patch = $SUSFS_VER, diharapkan $SUSFS_EXPECT_VER (cek isi susfs_patch_to_4.19.patch di repo)"; exit 1; }
          echo "SUSFS_VER=$SUSFS_VER" >> "$GITHUB_ENV"
          echo "SUSFS_VARIANT_LABEL=$SUSFS_VARIANT_LABEL" >> "$GITHUB_ENV"
          echo "SUSFS versi dari patch: $SUSFS_VER (label: $SUSFS_VARIANT_LABEL)"

      - name: Audit patch SUSFS (P0 reject + P1 fuzz/offset + frekuensi baris + diff)
        working-directory: lk
        run: |
          python3 - <<'AUDIT_PY_EOF'
          import os, re, subprocess
          from collections import Counter

          out = []
          def say(s=""):
              print(s); out.append(s)

          def find_enclosing_func(filepath, line_no):
              if not os.path.isfile(filepath):
                  return "?"
              lines = open(filepath, encoding="utf-8", errors="replace").read().splitlines()
              idx = min(max(line_no - 1, 0), len(lines) - 1)
              for i in range(idx, -1, -1):
                  ln = lines[i]
                  if ln and not ln[0].isspace() and not ln.startswith(("#", "/", "*", "}", ";")):
                      if "(" in ln or (i + 1 < len(lines) and "(" in lines[i + 1]):
                          return ln.strip()
              return "(level file / deklarasi global)"

          # ---- P0: hitung hunk berhasil / gagal per file dari log patch ----
          cur, stat, notes = None, {}, []
          for ln in open("../patch.log", encoding="utf-8", errors="replace").read().splitlines():
              m = re.match(r"patching file (\S+)", ln)
              if m:
                  cur = m.group(1); stat.setdefault(cur, {"ok": 0, "fail": 0}); continue
              if cur is None:
                  continue
              m = re.match(r"Hunk #(\d+) succeeded at (\d+)(?: with fuzz (\d+))?(?: \(offset (-?\d+) lines?\))?", ln)
              if m:
                  stat[cur]["ok"] += 1
                  fz, off = int(m.group(3) or 0), int(m.group(4) or 0)
                  if fz or abs(off) >= 100:
                      notes.append((cur, int(m.group(1)), int(m.group(2)), fz, off))
                  continue
              if re.match(r"Hunk #\d+ FAILED", ln):
                  stat[cur]["fail"] += 1
          tot_ok = sum(s["ok"] for s in stat.values()); tot_fail = sum(s["fail"] for s in stat.values())
          bad = {f: s for f, s in stat.items() if s["fail"]}
          say(f"Hunk gagal saat patch awal: {tot_fail} di {len(bad)} file (berhasil langsung: {tot_ok})")
          say("| File | Berhasil | Gagal Awal |"); say("|---|---:|---:|")
          for f, s in bad.items():
              say(f"| {f} | {s['ok']} | {s['fail']} |")
          say(f"| Total | {tot_ok} | {tot_fail} |")
          rej = subprocess.run(["find", ".", "-name", "*.rej"], capture_output=True, text=True).stdout.split()
          say("sisa .rej setelah fix_rejects.py: " + (", ".join(rej) if rej else "tidak ada"))
          if rej:
              raise SystemExit("::error::masih ada file .rej tersisa")

          # ---- P1: hunk dengan fuzz / offset besar + fungsi yang dimodifikasi ----
          say(""); say("Hunk dengan fuzz atau offset >= 100 baris:")
          if not notes:
              say("  tidak ada")
          for f, n, at, fz, off in notes:
              d = subprocess.run(["git", "diff", "-U0", "--", f], capture_output=True, text=True).stdout
              fn = None
              for h in re.finditer(r"(?m)^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@ ?(.*)$", d):
                  if abs(int(h.group(1)) - at) <= 45:
                      fn = h.group(2).strip() or None
                      if fn:
                          break
              if not fn:
                  fn = find_enclosing_func(f, at)
              say(f"  {f} hunk #{n} @ {at}: fuzz {fz}, offset {off} -> fungsi: {fn}")
          for f in sorted({n[0] for n in notes if n[3] or abs(n[4]) >= 300}):
              print(f"::group::git diff {f}")
              print(subprocess.run(["git", "diff", "-U2", "--", f], capture_output=True, text=True).stdout[:12000])
              print("::endgroup::")

          # ---- P1: audit baris tambahan patch beserta jumlah kemunculannya (multi-hunk frequency check) ----
          files, cur = {}, None
          for ln in open("../susfs_patch_to_4.19.patch", encoding="utf-8", errors="replace").read().splitlines():
              if ln.startswith("+++ "):
                  p = ln[4:].split("\t")[0].strip()
                  cur = p[2:] if p.startswith("b/") else p
                  files.setdefault(cur, Counter())
              elif cur and ln.startswith("+") and not ln.startswith("+++"):
                  t = ln[1:].strip()
                  if t and not t.startswith("//"):
                      files[cur][t] += 1

          # Adaptasi resmi yang memang sengaja diubah oleh fix_rejects.py / sed varian
          KNOWN_ADAPTATIONS = {
              ("fs/namespace.c", 'mnt = susfs_alloc_non_unshare_ksu_vfsmnt(name ?:"none");'):
                  'mnt = susfs_alloc_non_unshare_ksu_vfsmnt(fc->source ?: "none");',
              ("include/linux/susfs.h", '#define SUSFS_VARIANT "NON-GKI"'):
                  '#define SUSFS_VARIANT "GKI"',
          }

          say(""); say("Audit eksistensi & frekuensi baris tambahan patch di file hasil:")
          any_missing = False
          adapted_notes = []
          for f, exp_counts in files.items():
              if not os.path.isfile(f):
                  any_missing = True
                  say(f"  {f}: FILE TIDAK DITEMUKAN")
                  continue
              have_counts = Counter(x.strip() for x in open(f, encoding="utf-8", errors="replace"))
              under = []
              for line_txt, exp_n in exp_counts.items():
                  got_n = have_counts.get(line_txt, 0)
                  if got_n < exp_n:
                      alt = KNOWN_ADAPTATIONS.get((f, line_txt))
                      if alt and have_counts.get(alt, 0) >= (exp_n - got_n):
                          adapted_notes.append(f"  {f}: '{line_txt}' -> teradaptasi menjadi '{alt}' (OK)")
                          continue
                      under.append((line_txt, exp_n, got_n))
              if under:
                  any_missing = True
                  say(f"  {f}: {len(under)} pola baris kurang/tidak ada")
                  for t, exp_n, got_n in under[:10]:
                      say(f"     [butuh {exp_n}x, ada {got_n}x] + {t[:100]}")
                  print(f"::warning file={f}::{len(under)} pola baris patch kurang dari frekuensi seharusnya")
          for an in adapted_notes:
              say(an)
          if not any_missing:
              say("  semua baris dan frekuensi kemunculan sesuai 100% (0 baris hilang)")
          say(""); say("git diff --stat (file yang disentuh patch):")
          say(subprocess.run(["git", "diff", "--stat"], capture_output=True, text=True).stdout)
          open("../patch-audit.txt", "w").write("\n".join(out) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Audit patch SUSFS\n\n```\n" + "\n".join(out) + "\n```\n")
          AUDIT_PY_EOF

      - name: Kconfig SUSFS (Sinkronisasi otomatis dengan patch SUSFS)
        working-directory: lk
        run: |
          set -euo pipefail
          cat > fs/Kconfig.susfs <<'KCONFIG_SUSFS_EOF'
          menu "KernelSU - SUSFS"

          config KSU_SUSFS
          	bool "KernelSU addon - SUSFS"
          	depends on KSU && KSU != m
          	default y
          	help
          	  SUSFS for KernelSU-Next (legacy, manual hooks).

          config KSU_SUSFS_SUS_PATH
          	bool "Hide suspicious paths"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MOUNT
          	bool "Hide suspicious mounts"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_KSTAT
          	bool "Spoof kstat of suspicious files"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_UNAME
          	bool "Spoof uname"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable SUSFS logging (runtime switch)"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "Spoof /proc/cmdline or /proc/bootconfig"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Redirect opened files"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MAP
          	bool "Hide suspicious memory maps"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_PRIORITY_UID_FILTER
          	bool "Priority uid filter for getpriority/setpriority"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Hide KernelSU and SUSFS symbols from kallsyms"
          	depends on KSU_SUSFS
          	default y

          endmenu
          KCONFIG_SUSFS_EOF
          # Deteksi otomatis apabila patch SUSFS mereferensikan CONFIG_KSU_SUSFS_* tambahan di source code
          python3 - <<'SYNC_KCONFIG_PY'
          import re
          from pathlib import Path

          kc_path = Path("fs/Kconfig.susfs")
          kc_text = kc_path.read_text(encoding="utf-8")
          defined = set(re.findall(r"(?m)^config\s+(KSU_SUSFS[A-Z0-9_]*)\b", kc_text))

          referenced = set()
          patch_txt = Path("../susfs_patch_to_4.19.patch").read_text(encoding="utf-8", errors="replace")
          for m in re.findall(r"\bCONFIG_(KSU_SUSFS_[A-Z0-9_]+)\b", patch_txt):
              referenced.add(m)

          missing = sorted(referenced - defined)
          if missing:
              extra_blocks = []
              for sym in missing:
                  extra_blocks.append(
                      f"config {sym}\n"
                      f"\tbool \"Auto-detected SUSFS feature ({sym})\"\n"
                      f"\tdepends on KSU_SUSFS\n"
                      f"\tdefault y\n"
                  )
              kc_text = kc_text.replace("endmenu", "\n" + "\n".join(extra_blocks) + "\nendmenu")
              kc_path.write_text(kc_text, encoding="utf-8")
              print("Menambahkan simbol Kconfig SUSFS tambahan dari patch:", ", ".join(missing))
          else:
              print("Semua simbol CONFIG_KSU_SUSFS_* di patch sudah tercakup di fs/Kconfig.susfs")
          SYNC_KCONFIG_PY
          grep -q 'Kconfig.susfs' fs/Kconfig || printf '\nsource "fs/Kconfig.susfs"\n' >> fs/Kconfig
          grep -c '^config KSU_SUSFS' fs/Kconfig.susfs

      - name: Hook inline SUSFS (sesuai panduan)
        working-directory: lk
        run: |
          set -euo pipefail
          # Simpan hash security/selinux/hooks.c sebelum inline hook dijalankan untuk membuktikan perubahan berasal dari step ini
          SELINUX_BEFORE_SHA="$(sha256sum security/selinux/hooks.c | awk '{print $1}')"
          bash ../susfs_inline_hook_patches.sh | tee ../hook.log
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c \
                   security/selinux/hooks.c kernel/reboot.c kernel/sys.c; do
            grep -q "$f Patched" ../hook.log || { echo "::error::hook gagal di $f"; exit 1; }
          done
          SELINUX_AFTER_SHA="$(sha256sum security/selinux/hooks.c | awk '{print $1}')"
          [ "$SELINUX_BEFORE_SHA" != "$SELINUX_AFTER_SHA" ] || { echo "::error::security/selinux/hooks.c tidak berubah setelah susfs_inline_hook_patches.sh"; exit 1; }
          # Simpan baris-baris yang ditambahkan oleh inline hook pada security/selinux/hooks.c untuk diverifikasi di tahap Glue & Backport
          git diff -U0 -- security/selinux/hooks.c | grep -E '^\+[^+]' > ../selinux_hook_added.lines
          test -s ../selinux_hook_added.lines || { echo "::error::tidak ada baris tambahan di security/selinux/hooks.c"; exit 1; }
          echo "---- Baris inline hook yang disuntikkan ke security/selinux/hooks.c ----"
          cat ../selinux_hook_added.lines
          # the hook script writes pr_info("...()\\n") into kernel/sys.c, which prints a literal backslash-n
          # (the glue step renames ksu_handle_setresuid -> susfs_ksu_handle_setresuid later, so match without prefix)
          sed -i 's|handle_setresuid()\\\\n");|handle_setresuid()\\n");|' kernel/sys.c
          grep -qF 'handle_setresuid()\n");' kernel/sys.c || { echo "::error::pr_info di kernel/sys.c tidak terkoreksi"; exit 1; }
          if grep -qF 'handle_setresuid()\\n' kernel/sys.c; then echo "::error::masih ada backslash ganda di kernel/sys.c"; exit 1; fi

      - name: Glue SUSFS <-> KernelSU-Next legacy
        working-directory: lk
        run: |
          set -euo pipefail
          mkdir -p ../glue
          cat > ../glue/susfs_glue.c <<'SUSFS_GLUE_C_EOF'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * susfs_glue.c - SUSFS <-> KernelSU-Next (legacy) bridge
           *
           * Target : 4.19 non-GKI, manual / inline hooks (no kprobes).
           * Role   : provides the KernelSU-side symbols that the SUSFS kernel patch and
           *          the SUSFS inline hooks expect, and adapts them to the structure of
           *          the official KernelSU-Next legacy branch.
           */
          #ifdef CONFIG_KSU_SUSFS

          #include <linux/err.h>
          #include <linux/sched.h>
          #include <linux/cred.h>
          #include <linux/string.h>
          #include <linux/uaccess.h>
          #include <linux/workqueue.h>
          #include <linux/fs.h>
          #include <linux/susfs.h>
          #include <linux/susfs_def.h>

          #include "klog.h" // IWYU pragma: keep
          #include "ksu.h"
          #include "policy/allowlist.h"
          #include "selinux/selinux.h"
          #include "manager/manager_identity.h"
          #include "hook/setuid_hook.h"
          #include "feature/sucompat.h"

          #define SUSFS_GLUE_SU_PATH "/system/bin/su"
          #define SUSFS_GLUE_SH_PATH "/system/bin/sh"

          extern struct work_struct susfs_extra_works;
          #ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER
          extern void susfs_parse_priority_app_strings(void);
          #endif

          /* ------------------------------------------------------------------ */
          /* symbols required by susfs.c / security/selinux/avc.c                 */
          /* ------------------------------------------------------------------ */
          u32 susfs_ksu_sid;
          u32 susfs_priv_app_sid;

          static void susfs_ksu_resolve_sids(void)
          {
          	static const char ksu_ctx[] = KERNEL_SU_CONTEXT;
          	static const char priv_ctx_mcs[] = "u:r:priv_app:s0:c512,c768";
          	static const char priv_ctx_base[] = "u:r:priv_app:s0";

          	if (!susfs_ksu_sid)
          		(void)ksu_security_secctx_to_secid(ksu_ctx, strlen(ksu_ctx),
          						   &susfs_ksu_sid);
          	if (!susfs_priv_app_sid)
          		(void)ksu_security_secctx_to_secid(priv_ctx_mcs, strlen(priv_ctx_mcs),
          						   &susfs_priv_app_sid);
          	if (!susfs_priv_app_sid)
          		(void)ksu_security_secctx_to_secid(priv_ctx_base, strlen(priv_ctx_base),
          						   &susfs_priv_app_sid);
          }

          bool susfs_is_current_ksu_domain(void)
          {
          	if (unlikely(!susfs_ksu_sid))
          		susfs_ksu_resolve_sids();
          	return is_ksu_domain();
          }

          /* called from on_post_fs_data(): policy is loaded and ksu rules are applied */
          void susfs_ksu_post_fs_data(void)
          {
          	susfs_ksu_resolve_sids();
          	susfs_start_sdcard_monitor_fn();
          #ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER
          	susfs_parse_priority_app_strings();
          #endif
          }

          /* ------------------------------------------------------------------ */
          /* inline hook adapters (struct filename based, called from the fs hooks)     */
          /* ------------------------------------------------------------------ */
          static inline void susfs_glue_su_to_sh(struct filename **fn)
          {
          	static const char su[] = SUSFS_GLUE_SU_PATH;
          	static const char sh[] = SUSFS_GLUE_SH_PATH;
          	struct filename *f;

          	BUILD_BUG_ON(sizeof(su) != sizeof(sh));

          	if (unlikely(!ksu_su_compat_enabled || !fn))
          		return;
          	f = *fn;
          	if (IS_ERR_OR_NULL(f) || unlikely(!f->name))
          		return;
          	/*
          	 * Hanya modifikasi buffer jika f->name menunjuk ke buffer internal f->iname
          	 * (bukan string literal .rodata dari getname_kernel) dan UID diizinkan di allowlist.
          	 */
          	if (unlikely(f->name == f->iname && !strcmp(f->name, su)) &&
          	    ksu_is_allow_uid_for_current(current_uid().val))
          		memcpy((void *)f->iname, sh, sizeof(sh));
          }

          int susfs_ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode,
          			       int *flags)
          {
          	susfs_glue_su_to_sh(filename);
          	return 0;
          }

          int susfs_ksu_handle_stat(int *dfd, struct filename **filename, int *flags)
          {
          	susfs_glue_su_to_sh(filename);
          	return 0;
          }

          /* the legacy sucompat has nothing to do after execveat */
          int ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr,
          				      void *argv, void *envp, int *flags,
          				      int *retval)
          {
          	return 0;
          }

          /* ------------------------------------------------------------------ */
          /* setresuid: KernelSU-Next legacy + SUSFS per-process state            */
          /* ------------------------------------------------------------------ */
          int susfs_ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid)
          {
          	uid_t old_uid = current_uid().val;
          	uid_t new_uid = ruid;
          	bool isolated;

          	if (unlikely(ruid == (uid_t)-1))
          		return 0;

          	isolated = is_isolated_process(new_uid);

          	/*
          	 * App reguler di-fork dari zygote (old_uid == 0), sedangkan isolated process
          	 * dapat di-fork dari zygote, webview_zygote (UID 1053), maupun app_zygote.
          	 */
          	if (old_uid != 0 && !isolated)
          		return 0;

          	if (!is_appuid(new_uid) && new_uid != WEBVIEW_ZYGOTE_UID && !isolated) {
          		if (old_uid == 0)
          			ksu_handle_setresuid(old_uid, new_uid);
          		return 0;
          	}

          	if (!isolated && new_uid != WEBVIEW_ZYGOTE_UID && !is_zygote(current_cred())) {
          		if (old_uid == 0)
          			ksu_handle_setresuid(old_uid, new_uid);
          		return 0;
          	}

          	/*
          	 * Pasang flag per-proses SUSFS terlebih dahulu sebelum memanggil ksu_handle_setresuid()
          	 * agar task_work / handler umount KernelSU-Next melihat status ti_flags yang konsisten.
          	 */
          	if (is_uid_manager(new_uid)) {
          		susfs_clear_current_proc_umounted();
          		susfs_clear_current_proc_no_su();
          		if (old_uid == 0)
          			ksu_handle_setresuid(old_uid, new_uid);
          		return 0;
          	}

          	if (ksu_is_allow_uid_for_current(new_uid))
          		susfs_clear_current_proc_no_su();
          	else
          		susfs_set_current_proc_no_su();

          	if (isolated || ksu_uid_should_umount(new_uid)) {
          		susfs_set_current_proc_umounted();
          		/* deferred, so the time spent here stays as small as possible */
          		schedule_work(&susfs_extra_works);
          	} else {
          		susfs_clear_current_proc_umounted();
          	}

          	/* manager fd, seccomp, allow list, module umount (task_work) */
          	if (old_uid == 0)
          		ksu_handle_setresuid(old_uid, new_uid);

          	return 0;
          }

          /* ------------------------------------------------------------------ */
          /* supercall: reboot(KSU_INSTALL_MAGIC1, SUSFS_MAGIC, cmd, &info)       */
          /* returns true when the call was a SUSFS call (handled or rejected)    */
          /* ------------------------------------------------------------------ */
          bool susfs_ksu_handle_reboot(int magic2, unsigned int cmd, void __user **arg)
          {
          	if (likely(magic2 != SUSFS_MAGIC))
          		return false;

          	if (current_uid().val != 0)
          		return true;

          	switch (cmd) {
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
          	case CMD_SUSFS_ADD_SUS_PATH:
          		susfs_add_sus_path(arg);
          		break;
          	case CMD_SUSFS_ADD_SUS_PATH_LOOP:
          		susfs_add_sus_path_loop(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          	case CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS:
          		susfs_set_hide_sus_mnts_for_non_su_procs(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          	case CMD_SUSFS_ADD_SUS_KSTAT:
          	case CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:
          		susfs_add_sus_kstat(arg);
          		break;
          	case CMD_SUSFS_UPDATE_SUS_KSTAT:
          		susfs_update_sus_kstat(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
          	case CMD_SUSFS_SET_UNAME:
          		susfs_set_uname(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_ENABLE_LOG
          	case CMD_SUSFS_ENABLE_LOG:
          		susfs_enable_log(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:
          		susfs_set_cmdline_or_bootconfig(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT
          	case CMD_SUSFS_ADD_OPEN_REDIRECT:
          		susfs_add_open_redirect(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
          	case CMD_SUSFS_ADD_SUS_MAP:
          		susfs_add_sus_map(arg);
          		break;
          #endif
          #ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER
          	case CMD_SUSFS_SET_PRIORITY_UID_FILTER:
          		susfs_set_priority_uid_filter(arg);
          		susfs_parse_priority_app_strings();
          		break;
          #endif
          	case CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING:
          		susfs_ksu_resolve_sids();
          		susfs_set_avc_log_spoofing(arg);
          		break;
          	case CMD_SUSFS_SHOW_VERSION:
          		susfs_show_version(arg);
          		break;
          	case CMD_SUSFS_SHOW_ENABLED_FEATURES:
          		susfs_get_enabled_features(arg);
          		break;
          	case CMD_SUSFS_SHOW_VARIANT:
          		susfs_show_variant(arg);
          		break;
          	default:
          		break;
          	}

          	return true;
          }

          #endif /* CONFIG_KSU_SUSFS */
          SUSFS_GLUE_C_EOF
          grep -qF 'ksu_is_allow_uid_for_current(current_uid().val)' ../glue/susfs_glue.c || { echo "::error::cek allowlist su->sh hilang dari susfs_glue.c"; exit 1; }
          grep -qF 'f->name == f->iname' ../glue/susfs_glue.c || { echo "::error::proteksi rodata f->iname hilang dari susfs_glue.c"; exit 1; }
          cat > ../glue/fstat_append.c <<'FSTAT_APPEND_EOF'

          #ifdef CONFIG_KSU_SUSFS
          /*
           * SUSFS inline hook in vfs_fstat(): init reads init.rc through fstat() to size
           * its buffer, so the size has to include what the init.rc proxy appends.
           * Uses fdget_raw()/fdput() so O_PATH descriptors and non-shared fd tables work
           * without atomic refcount overhead.
           */
          void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr)
          {
          	struct fd f;

          	if (likely(!ksu_init_rc_hook) || unlikely(!kstat_size_ptr))
          		return;

          	if (!is_init(current_cred()))
          		return;

          	f = fdget_raw(fd);
          	if (!f.file)
          		return;

          	if (is_init_rc(f.file)) {
          		load_module_rc_once();
          		*kstat_size_ptr += ksu_rc_len + module_rc_len;
          	}

          	fdput(f);
          }
          #endif /* CONFIG_KSU_SUSFS */
          FSTAT_APPEND_EOF
          cat > ../glue/apply_glue.py <<'APPLY_GLUE_PY_EOF'
          #!/usr/bin/env python3
          '''Adapt SUSFS patch + inline hooks to KernelSU-Next (legacy).

          Run from the kernel source root, after:
            1) SUSFS kernel patch   2) susfs_inline_hook_patches.sh   3) KernelSU-Next setup.sh legacy
          Every edit is asserted: the script aborts (exit 1) on any unexpected state.
          '''
          import os, re, subprocess, sys

          KS = "KernelSU-Next/kernel"
          GLUE_DIR = os.environ.get("GLUE_DIR", ".")

          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()

          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)

          def die(msg):
              print("::error::" + msg)
              sys.exit(1)

          def sub(path, old, new, count=None, regex=False, optional=False):
              if not os.path.exists(path):
                  if optional:
                      return
                  die(f"{path}: file missing")
              s = read(path)
              n = len(re.findall(old, s)) if regex else s.count(old)
              if n == 0:
                  if optional:
                      return
                  die(f"{path}: pattern not found: {old[:70]!r}")
              if count is not None and n != count:
                  die(f"{path}: expected {count} match(es) of {old[:70]!r}, found {n}")
              s = re.sub(old, new, s) if regex else s.replace(old, new)
              write(path, s)
              print(f"  ok  {path}: {old[:60]!r} x{n}")

          def forbid(path, pat):
              if os.path.exists(path) and re.search(pat, read(path)):
                  die(f"{path}: leftover pattern {pat!r}")

          def need(path, *pats):
              if not os.path.exists(path):
                  die(f"preflight: {path} missing (KernelSU-Next legacy layout changed)")
              s = read(path)
              for p in pats:
                  if not re.search(p, s):
                      die(f"preflight: {path}: {p!r} not found (KernelSU-Next legacy changed)")

          # ---------------------------------------------------------------- preflight
          need(f"{KS}/hook/setuid_hook.h", r"int\s+ksu_handle_setresuid\(uid_t old_uid, uid_t new_uid\);")
          need(f"{KS}/hook/setuid_hook.c", r"ksu_handle_umount\(old_uid, new_uid\)")
          need(f"{KS}/policy/allowlist.h", r"bool\s+__ksu_is_allow_uid_for_current\(uid_t uid\)",
               r"ksu_uid_should_umount\(uid_t", r"is_isolated_process\(uid_t", r"is_appuid\(uid_t",
               r"WEBVIEW_ZYGOTE_UID")
          need(f"{KS}/selinux/selinux.h", r"bool\s+is_ksu_domain\(", r"bool\s+is_zygote\(",
               r"void\s+setup_selinux\(\s*const\s+char\s*\*\s*\w*\s*,\s*struct\s+cred\s*\*\s*\w*\s*\)",
               r'KERNEL_SU_DOMAIN\s+"ksu"', r"KERNEL_SU_CONTEXT")
          need(f"{KS}/include/ksu.h", r"ksu_security_secctx_to_secid", r"extern struct cred \*ksu_cred;")
          need(f"{KS}/manager/manager_identity.h", r"is_uid_manager\(uid_t uid\)")
          need(f"{KS}/feature/sucompat.h", r"extern bool ksu_su_compat_enabled;")
          need(f"{KS}/core/init.c", r"int\s+ksu_handle_execveat\(int \*fd, struct filename \*\*filename_ptr, void \*argv,")
          need(f"{KS}/runtime/ksud_integration.c",
               r"bool ksu_init_rc_hook\b", r"bool ksu_input_hook\b",
               r"void ksu_handle_sys_read\(unsigned int fd\)",
               r"static bool is_init_rc\(struct file \*fp\)",
               r"static void load_module_rc_once\(void\)",
               r"static size_t module_rc_len;", r"const size_t ksu_rc_len")
          need(f"{KS}/Kbuild", r"kernelsu-objs \+= extras\.o",
               r"ksu_handle_sys_reboot\" \$\(srctree\)/kernel/reboot\.c")
          print("  ok  preflight: KernelSU-Next legacy matches the glue")

          def need_tree(desc, pat):
              for root, _, files in os.walk(KS):
                  for fn in files:
                      if fn.endswith(".c") and re.search(pat, read(os.path.join(root, fn))):
                          return
              die(f"preflight: {desc} not found in {KS} (SUSFS v2.4.0 needs it, KernelSU-Next legacy changed)")

          need_tree("non-static definition of ksu_cred", r"(?m)^struct\s+cred\s*\*\s*ksu_cred\b")
          need_tree("non-static definition of setup_selinux()", r"(?m)^void\s+setup_selinux\s*\(")

          SUSFS_EXTERN_KNOWN = {
              "susfs_is_current_ksu_domain",           # glue (susfs_glue.c)
              "setup_selinux", "ksu_cred",             # KernelSU-Next legacy (checked above)
              "susfs_get_non_sus_mnt_id_from_mnt",     # fs/namespace.c (SUSFS patch)
              "susfs_get_non_sus_vfsmnt_from_vfsmnt",  # fs/namespace.c (SUSFS patch)
              "calculate_f_flags_wrapper",             # fs/statfs.c (SUSFS patch)
              "statfs_by_dentry_wrapper",              # fs/statfs.c (SUSFS patch)
          }
          ext = set(re.findall(r"(?m)^extern\s[^;]*?\b(\w+)\s*(?:\([^;]*\))?;", read("fs/susfs.c")))
          if ext - SUSFS_EXTERN_KNOWN:
              die("fs/susfs.c has new extern symbols the glue does not provide: " + ", ".join(sorted(ext - SUSFS_EXTERN_KNOWN)))
          print("  ok  preflight: fs/susfs.c externs are all provided (" + ", ".join(sorted(ext)) + ")")

          # Verifikasi seluruh CMD_SUSFS_* di include/linux/susfs_def.h & include/linux/susfs.h tertangani di susfs_glue.c
          glue_src = read(os.path.join(GLUE_DIR, "susfs_glue.c"))
          hdr_cmds = set()
          for hp in ("include/linux/susfs_def.h", "include/linux/susfs.h"):
              if os.path.exists(hp):
                  hdr_cmds.update(re.findall(r"#define\s+(CMD_SUSFS_[A-Z0-9_]+)\b", read(hp)))
          glue_cmds = set(re.findall(r"\bcase\s+(CMD_SUSFS_[A-Z0-9_]+)\s*:", glue_src))
          unhandled_cmds = sorted(hdr_cmds - glue_cmds)
          if unhandled_cmds:
              die("susfs_glue.c belum menangani CMD_SUSFS_* dari header SUSFS: " + ", ".join(unhandled_cmds))
          print(f"  ok  preflight: semua {len(hdr_cmds)} supercall CMD_SUSFS_* tertangani di susfs_glue.c")

          # ---------------------------------------------------------------- hook sites
          # 1) Di fs/exec.c, ksu_handle_execveat juga menangani deteksi boot awal ksud (init/app_process),
          #    sedangkan sucompat sudah dicek di dalam ksu_handle_execveat_sucompat(). Jangan memblokir
          #    ksu_handle_execveat() ketika ksu_su_compat_enabled dimatikan user.
          sub("fs/exec.c", "extern struct static_key_true ksu_su_compat_enabled;",
              "extern bool ksu_su_compat_enabled;", optional=False)
          sub("fs/exec.c", "static_branch_likely(&ksu_su_compat_enabled)",
              "(1 /* ksud + sucompat checked inside ksu_handle_execveat */)")
          forbid("fs/exec.c", r"static_key_true ksu_su_compat_enabled|&ksu_su_compat_enabled")

          for f in ("fs/open.c", "fs/stat.c"):
              sub(f, "extern struct static_key_true ksu_su_compat_enabled;",
                  "extern bool ksu_su_compat_enabled;", optional=False)
              sub(f, "static_branch_likely(&ksu_su_compat_enabled)",
                  "likely(ksu_su_compat_enabled)")
              forbid(f, r"static_key_true ksu_su_compat_enabled|&ksu_su_compat_enabled")

          for f in ("fs/read_write.c", "fs/stat.c"):
              sub(f, "extern struct static_key_true ksu_is_init_rc_hook_enabled;",
                  "extern bool ksu_init_rc_hook;")
              sub(f, "static_branch_unlikely(&ksu_is_init_rc_hook_enabled)",
                  "unlikely(ksu_init_rc_hook)")
              forbid(f, r"ksu_is_init_rc_hook_enabled")

          sub("fs/read_write.c",
              "extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd);",
              "extern void ksu_handle_sys_read(unsigned int fd);")

          sub("drivers/input/input.c",
              "extern struct static_key_true ksu_is_input_hook_enabled;",
              "extern bool ksu_input_hook;")
          sub("drivers/input/input.c", "static_branch_unlikely(&ksu_is_input_hook_enabled)",
              "unlikely(ksu_input_hook)")
          forbid("drivers/input/input.c", r"ksu_is_input_hook_enabled")

          # 2) signature mismatches -> glue functions with the struct filename / 3-uid ABI
          sub("fs/open.c", r"\bksu_handle_faccessat\b", "susfs_ksu_handle_faccessat", regex=True)
          sub("fs/stat.c", r"\bksu_handle_stat\b", "susfs_ksu_handle_stat", regex=True)
          sub("kernel/sys.c", r"\bksu_handle_setresuid\b", "susfs_ksu_handle_setresuid", regex=True)

          # Verifikasi eksplisit semua 8 titik inline hook termasuk baris spesifik di security/selinux/hooks.c
          need("fs/exec.c", r"\bksu_handle_execveat\b")
          need("fs/open.c", r"\bsusfs_ksu_handle_faccessat\b")
          need("fs/read_write.c", r"\bksu_handle_sys_read\b")
          need("fs/stat.c", r"\bsusfs_ksu_handle_stat\b", r"\bksu_handle_vfs_fstat\b")
          need("drivers/input/input.c", r"\bksu_handle_input_handle_event\b")
          need("kernel/reboot.c", r"\bksu_handle_sys_reboot\b")
          need("kernel/sys.c", r"\bsusfs_ksu_handle_setresuid\b")
          hooks_txt = read("security/selinux/hooks.c")
          added_hook_lines = [ln[1:].strip() for ln in read("../selinux_hook_added.lines").splitlines() if ln[1:].strip()]
          if not added_hook_lines:
              die("daftar baris inline hook security/selinux/hooks.c kosong")
          for hl in added_hook_lines:
              if hl not in hooks_txt:
                  die(f"security/selinux/hooks.c kehilangan baris inline hook: {hl!r}")
          print(f"  ok  security/selinux/hooks.c: {len(added_hook_lines)} baris inline hook terverifikasi utuh")

          # Cegah duplikasi pemanggilan ksu_handle_setresuid dari LSM hook jika lsm_hooks.c juga mendaftarkan task_fix_setuid
          lsm_p = f"{KS}/hook/lsm_hooks.c"
          if os.path.exists(lsm_p):
              lsm_s = read(lsm_p)
              if "LSM_HOOK_INIT(task_fix_setuid" in lsm_s and "CONFIG_KSU_MANUAL_HOOK" not in lsm_s:
                  sub(lsm_p,
                      r"(?m)^(\s*LSM_HOOK_INIT\(task_fix_setuid,\s*\w+\),\s*)$",
                      r"#ifndef CONFIG_KSU_MANUAL_HOOK\n\1\n#endif",
                      regex=True)
                  print("  ok  lsm_hooks.c: guarded task_fix_setuid with #ifndef CONFIG_KSU_MANUAL_HOOK")

          # ---------------------------------------------------------------- KernelSU-Next
          # 3) SUSFS supercalls through reboot()
          sc = f"{KS}/supercall/supercall.c"
          sub(sc,
              "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n\t\t\t  void __user **arg)\n{\n",
              "#ifdef CONFIG_KSU_SUSFS\nextern bool susfs_ksu_handle_reboot(int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n"
              "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n\t\t\t  void __user **arg)\n{\n",
              count=1)
          sub(sc,
              "\tif (magic1 != KSU_INSTALL_MAGIC1)\n\t\treturn 0;\n",
              "\tif (magic1 != KSU_INSTALL_MAGIC1)\n\t\treturn 0;\n\n"
              "#ifdef CONFIG_KSU_SUSFS\n\tif (susfs_ksu_handle_reboot(magic2, cmd, arg))\n\t\treturn 0;\n#endif\n",
              count=1)

          # 4) susfs_init() at KernelSU init (after ksu_cred exists)
          sub(f"{KS}/core/init.c", "\tksu_feature_init();\n",
              "\tksu_feature_init();\n\n#ifdef CONFIG_KSU_SUSFS\n\tsusfs_init();\n#endif\n", count=1)
          sub(f"{KS}/core/init.c", "extern void __init ksu_lsm_hook_init(void);\n",
              "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n\nextern void __init ksu_lsm_hook_init(void);\n", count=1)

          # 5) post-fs-data: resolve SIDs + start the sdcard monitor + parse priority app strings
          be = f"{KS}/runtime/boot_event.c"
          sub(be, "extern void ksu_avc_spoof_late_init();\n",
              "extern void ksu_avc_spoof_late_init();\n#ifdef CONFIG_KSU_SUSFS\nextern void susfs_ksu_post_fs_data(void);\n#endif\n",
              count=1)
          sub(be, "\tksu_selinux_hide_handle_post_fs_data();\n}",
              "\tksu_selinux_hide_handle_post_fs_data();\n#ifdef CONFIG_KSU_SUSFS\n\tsusfs_ksu_post_fs_data();\n#endif\n}",
              count=1)

          # 6) keep the priority uid filter in sync with installed packages
          tt = f"{KS}/manager/throne_tracker.c"
          sub(tt, "void track_throne(bool prune_only)\n{\n",
              "#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\nextern void susfs_parse_priority_app_strings(void);\n#endif\n\n"
              "void track_throne(bool prune_only)\n{\n#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n\tsusfs_parse_priority_app_strings();\n#endif\n",
              count=1)

          # 7) build glue + fstat helper + pastikan KSU_RUNNER_CFLAGS di Kbuild punya target aarch64
          kb = f"{KS}/Kbuild"
          sub(kb, "kernelsu-objs += extras.o\n", "kernelsu-objs += extras.o\nkernelsu-objs += susfs_glue.o\n", count=1)
          if "KSU_RUNNER_CFLAGS :=" in read(kb) and "--target=aarch64-linux-gnu" not in read(kb):
              sub(kb, "KSU_RUNNER_CFLAGS := $(CLANG_FLAGS)",
                  "KSU_RUNNER_CFLAGS := --target=aarch64-linux-gnu $(CLANG_FLAGS)", count=1)
          write(f"{KS}/susfs_glue.c", read(os.path.join(GLUE_DIR, "susfs_glue.c")))
          ki = f"{KS}/runtime/ksud_integration.c"
          if "ksu_handle_vfs_fstat" in read(ki):
              die("ksud_integration.c already has ksu_handle_vfs_fstat (glue already applied?)")
          write(ki, read(ki).rstrip("\n") + "\n" + read(os.path.join(GLUE_DIR, "fstat_append.c")))

          print("glue applied")
          APPLY_GLUE_PY_EOF
          GLUE_DIR="$GITHUB_WORKSPACE/glue" python3 ../glue/apply_glue.py

      - name: NoMount (dev) & Audit VFS pasca-NoMount
        working-directory: lk
        env:
          NM_BRANCH: ${{ github.event.inputs.nomount_branch || 'dev' }}
        run: |
          set -euo pipefail
          [[ "$NM_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::nama branch NoMount tidak valid"; exit 1; }
          VFS_SNAP_BEFORE="$(sha256sum fs/namespace.c fs/stat.c fs/open.c fs/exec.c fs/namei.c fs/readdir.c)"
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/$NM_BRANCH/kernel/setup.sh" | bash -s "$NM_BRANCH"
          test -d fs/nomount && test -f fs/nomount/Kconfig
          grep -q nomount fs/Makefile && grep -q nomount fs/Kconfig
          # hunk VFS NoMount yang gagal diterapkan (mis. karena perubahan patch SUSFS) tidak boleh lolos diam-diam
          REJ="$(find . -name '*.rej' -not -path './.git/*')"
          if [ -n "$REJ" ]; then echo "::error::hunk NoMount ditolak:"; echo "$REJ"; for r in $REJ; do echo "=== $r"; cat "$r"; done; exit 1; fi
          VFS_SNAP_AFTER="$(sha256sum fs/namespace.c fs/stat.c fs/open.c fs/exec.c fs/namei.c fs/readdir.c)"
          if [ "$VFS_SNAP_BEFORE" != "$VFS_SNAP_AFTER" ]; then
            echo "NoMount memodifikasi file VFS bersama; menjalankan audit urutan & keseimbangan blok preprocessor..."
          else
            echo "NoMount terintegrasi bersih via fs/nomount (tidak mengubah fs/namespace.c, fs/stat.c, fs/open.c, fs/exec.c)"
          fi
          # Verifikasi bahwa simbol/label penting SUSFS, keseimbangan #ifdef/#endif, dan urutan label tetap valid
          python3 - <<'VERIFY_VFS_PY'
          import re, sys
          checks = {
              "fs/namespace.c": ["susfs_alloc_non_unshare_ksu_vfsmnt", "bypass_orig_flow:"],
              "fs/stat.c": ["susfs_ksu_handle_stat", "ksu_handle_vfs_fstat"],
              "fs/open.c": ["susfs_ksu_handle_faccessat"],
              "fs/exec.c": ["ksu_handle_execveat"],
          }
          for path, markers in checks.items():
              txt = open(path, encoding="utf-8").read()
              for m in markers:
                  if m not in txt:
                      print(f"::error::pasca-NoMount: marker {m!r} hilang dari {path}")
                      sys.exit(1)
              n_if = len(re.findall(r"(?m)^\s*#\s*(?:if|ifdef|ifndef)\b", txt))
              n_end = len(re.findall(r"(?m)^\s*#\s*endif\b", txt))
              if n_if != n_end:
                  print(f"::error::pasca-NoMount: direktif #if/#endif tidak seimbang di {path} ({n_if} vs {n_end})")
                  sys.exit(1)
          print("Verifikasi koeksistensi VFS SUSFS + NoMount: OK")
          VERIFY_VFS_PY
          # versi driver = jumlah commit repo NoMount (dibaca Makefile-nya lewat git), jadi klon harus lengkap
          cd NoMount
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch -q --unshallow --tags --force origin; fi
          [ "$(git rev-parse --abbrev-ref HEAD)" = "$NM_BRANCH" ] || { echo "::error::NoMount tidak berada di branch $NM_BRANCH"; exit 1; }
          NM_COUNT="$(git rev-list --count HEAD)"
          echo "NM_COUNT=$NM_COUNT" >> "$GITHUB_ENV"
          echo "NoMount $NM_BRANCH @ $(git log -1 --format='%h %cd')  ->  2.2.0-dev-$NM_COUNT (protokol driver 22)"
          if [ "$NM_BRANCH" = dev ] && [ "$NM_COUNT" -lt "$NOMOUNT_MIN_COMMITS" ]; then
            echo "::error::NoMount dev baru $NM_COUNT commit, diharapkan >= $NOMOUNT_MIN_COMMITS"; exit 1;
          fi

      - name: Backport path_umount, seccomp, & SELinux sebelum build paralel (Cegah Race Condition Kbuild)
        working-directory: lk
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, subprocess, sys
          from pathlib import Path

          def die(m):
              print("::error::" + m)
              sys.exit(1)

          # 1. Backport can_umount & path_umount ke fs/namespace.c dan fs/internal.h
          ns, ih = Path("fs/namespace.c"), Path("fs/internal.h")
          if not ns.is_file() or not ih.is_file():
              die("fs/namespace.c atau fs/internal.h tidak ditemukan")
          src = ns.read_text(encoding="utf-8")

          def pat(n):
              return rf"(?m)^[ \t]*(?:static[ \t]+)?int[ \t]+{n}[ \t]*\([^;{{}}]*\)[ \t\r\n]*\{{"

          has_can = re.search(pat("can_umount"), src) is not None
          has_path = re.search(pat("path_umount"), src) is not None
          blocks = []
          if not has_can:
              blocks.append(r'''static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }''')
          if not has_path:
              blocks.append(r'''int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	/* Do not use path_put(): it would clear mnt_expiry_mark. */
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }''')

          if blocks:
              anchor = None
              if not has_can and has_path:
                  anchor = re.search(r"(?m)^int[ \t]+path_umount\s*\(", src)
              else:
                  for a in (r"(?m)^static bool is_mnt_ns_file\s*\(", r"(?m)^SYSCALL_DEFINE2\(umount,"):
                      anchor = re.search(a, src)
                      if anchor:
                          break
              if anchor is None:
                  die("anchor di fs/namespace.c tidak ditemukan")
              if "static int do_umount(" not in src or src.index("static int do_umount(") > anchor.start():
                  die("do_umount tidak ada sebelum titik sisip")
              src = src[:anchor.start()] + "\n".join(["\n".join(blocks), "", ""]) + src[anchor.start():]
              ns.write_text(src, encoding="utf-8")
              print("[+] path_umount ditambahkan ke fs/namespace.c")

          for n in ("can_umount", "path_umount"):
              c = len(re.findall(pat(n), ns.read_text(encoding="utf-8")))
              if c != 1:
                  die(f"definisi {n} harus tepat satu, ditemukan {c}")

          h = ih.read_text(encoding="utf-8")
          proto = r"(?m)^int[ \t]+path_umount\s*\(struct path \*path, int flags\);\s*$"
          if not re.search(proto, h):
              m = re.search(r"(?m)^extern void __init mnt_init\(void\);\s*$", h)
              if m:
                  ih.write_text(h[:m.end()] + "\nint path_umount(struct path *path, int flags);" + h[m.end():], encoding="utf-8")
              else:
                  ih.write_text(h.rstrip() + "\nint path_umount(struct path *path, int flags);\n", encoding="utf-8")
          if not re.search(proto, ih.read_text(encoding="utf-8")):
              die("prototype path_umount gagal ditambahkan ke fs/internal.h")
          print("[OK] path_umount siap")

          # 2. Pre-apply backport seccomp.h & SELinux yang ada di Kbuild agar sed -i TIDAK berjalan di tengah make -j$(nproc)
          seccomp_h = Path("include/linux/seccomp.h")
          if "atomic_t filter_count;" not in seccomp_h.read_text(encoding="utf-8"):
              subprocess.run([
                  "sed", "-i",
                  "-e", "/int mode;/a\\\tatomic_t filter_count;",
                  "-e", "/#include <linux\\/thread_info.h>/a\\#include <linux/atomic.h>",
                  str(seccomp_h)
              ], check=True)
              print("[+] seccomp.h: filter_count ditambahkan sebelum kompilasi")
          if "atomic_t filter_count;" not in seccomp_h.read_text(encoding="utf-8"):
              die("seccomp.h: atomic_t filter_count tidak ditemukan setelah backport")

          hooks_c = Path("security/selinux/hooks.c")
          if "selinux_inode(inode)" not in hooks_c.read_text(encoding="utf-8"):
              subprocess.run([
                  "sed", "-i",
                  "-e", "s/struct inode_security_struct \\*isec = inode->i_security/struct inode_security_struct *isec = selinux_inode(inode)/g",
                  "-e", "s/return inode->i_security/return selinux_inode(inode)/g",
                  "-e", "s/\\bisec = inode->i_security;/isec = selinux_inode(inode);/",
                  str(hooks_c)
              ], check=True)
              print("[+] security/selinux/hooks.c: selinux_inode ditambahkan")

          if not re.search(r"selinux_cred\(.*\)", hooks_c.read_text(encoding="utf-8")):
              subprocess.run([
                  "sed", "-i",
                  "-e", "s/tsec = cred->security;/tsec = selinux_cred(cred);/g",
                  "-e", "s/const struct task_security_struct \\*tsec = cred->security;/const struct task_security_struct *tsec = selinux_cred(cred);/g",
                  "-e", "s/const struct task_security_struct \\*tsec = current_security();/const struct task_security_struct *tsec = selinux_cred(current_cred());/g",
                  "-e", "s/old_tsec = current_security();/old_tsec = selinux_cred(current_cred());/g",
                  "-e", "s/new_tsec = bprm->cred->security;/new_tsec = selinux_cred(bprm->cred);/g",
                  "-e", "s/tsec = new->security;/tsec = selinux_cred(new);/g",
                  "-e", "s/tsec = new_creds->security;/tsec = selinux_cred(new_creds);/g",
                  "-e", "s/old_tsec = old->security;/old_tsec = selinux_cred(old);/g",
                  "-e", "s/const struct task_security_struct \\*old_tsec = old->security;/const struct task_security_struct *old_tsec = selinux_cred(old);/g",
                  "-e", "s/struct task_security_struct \\*tsec = new->security;/struct task_security_struct *tsec = selinux_cred(new);/g",
                  "-e", "s/__tsec = current_security();/__tsec = selinux_cred(current_cred());/",
                  "-e", "s/__tsec = __task_cred(p)->security;/__tsec = selinux_cred(__task_cred(p));/",
                  "-e", "s/current_security()/selinux_cred(current_cred())/g",
                  "-e", "s/old->security/selinux_cred(old)/g",
                  str(hooks_c)
              ], check=True)
              print("[+] security/selinux/hooks.c: selinux_cred ditambahkan")

          sfs_c = Path("security/selinux/selinuxfs.c")
          if "selinux_inode(inode)" not in sfs_c.read_text(encoding="utf-8"):
              subprocess.run([
                  "sed", "-i",
                  "s/(struct inode_security_struct \\*)inode->i_security/selinux_inode(inode)/g",
                  str(sfs_c)
              ], check=True)
              print("[+] security/selinux/selinuxfs.c: selinux_inode ditambahkan")

          xfrm_c = Path("security/selinux/xfrm.c")
          if "selinux_cred" not in xfrm_c.read_text(encoding="utf-8"):
              subprocess.run([
                  "sed", "-i",
                  "s/const struct task_security_struct \\*tsec = current_security();/const struct task_security_struct *tsec = selinux_cred(current_cred());/g",
                  str(xfrm_c)
              ], check=True)
              print("[+] security/selinux/xfrm.c: selinux_cred ditambahkan")

          objsec_h = Path("security/selinux/include/objsec.h")
          objsec_txt = objsec_h.read_text(encoding="utf-8")
          if "selinux_inode" not in objsec_txt:
              helper_inode = (
                  "static inline struct inode_security_struct *selinux_inode(\n"
                  "\t\t\t\t\t\tconst struct inode *inode)\n"
                  "{\n"
                  "\treturn inode->i_security;\n"
                  "}\n\n"
              )
              m_end = list(re.finditer(r"(?m)^#endif\b.*$", objsec_txt))
              if not m_end:
                  die("objsec.h tidak memiliki #endif penutup")
              pos = m_end[-1].start()
              objsec_txt = objsec_txt[:pos] + helper_inode + objsec_txt[pos:]
              objsec_h.write_text(objsec_txt, encoding="utf-8")
              print("[+] security/selinux/include/objsec.h: selinux_inode ditambahkan")

          objsec_txt = objsec_h.read_text(encoding="utf-8")
          if not re.search(r"task_security_struct\s+\*selinux_cred", objsec_txt):
              helper_cred = (
                  "static inline struct task_security_struct *selinux_cred(const struct cred *cred)\n"
                  "{\n"
                  "\treturn cred->security;\n"
                  "}\n\n"
              )
              m_end = list(re.finditer(r"(?m)^#endif\b.*$", objsec_txt))
              if not m_end:
                  die("objsec.h tidak memiliki #endif penutup")
              pos = m_end[-1].start()
              objsec_txt = objsec_txt[:pos] + helper_cred + objsec_txt[pos:]
              objsec_h.write_text(objsec_txt, encoding="utf-8")
              print("[+] security/selinux/include/objsec.h: selinux_cred ditambahkan")

          # Verifikasi semua target backport SELinux & seccomp benar-benar ada
          if "selinux_inode" not in objsec_h.read_text(encoding="utf-8") or not re.search(r"task_security_struct\s+\*selinux_cred", objsec_h.read_text(encoding="utf-8")):
              die("objsec.h: selinux_inode atau selinux_cred gagal diverifikasi")

          # Pastikan seluruh baris inline hook di security/selinux/hooks.c tetap utuh setelah backport SELinux
          hooks_after = hooks_c.read_text(encoding="utf-8")
          for ln in Path("../selinux_hook_added.lines").read_text(encoding="utf-8").splitlines():
              hl = ln[1:].strip()
              if hl and hl not in hooks_after:
                  die(f"baris inline hook hilang dari security/selinux/hooks.c setelah backport SELinux: {hl!r}")

          # 3. Nonaktifkan seluruh perintah $(shell sed -i ...) di dalam KernelSU-Next/kernel/Kbuild
          #    agar Kbuild dijamin 100% read-only terhadap source tree kernel saat make -j$(nproc)
          kb_path = Path("KernelSU-Next/kernel/Kbuild")
          kb_txt = kb_path.read_text(encoding="utf-8")
          n_sed = kb_txt.count("$(shell sed -i")
          if n_sed > 0:
              kb_txt = kb_txt.replace("$(shell sed -i", "$(shell :")
              kb_path.write_text(kb_txt, encoding="utf-8")
              print(f"[+] KernelSU-Next/kernel/Kbuild: {n_sed} perintah '$(shell sed -i ...)' dinonaktifkan (read-only safe)")
          if "sed -i" in kb_path.read_text(encoding="utf-8"):
              die("KernelSU-Next/kernel/Kbuild masih mengandung perintah 'sed -i'")
          PYEOF
          grep -n "path_umount" fs/namespace.c | head

      - name: Makefile 4.19 - dukungan LLVM_IAS=1
        working-directory: lk
        run: |
          set -euo pipefail
          echo "---- baris terkait di Makefile (sebelum) ----"
          grep -nE 'LLVM|no-integrated-as|unknown-warning-option' Makefile || true
          if grep -q 'LLVM_IAS' Makefile; then
            echo "Makefile sudah mengenal LLVM_IAS, tidak diubah"
          elif grep -q 'no-integrated-as' Makefile; then
            python3 - <<'PYEOF'
          import re, sys
          p = "Makefile"
          s = open(p, encoding="utf-8").read()
          pat = re.compile(r"(?m)^CLANG_FLAGS[ \t]*\+=[ \t]*-no-integrated-as[ \t]*$")
          n = len(pat.findall(s))
          if n != 1:
              print(f"::error::Makefile: baris 'CLANG_FLAGS += -no-integrated-as' ditemukan {n}x (butuh 1x); patch manual diperlukan")
              sys.exit(1)
          s = pat.sub("ifneq ($(LLVM_IAS),1)\nCLANG_FLAGS += -no-integrated-as\nendif", s)
          open(p, "w", encoding="utf-8").write(s)
          print("[+] Makefile: -no-integrated-as hanya aktif kalau LLVM_IAS != 1")
          PYEOF
          else
            echo "Makefile tidak memaksa -no-integrated-as; IAS bawaan clang dipakai"
          fi
          echo "---- (sesudah) ----"
          grep -nE 'LLVM|no-integrated-as' Makefile || true
          echo "---- no-integrated-as di tempat lain ----"
          grep -rn 'no-integrated-as' arch/arm64 scripts --include='Makefile*' --include='*.include' 2>/dev/null | head -n 20 || true

      - name: Konfigurasi kernel
        working-directory: lk
        run: |
          set -euo pipefail
          M="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "M=$M" >> "$GITHUB_ENV"
          make $M "$DEFCONFIG"
          # --- Kumpulkan seluruh simbol CONFIG_KSU_SUSFS* dari fs/Kconfig.susfs secara dinamis ---
          SUSFS_SYMS="$(awk '/^config KSU_SUSFS/{print $2}' fs/Kconfig.susfs | tr '\n' ' ')"
          SUSFS_ARGS=""; for s in $SUSFS_SYMS; do SUSFS_ARGS="$SUSFS_ARGS -e $s"; done
          # --- preinit KernelSU-Next: simbol Kconfig dicari di source yang dipakai (tidak ditebak) ---
          PRE_SYMS="$(grep -RhoE '^[[:space:]]*config[[:space:]]+[A-Z0-9_]*PREINIT[A-Z0-9_]*' KernelSU-Next/kernel --include='Kconfig*' | awk '{print $2}' | sort -u | tr '\n' ' ' || true)"
          PRE_CODE="$(grep -RIli 'preinit' KernelSU-Next/kernel 2>/dev/null | head -n 8 || true)"
          echo "preinit - simbol Kconfig : ${PRE_SYMS:-(tidak ada)}"
          echo "preinit - file source    : ${PRE_CODE:-(tidak ada)}"
          PRE_ARGS=""; for s in $PRE_SYMS; do PRE_ARGS="$PRE_ARGS -e $s"; done
          S=scripts/config
          $S --file out/.config --set-str LOCALVERSION "$LOCALVERSION_TAG" -d LOCALVERSION_AUTO \
             -e KSU -e KSU_MANUAL_HOOK -d KSU_DEBUG -e NOMOUNT \
             -e TMPFS_XATTR -e TMPFS_POSIX_ACL $SUSFS_ARGS $PRE_ARGS
          make $M olddefconfig
          echo "---- konfigurasi yang sensitif ke toolchain ----"
          grep -E '^CONFIG_(LTO|CFI|SHADOW_CALL_STACK|KASAN|UBSAN|GCOV|FRAME_WARN|CC_OPTIMIZE|STACKPROTECTOR|ARM64_PTR_AUTH|ARM64_BTI|COMPAT_VDSO)[A-Z_0-9]*=' out/.config || true
          fail=0
          for c in KSU KSU_MANUAL_HOOK NOMOUNT $SUSFS_SYMS; do
            grep -q "^CONFIG_$c=y" out/.config && echo "ok   CONFIG_$c=y" || { echo "::error::CONFIG_$c tidak aktif"; fail=1; }
          done
          grep -q '^CONFIG_LOCALVERSION="-LunarKnight"' out/.config || { echo "::error::LOCALVERSION salah"; fail=1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config || { echo "::error::LOCALVERSION_AUTO aktif"; fail=1; }
          # --- preinit: wajib aktif kalau source punya simbolnya ---
          for s in $PRE_SYMS; do
            grep -q "^CONFIG_$s=y" out/.config && echo "ok   CONFIG_$s=y (preinit)" || { echo "::error::CONFIG_$s (preinit) tidak aktif"; fail=1; }
          done
          if [ -z "$PRE_SYMS" ] && [ -z "$PRE_CODE" ]; then
            echo "::warning::source KernelSU-Next ini tidak punya kode preinit sama sekali, jadi tidak ada yang bisa diaktifkan"
          elif [ -z "$PRE_SYMS" ]; then
            echo "::notice::preinit ada di source tetapi tanpa simbol Kconfig (aktif otomatis lewat Kbuild bila out/usr/include/linux/unistd.h tersedia)"
          fi
          # --- P2: siapkan out/usr/include (header uapi) bila preinit ada ---
          if [ -n "$PRE_SYMS" ] || [ -n "$PRE_CODE" ]; then
            make $M headers_install
            test -f out/usr/include/linux/types.h || { echo "::error::headers_install tidak menghasilkan out/usr/include"; fail=1; }
            test -f out/usr/include/linux/unistd.h || { echo "::error::out/usr/include/linux/unistd.h tidak ditemukan untuk preinit"; fail=1; }
            echo "HAS_PREINIT=1" >> "$GITHUB_ENV"
            echo "out/usr/include siap: $(find out/usr/include -name '*.h' 2>/dev/null | wc -l) header"
          else
            echo "HAS_PREINIT=0" >> "$GITHUB_ENV"
          fi
          grep -q '^CONFIG_KSU_KPROBES_HOOK=y\|^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' out/.config && { echo "::error::hook dinamis aktif"; fail=1; } || true
          [ "$fail" = 0 ]

      - name: Build kernel
        working-directory: lk
        run: |
          set -o pipefail
          # Kirim KSU_VERSION_OVERRIDE dan KSU_VERSION_TAG_OVERRIDE secara eksplisit sebagai argumen make
          # sekaligus environment agar tidak tertimpa meskipun Kbuild menggunakan operator :=
          export KSU_VERSION_OVERRIDE="$KSU_VERSION_OVERRIDE"
          export KSU_VERSION_TAG_OVERRIDE="$KSU_VERSION_TAG_OVERRIDE"
          # -k: kalau ada error, build lanjut ke target lain supaya SEMUA error terkumpul dalam satu run
          make $M KSU_VERSION_OVERRIDE="$KSU_VERSION_OVERRIDE" KSU_VERSION_TAG_OVERRIDE="$KSU_VERSION_TAG_OVERRIDE" \
            -k -j"$(nproc)" Image.gz-dtb 2>&1 | tee ../build.log
          # versi + tag harus sama dengan override yang dibaca dari Kbuild source KSU-Next (log build atau flag compile)
          ver_ok=0; tag_ok=0
          grep -Eq "KernelSU-Next version[^0-9]*${KSU_VERSION_OVERRIDE}([^0-9]|$)" ../build.log && ver_ok=1 || true
          grep -qF "KernelSU-Next tag: $KSU_VERSION_TAG_OVERRIDE" ../build.log && tag_ok=1 || true
          if [ "$ver_ok" = 0 ]; then grep -rqE -- "-DKSU_VERSION=${KSU_VERSION_OVERRIDE}([^0-9]|$)" out/drivers/kernelsu --include='*.cmd' && ver_ok=1 || true; fi
          if [ "$tag_ok" = 0 ]; then grep -rqF -- "$KSU_VERSION_TAG_OVERRIDE" out/drivers/kernelsu --include='*.cmd' && tag_ok=1 || true; fi
          [ "$ver_ok" = 1 ] || { echo "::error::versi KSU di build tidak sama dengan override dari Kbuild ($KSU_VERSION_OVERRIDE)"; grep -n 'KernelSU-Next' ../build.log | head -n 20; exit 1; }
          [ "$tag_ok" = 1 ] || { echo "::error::tag KSU di build tidak sama dengan override dari Kbuild ($KSU_VERSION_TAG_OVERRIDE)"; grep -n 'KernelSU-Next' ../build.log | head -n 20; exit 1; }
          echo "override KSU terpakai: $KSU_VERSION_OVERRIDE / $KSU_VERSION_TAG_OVERRIDE"

      - name: Ringkasan error dan warning
        if: always()
        run: |
          [ -f build.log ] || { echo "build.log belum ada (gagal sebelum tahap build)"; exit 0; }
          ERR="$(grep -E ' error: |ld\.lld: error|fatal error:|undefined (symbol|reference)|\*\*\* \[' build.log | sort -u | head -n 200 || true)"
          if [ -n "$ERR" ]; then
            echo "::group::ERROR unik (maks 200 baris)"; echo "$ERR"; echo "::endgroup::"
            { echo "### Error build"; echo '```'; echo "$ERR"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tidak ada baris error di build.log"
          fi
          echo "::group::10 kategori warning terbanyak (tidak disembunyikan)"
          grep -oE '\[-W[a-zA-Z0-9+-]+\]' build.log | sort | uniq -c | sort -rn | head -n 10 || true
          echo "::endgroup::"

      - name: Verifikasi hasil build
        working-directory: lk
        run: |
          set -euo pipefail
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $REL"
          [ "$REL" = "$EXPECT_RELEASE" ] || { echo "::error::nama kernel salah: $REL"; exit 1; }
          test -s out/arch/arm64/boot/Image.gz-dtb
          # --- Verifikasi ketat preinit runner.elf (wajib ada & berformat ELF AArch64 bila preinit aktif) ---
          if [ "${HAS_PREINIT:-0}" = "1" ] && [ -d KernelSU-Next/kernel/preinit ]; then
            RUNNER_ELF="$(find out -name 'runner.elf' 2>/dev/null | head -n 1 || true)"
            [ -n "$RUNNER_ELF" ] && [ -s "$RUNNER_ELF" ] \
              || { echo "::error::preinit runner.elf tidak ditemukan atau kosong di out/"; exit 1; }
            llvm-readelf -h "$RUNNER_ELF" | grep -q 'AArch64' \
              || { echo "::error::$RUNNER_ELF bukan binary ELF AArch64"; llvm-readelf -h "$RUNNER_ELF"; exit 1; }
            echo "preinit runner.elf terverifikasi ($RUNNER_ELF): ELF AArch64"
          fi
          # --- toolchain di hasil build: harus "Android (...) clang version 20.0.0 ..., LLD 20.0.0" ---
          re() { printf '%s' "$1" | sed 's/\./\\./g'; }
          CV="$(re "$EXPECT_CLANG_VER")"; LV="$(re "$EXPECT_LLD_VER")"
          RX="Android \(.*\) clang version ${CV}.*, (Android \(.*\) )?LLD ${LV}"
          CC_LINE="$(grep -m1 'define LINUX_COMPILER' out/include/generated/compile.h || true)"
          echo "compile.h : $CC_LINE"
          echo "$CC_LINE" | grep -Eq "$RX" \
            || { echo "::error::LINUX_COMPILER di compile.h tidak sesuai (harus clang $EXPECT_CLANG_VER, LLD $EXPECT_LLD_VER)"; exit 1; }
          BANNER="$(grep -aEo 'Linux version 4\.19[[:print:]]*' out/arch/arm64/boot/Image | head -n 1 || true)"
          echo "banner    : $BANNER"
          echo "$BANNER" | grep -Eq "$RX" \
            || { echo "::error::string versi compiler di Image tidak sesuai (harus clang $EXPECT_CLANG_VER, LLD $EXPECT_LLD_VER)"; exit 1; }
          if command -v llvm-readelf >/dev/null 2>&1; then echo ".comment vmlinux:"; llvm-readelf -p .comment out/vmlinux | head -n 10 || true; fi
          llvm-nm out/vmlinux > "$RUNNER_TEMP/syms.txt"
          for s in susfs_add_sus_path susfs_ksu_handle_reboot susfs_ksu_handle_setresuid susfs_init path_umount ksu_handle_sys_reboot \
                   susfs_set_priority_uid_filter susfs_is_priority_uid_filtered susfs_parse_priority_app_strings \
                   susfs_set_avc_log_spoofing susfs_start_sdcard_monitor_fn susfs_ksu_post_fs_data; do
            grep -qw "$s" "$RUNNER_TEMP/syms.txt" || { echo "::error::simbol $s tidak ada di vmlinux"; exit 1; }
          done
          strings -a -n 3 out/vmlinux > "$RUNNER_TEMP/vm.str"
          grep -aqF "version: $SUSFS_VER" "$RUNNER_TEMP/vm.str" && echo "versi SUSFS di vmlinux: $SUSFS_VER (ok)" \
            || echo "::warning::string versi SUSFS $SUSFS_VER tidak terdeteksi di vmlinux (versi sudah diverifikasi dari patch)"
          echo "versi KSU di vmlinux:"; grep -xF "$KSU_VERSION_TAG_OVERRIDE" "$RUNNER_TEMP/vm.str" | head -3 \
            || echo "::warning::string $KSU_VERSION_TAG_OVERRIDE tidak terdeteksi terpisah di vmlinux (override sudah diverifikasi dari build.log)"
          LEG="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+.*legacy' "$RUNNER_TEMP/vm.str" | grep -vxF "$KSU_VERSION_TAG_OVERRIDE" || true)"
          if [ -n "$LEG" ]; then echo "::error::tulisan legacy di luar override Kbuild masih ada di vmlinux:"; echo "$LEG" | head; exit 1; fi
          if [ "${SUSFS_VARIANT_LABEL:-GKI}" = "GKI" ]; then
            if grep -qx 'NON-GKI' "$RUNNER_TEMP/vm.str"; then echo "::error::NON-GKI masih ada di vmlinux"; exit 1; fi
            grep -qx 'GKI' "$RUNNER_TEMP/vm.str" && echo "varian SUSFS: GKI (ok)" || echo "::warning::string GKI tidak terdeteksi terpisah (header sudah diverifikasi saat patch)"
          fi
          test -f out/fs/nomount/nomount.o || { echo "::error::fs/nomount tidak ikut terkompilasi"; exit 1; }
          if ! strings -a out/fs/nomount/nomount.o | grep -qxF "22 ($NM_COUNT)"; then
            echo "::error::versi NoMount di objek tidak sama dengan 22 ($NM_COUNT)"; strings -a out/fs/nomount/nomount.o | grep -E '^22( |$)' | head; exit 1
          fi
          echo "NoMount di kernel: 22 ($NM_COUNT) = 2.2.0-dev-$NM_COUNT"
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Paket AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE ak3/patch ak3/ramdisk ak3/modules
          cp lk/out/arch/arm64/boot/Image.gz-dtb ak3/
          cat > ak3/anykernel.sh <<'ANYKERNEL_EOF'
          #!/sbin/sh
          # AnyKernel3 - LunarKnight / Xiaomi Redmi Note 5 Pro (whyred)
          properties() { '
          kernel.string=4.19.325-st20-LunarKnight by Shirakumo@Github
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # whyred: non A/B, Image.gz-dtb (DTB attached), boot partition
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "4.19.325-st20-LunarKnight (whyred)";
          ui_print "KernelSU-Next legacy + SUSFS @SUSFS_VER@ + NoMount dev @NM_COUNT@";
          ui_print "by Shirakumo@Github";

          split_boot;
          flash_boot;
          ANYKERNEL_EOF
          sed -i "s/@SUSFS_VER@/$SUSFS_VER/; s/@NM_COUNT@/2.2.0-dev-$NM_COUNT/" ak3/anykernel.sh
          cd ak3
          ZIP="LunarKnight-whyred-4.19.325-st20-KSUN-SUSFS-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP" . -x '*.git*'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unggah zip
        uses: actions/upload-artifact@v6
        with:
          name: LunarKnight-whyred
          path: ${{ env.ZIP }}

      - name: Unggah log dan config
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          include-hidden-files: true
          path: |
            build.log
            hook.log
            patch.log
