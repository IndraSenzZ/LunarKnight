name: Build LunarKnight whyred 4.19 (KSU manipvlator + SUSFS v2.4.0 + NoMount dev)

# Taruh file ini di .github/workflows/build-kernel.yml
# Di root repo harus ada:
#   susfs_patch_to_4.19.patch      (isi: SUSFS v2.4.0; nama susfs_patch_to_4_19.patch juga diterima)
# Opsional di root repo:
#   susfs_inline_hook_patches.sh   (script hook JackA1ltman; kalau tidak ada, diambil dari mainline-nya)
#
# Alur: kernel -> KernelSU manipvlator (metode syscall, tanpa manual hook fs/exec dkk) -> patch SUSFS 4.19
#       -> PREFLIGHT kontrak driver<->SUSFS -> hook JackA1ltman (hanya yang tidak bentrok) -> NoMount -> build.
# Kalau preflight gagal, build berhenti sebelum kompilasi dan artifact "build-logs" (preflight.log)
# berisi semua baris "susfs" di driver, jadi penyebabnya langsung kelihatan.

on:
  workflow_dispatch:
    inputs:
      hook_mode:
        description: "Metode hook manipvlator: branch_link (disarankan author untuk 4.19+ arm64) atau tamper (syscall table)"
        required: false
        default: "branch_link"
        type: choice
        options:
          - branch_link
          - tamper
      ksu_ref:
        description: "Branch/commit KernelSU manipvlator"
        required: false
        default: "main"
      nomount_branch:
        description: "Branch NoMount untuk integrasi kernel (dev = 2.2.0-dev-<jumlah commit>)"
        required: false
        default: "dev"
      jack_latest:
        description: "Ambil susfs_inline_hook_patches.sh terbaru dari JackA1ltman mainline (abaikan file di repo)"
        required: false
        default: false
        type: boolean

env:
  KERNEL_REPO: https://github.com/IndraSenzZ/LunarKnight.git
  KERNEL_BRANCH: back
  DEFCONFIG: vendor/whyred-perf_defconfig
  LOCALVERSION_TAG: "-LunarKnight"
  EXPECT_RELEASE: "4.19.325-st20-LunarKnight"
  KBUILD_BUILD_USER: Shirakumo
  KBUILD_BUILD_HOST: Github
  NOMOUNT_MIN_COMMITS: "680"
  # versi SUSFS yang wajib ada di patch (build berhenti kalau patch di repo bukan versi ini)
  SUSFS_EXPECT_VER: "v2.4.0"
  JACK_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
  JACK_BRANCH: mainline
  HOOK_MODE: ${{ github.event.inputs.hook_mode || 'branch_link' }}
  KSU_REF: ${{ github.event.inputs.ksu_ref || 'main' }}
  JACK_LATEST: ${{ github.event.inputs.jack_latest || 'false' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo (file patch ada di sini)
        uses: actions/checkout@v6

      - name: Cek file masukan
        run: |
          echo "branch workflow: $GITHUB_REF_NAME"
          echo "file susfs di root checkout:"; ls -la | grep -i susfs || echo "(tidak ada)"
          P="$(ls susfs_patch_to_4.19.patch* susfs_patch_to_4_19.patch* 2>/dev/null | head -n1)"
          [ -n "$P" ] || { echo "::error::susfs_patch_to_4.19.patch tidak ada di branch '$GITHUB_REF_NAME'. Jalankan workflow dari branch yang berisi file itu."; exit 1; }
          [ "$P" = susfs_patch_to_4.19.patch ] || cp "$P" susfs_patch_to_4.19.patch
          H="$(ls susfs_inline_hook_patches.sh* 2>/dev/null | head -n1)"
          if [ -n "$H" ]; then
            [ "$H" = susfs_inline_hook_patches.sh ] || cp "$H" susfs_inline_hook_patches.sh
          else
            echo "script hook tidak ada di repo, nanti diambil dari $JACK_REPO ($JACK_BRANCH)"
          fi
          echo "patch=$P hook=${H:-<dari JackA1ltman>}"
          echo "hook_mode=$HOOK_MODE ksu_ref=$KSU_REF jack_latest=$JACK_LATEST"
          case "$HOOK_MODE" in branch_link|tamper) ;; *) echo "::error::hook_mode tidak valid: $HOOK_MODE"; exit 1;; esac

      - name: Paket build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio zip zstd lz4 xz-utils \
            patch python3 git curl wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache

      - name: Neutron clang
        run: |
          mkdir -p "$HOME/neutron" && cd "$HOME/neutron"
          bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
          "$HOME/neutron/bin/clang" --version | head -n 1

      - name: Clone kernel LunarKnight
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" lk
          head -n 5 lk/Makefile
          cat lk/localversion-st
          test -f "lk/arch/arm64/configs/$DEFCONFIG" || { echo "::error::defconfig $DEFCONFIG tidak ada"; exit 1; }

      - name: Integrasi KernelSU manipvlator (metode syscall)
        working-directory: lk
        run: |
          [[ "$KSU_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::ksu_ref tidak valid"; exit 1; }
          # kernel harus bersih dari hook KSU lama (README manipvlator: remove all manual hooks)
          if grep -rnE 'ksu_handle|CONFIG_KSU' fs kernel security mm drivers/input --include='*.c' --include='*.h' | head -n 20 | grep .; then
            echo "::error::sumber kernel masih punya hook/refrensi KSU lama (daftar di atas), bersihkan dulu"; exit 1
          fi
          grep -n 'KSU' "arch/arm64/configs/$DEFCONFIG" || echo "(defconfig bersih dari KSU)"
          curl -fsSL "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s "$KSU_REF"
          test -d KernelSU/kernel || { echo "::error::KernelSU/kernel tidak ada"; exit 1; }
          test -L drivers/kernelsu || { echo "::error::symlink drivers/kernelsu tidak ada"; exit 1; }
          [ "$(grep -c 'kernelsu' drivers/Makefile)" = 1 ] || { echo "::error::drivers/Makefile: entri kernelsu harus tepat satu"; grep -n kernelsu drivers/Makefile; exit 1; }
          [ "$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig)" = 1 ] || { echo "::error::drivers/Kconfig: source kernelsu harus tepat satu"; grep -n kernelsu drivers/Kconfig; exit 1; }
          echo "KSU_COMMIT=$(git -C KernelSU rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KernelSU manipvlator: $(git -C KernelSU log -1 --format='%h %cd %s')"
          echo "---- isi KernelSU/kernel ----"; ls KernelSU/kernel

      - name: Patch SUSFS (4.19)
        working-directory: lk
        run: |
          mkdir -p ../glue
          cat > ../glue/fix_rejects.py <<'FIX_REJECTS_PY_EOF'
          #!/usr/bin/env python3
          """Finish the SUSFS 4.19 patch (v2.4.0) on a tree that is slightly different from the one
          the patch was made on.

          Only a few known hunks are re-applied here (include / declaration hunks and one anchored
          hunk that hooks the mount allocator: vfs_kern_mount() on a plain 4.19 tree, vfs_create_mount()
          on a tree that has the fs_context mount API backported). Every rejected hunk is classified by its own content, not by a
          counter or by a marker that may also come from another hunk (v2.4.0 uses the label
          `bypass_orig_flow:` in several functions of fs/namespace.c). Any hunk that is not known
          aborts the build and prints the hunk.
          Run from the kernel root right after `patch -p1`.
          """
          import os, re, subprocess, sys


          def die(m):
              print("::error::" + m)
              sys.exit(1)


          def rd(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def wr(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def once(s, old, new, what):
              n = s.count(old)
              if n != 1:
                  die(f"{what}: anchor {old.strip()[:60]!r} found {n} times (need 1)")
              return s.replace(old, new)


          INC_DEF = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n"

          # Where does a new (non-clone) mount get its struct mount? That is the function the SUSFS
          # "mnt = alloc_vfsmnt(name)" hunk has to go into, and it depends on the tree:
          #   - plain 4.19  : vfs_kern_mount() calls alloc_vfsmnt(name) itself (what the 4.19 patch assumes)
          #   - fs_context  : (backported from 5.1+, as in LunarKnight) vfs_kern_mount() only wraps
          #                   fs_context_for_mount()/fc_mount(); alloc_vfsmnt(fc->source ?: "none") lives in
          #                   vfs_create_mount(). This is the same place the official SUSFS 5.4 patch hooks.
          # The function is chosen by looking at which one really contains the alloc_vfsmnt() call, so the
          # hook is never put in a function that does not allocate the mount.
          MNT_SITES = (
              ("vfs_kern_mount", r"(?m)^(?:struct vfsmount \*)?\n?vfs_kern_mount\(struct file_system_type \*type,\s*int flags,\s*const char \*name,\s*void \*data\)\n"
                                 r"\{\n(.*?)^\}\n"),
              ("vfs_create_mount", r"(?m)^struct vfsmount \*vfs_create_mount\(struct fs_context \*fc\)\n"
                                   r"\{\n(.*?)^\}\n"),
          )
          ALLOC_RE = (r"\tmnt = alloc_vfsmnt\((?P<arg>[^;\n]+)\);\n"
                      r"\tif \(!mnt\)\n\t\treturn ERR_PTR\(-ENOMEM\);\n")


          def mnt_alloc_site(s):
              """-> (function name, regex match of its body). The one function that calls alloc_vfsmnt()."""
              found = []
              for name, rx in MNT_SITES:
                  m = re.search(rx, s, re.S)
                  if m and "alloc_vfsmnt(" in m.group(1):
                      found.append((name, m))
              if len(found) != 1:
                  die("fs/namespace.c: expected exactly one of vfs_kern_mount()/vfs_create_mount() to call "
                      "alloc_vfsmnt(), found: " + (", ".join(n for n, _ in found) or "none"))
              return found[0]
          # ---- re-appliers: idempotent, each one checks its own result in its own scope ------------
          def fix_ns_include():
              p = "fs/namespace.c"
              s = rd(p)
              if "<linux/susfs_def.h>" in s:
                  return
              s = once(s, '#include "pnode.h"\n', INC_DEF + '\n#include "pnode.h"\n', p)
              s = once(s, '#include "internal.h"\n',
                       '#include "internal.h"\n\n'
                       '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                       'extern bool susfs_is_current_ksu_domain(void);\n'
                       'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n'
                       '#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n\n'
                       '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n', p)
              wr(p, s)


          def fix_ns_mount_alloc():
              p = "fs/namespace.c"
              s = rd(p)
              fn, m = mnt_alloc_site(s)
              body = m.group(1)
              if "susfs_alloc_non_unshare_ksu_vfsmnt" in body:
                  return
              am = list(re.finditer(ALLOC_RE, body))
              if len(am) != 1:
                  die(f"{p}: {fn}(): alloc_vfsmnt() anchor not found ({len(am)} matches)")
              arg = am[0].group("arg")                       # "name" or 'fc->source ?: "none"'
              sus_arg = arg if "?:" in arg else arg + ' ?: "none"'
              new = ("#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                     "\t// - We will just stop checking for ksu process if /sdcard/Android is accessible,\n"
                     "\t//   for the sake of performance\n"
                     "\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n"
                     "\t\tif (susfs_is_current_ksu_domain()) {\n"
                     f"\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt({sus_arg});\n"
                     "\t\t\tgoto bypass_orig_flow;\n"
                     "\t\t}\n"
                     "\t}\n"
                     "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n"
                     f"\tmnt = alloc_vfsmnt({arg});\n\n"
                     "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                     "bypass_orig_flow:\n"
                     "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                     "\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);\n")
              body = body[:am[0].start()] + new + body[am[0].end():]
              s = s[:m.start(1)] + body + s[m.end(1):]
              wr(p, s)
              print(f"  mount allocation hook placed in {fn}()")
          def fix_cmdline():
              p = "fs/proc/cmdline.c"
              s = rd(p)
              if "susfs_spoof_cmdline_or_bootconfig" in s:
                  return
              s = once(s, "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n",
                       "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                       "extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n"
                       "extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n"
                       "#endif\n\n"
                       "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n"
                       "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                       "\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n"
                       "\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n"
                       "\t\tseq_putc(m, '\\n');\n"
                       "\t\treturn 0;\n"
                       "\t}\n"
                       "#endif\n", p)
              wr(p, s)


          def fix_task_mmu_include():
              p = "fs/proc/task_mmu.c"
              s = rd(p)
              if "<linux/susfs_def.h>" in s:
                  return
              inc = ("#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                     "#include <linux/susfs_def.h>\n"
                     "#endif // #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n")
              s = once(s, "#include <asm/elf.h>\n", inc + "\n#include <asm/elf.h>\n", p)
              wr(p, s)


          def fix_super_include():
              p = "fs/super.c"
              s = rd(p)
              if "<linux/susfs_def.h>" in s:
                  return
              s = once(s, '#include "internal.h"\n',
                       INC_DEF + '#include "internal.h"\n\n'
                       '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                       'extern bool susfs_is_current_ksu_domain(void);\n'
                       'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n'
                       '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n', p)
              wr(p, s)


          # ---- defects in the patch file itself (they are NOT rejected hunks, so they are fixed on every run) ----
          def fix_stat():
              """susfs_patch_to_4.19.patch (v2.4.0) edits fs/stat.c but never includes <linux/susfs_def.h>, which
              defines STATX_SUS_KSTAT / STATX_SUS_KSTAT_FUSE and susfs_is_current_app_uid(). Result: fs/stat.o fails
              ("use of undeclared identifier 'STATX_SUS_KSTAT'"), and susfs_is_current_app_uid() was only an
              implicit declaration that the old -Wno-implicit-function-declaration flag silently swallowed.
              Two more defects in the same code are fixed here:
                - the `if (!is_fuse)` block has no `else`, so a normal inode also got the FUSE marker;
                - the internal marker bits are or'ed into stat->result_mask, and cp_statx() copies result_mask
                  straight into stx_mask, so statx() would hand the SUSFS marker bits to userspace (a detectable leak)."""
              p = "fs/stat.c"
              s = rd(p)
              if "<linux/susfs_def.h>" not in s:
                  s = once(s, "#include <asm/unistd.h>\n",
                           "#include <asm/unistd.h>\n\n"
                           "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                           "#include <linux/susfs_def.h>\n"
                           "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n", p)
              old = ("\t\t\tif (!is_fuse) {\n"
                     "\t\t\t\t// stat->mnt_id = real_mount(path->mnt)->mnt_id;\n"
                     "\t\t\t\t// only for 5.10 kernel\n"
                     "\t\t\t\tstat->result_mask |= STATX_SUS_KSTAT;\n"
                     "\t\t\t}\n"
                     "\t\t\t// stat->mnt_id = real_mount(path->mnt)->mnt_id;\n"
                     "\t\t\t// only for 5.10 kernel\n"
                     "\t\t\tstat->result_mask |= STATX_SUS_KSTAT_FUSE;\n")
              new = ("\t\t\tif (!is_fuse)\n"
                     "\t\t\t\tstat->result_mask |= STATX_SUS_KSTAT;\n"
                     "\t\t\telse\n"
                     "\t\t\t\tstat->result_mask |= STATX_SUS_KSTAT_FUSE;\n")
              if old in s:
                  s = once(s, old, new, p)
              elif new not in s:
                  die(p + ": vfs_getattr_nosec() SUS_KSTAT block is neither the original nor the fixed form")
              if "~(STATX_SUS_KSTAT | STATX_SUS_KSTAT_FUSE)" not in s:
                  s = once(s, "\ttmp.stx_mask = stat->result_mask;\n",
                           "\ttmp.stx_mask = stat->result_mask;\n"
                           "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                           "\t/* internal SUSFS markers must never reach userspace */\n"
                           "\ttmp.stx_mask &= ~(STATX_SUS_KSTAT | STATX_SUS_KSTAT_FUSE);\n"
                           "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n", p)
              wr(p, s)
              print("  fs/stat.c: include + else + stx_mask scrub applied")


          INC_HUNK = r"(?m)^\+#include <linux/susfs_def\.h>"
          KNOWN = {
              "fs/namespace.c": [(INC_HUNK, fix_ns_include),
                                 (r"(?m)^\+.*susfs_alloc_non_unshare_ksu_vfsmnt\((?:name|fc->source)", fix_ns_mount_alloc)],
              "fs/proc/cmdline.c": [(r"susfs_spoof_cmdline_or_bootconfig", fix_cmdline)],
              "fs/proc/task_mmu.c": [(INC_HUNK, fix_task_mmu_include)],
              "fs/super.c": [(INC_HUNK, fix_super_include)],
          }

          rejs = subprocess.run(["find", ".", "-name", "*.rej"], capture_output=True, text=True).stdout.split()
          rejs = sorted(p[2:-4] if p.startswith("./") else p[:-4] for p in rejs)
          print("rejected files:", rejs or "none")

          for f in rejs:
              if f not in KNOWN:
                  print(rd(f + ".rej"))
                  die(f"unexpected reject in {f}")
              hunks = [h for h in re.split(r"(?m)^(?=@@ )", rd(f + ".rej")) if h.startswith("@@ ")]
              todo = []
              for h in hunks:
                  for pat, fn in KNOWN[f]:
                      if re.search(pat, h):
                          if fn not in todo:
                              todo.append(fn)
                          break
                  else:
                      print(h)
                      die(f"{f}: rejected hunk is not one of the known ones (see above)")
              for fn in todo:
                  fn()
                  print(f"re-applied {fn.__name__} ({f})")
              os.remove(f + ".rej")
              if os.path.exists(f + ".orig"):
                  os.remove(f + ".orig")

          fix_stat()

          # ---- final consistency check (each marker is checked in its own scope) ------------------
          ns = rd("fs/namespace.c")
          for m in ("<linux/susfs_def.h>", "#define CL_COPY_MNT_NS", "susfs_alloc_non_unshare_ksu_vfsmnt(const char *name)",
                    "susfs_alloc_unshare_ksu_vfsmnt(const char *name, int old_mnt_id)"):
              if m not in ns:
                  die(f"fs/namespace.c: missing {m!r} after fix")
          fn, mm = mnt_alloc_site(ns)
          for m in ("susfs_alloc_non_unshare_ksu_vfsmnt(", "susfs_is_current_ksu_domain()", "bypass_orig_flow:", "alloc_vfsmnt("):
              if m not in mm.group(1):
                  die(f"fs/namespace.c: {fn}() is missing {m!r} after fix")
          if mm.group(1).index("bypass_orig_flow:") < mm.group(1).index("alloc_vfsmnt("):
              die(f"fs/namespace.c: {fn}(): bypass_orig_flow label is before alloc_vfsmnt()")
          if "susfs_is_current_ksu_domain()" not in re.search(r"(?m)^static int mnt_alloc_group_id\(.*?^\}\n", ns, re.S | re.M).group(0):
              die("fs/namespace.c: mnt_alloc_group_id() hunk missing")
          checks = {
              "fs/proc/cmdline.c": ["susfs_spoof_cmdline_or_bootconfig"],
              "fs/proc/task_mmu.c": ["<linux/susfs_def.h>"],
              "fs/super.c": ["<linux/susfs_def.h>", "susfs_is_current_ksu_domain"],
              "fs/stat.c": ["<linux/susfs_def.h>", "~(STATX_SUS_KSTAT | STATX_SUS_KSTAT_FUSE)", "\t\t\telse\n\t\t\t\tstat->result_mask |= STATX_SUS_KSTAT_FUSE;"],
          }
          for f, marks in checks.items():
              s = rd(f)
              for m in marks:
                  if m not in s:
                      die(f"{f}: missing {m!r} after fix")
          print("SUSFS patch completed (rejects re-applied: %s)" % (", ".join(rejs) or "none"))
          FIX_REJECTS_PY_EOF
          set +e
          patch -p1 --no-backup-if-mismatch < ../susfs_patch_to_4.19.patch 2>&1 | tee ../patch.log
          set -e
          # `patch` is allowed to reject hunks (fix_rejects.py re-applies the known ones), but every
          # other failure mode (file missing, already applied, corrupt patch) must stop the build here
          if grep -qE 'No file to patch|Skipping patch|Reversed \(or previously applied\)|malformed patch|can.t find file' ../patch.log; then
            echo "::error::patch gagal bukan karena hunk ditolak (file tidak ada / sudah terpasang / patch rusak):"
            grep -nE 'No file to patch|Skipping patch|Reversed \(or previously applied\)|malformed patch|can.t find file' ../patch.log
            exit 1
          fi
          python3 ../glue/fix_rejects.py
          test -z "$(find . -name '*.rej')" || { echo "::error::masih ada hunk yang ditolak"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          test -f include/linux/susfs.h && test -f include/linux/susfs_def.h
          # tampilan varian SUSFS di manager: "NON-GKI" -> "GKI"
          sed -i 's/"NON-GKI"/"GKI"/g' include/linux/susfs.h
          if grep -rq 'NON-GKI' include/linux/susfs.h fs/susfs.c; then echo "::error::teks NON-GKI masih ada"; exit 1; fi
          grep -q 'define SUSFS_VARIANT "GKI"' include/linux/susfs.h || { echo "::error::SUSFS_VARIANT tidak berubah"; exit 1; }
          SUSFS_VER="$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h | head -n1)"
          [ -n "$SUSFS_VER" ] || { echo "::error::SUSFS_VERSION tidak terbaca dari susfs.h"; exit 1; }
          [ "$SUSFS_VER" = "$SUSFS_EXPECT_VER" ] || { echo "::error::versi SUSFS di patch = $SUSFS_VER, diharapkan $SUSFS_EXPECT_VER (cek isi susfs_patch_to_4.19.patch di repo)"; exit 1; }
          echo "SUSFS_VER=$SUSFS_VER" >> "$GITHUB_ENV"
          echo "SUSFS versi dari patch: $SUSFS_VER"

      - name: Preflight kontrak driver manipvlator dan SUSFS
        working-directory: lk
        run: |
          set -o pipefail
          python3 - <<'PYEOF' 2>&1 | tee ../preflight.log
          import os, re, sys

          KS = "KernelSU/kernel"
          MODE = os.environ["HOOK_MODE"]

          def rd(p):
              with open(p, encoding="utf-8", errors="replace") as f:
                  return f.read()

          files = {}
          for root, _, fns in os.walk(KS):
              for fn in fns:
                  p = os.path.join(root, fn)
                  files[p] = rd(p)
          kcfg = "\n".join(s for p, s in files.items() if os.path.basename(p).startswith("Kconfig"))
          code = {p: s for p, s in files.items() if p.endswith((".c", ".h"))}
          alltxt = "\n".join(code.values())
          errors, warns = [], []

          def declared(sym):
              return re.search(r"(?m)^[ \t]*config[ \t]+%s[ \t]*$" % re.escape(sym), kcfg) is not None

          def func_def(name):
              # -> (ada definisi, ada definisi non-static)
              pat = re.compile(r"(?m)^([^\n;{}()=#]*?)\b%s[ \t]*\(([^;{}]*)\)[ \t]*\n?[ \t]*\{" % re.escape(name))
              found = nonstatic = False
              for s in code.values():
                  for m in pat.finditer(s):
                      found = True
                      pre = m.group(1)
                      if not pre.strip():
                          pre = s[:m.start()].rstrip("\n").rsplit("\n", 1)[-1]
                      if "static" not in pre:
                          nonstatic = True
              return found, nonstatic

          def var_def(name):
              pat = re.compile(r"(?m)^([^\n;(){}=#]*?)\b%s\b(?:[ \t]+__\w+(?:\([^)]*\))?)*[ \t]*(?:=[^;]*)?;" % re.escape(name))
              for s in code.values():
                  for m in pat.finditer(s):
                      pre = m.group(1)
                      if pre.strip() and not re.search(r"\b(static|extern|return)\b", pre):
                          return True
              return False

          SUSFS10 = ["KSU_SUSFS_SUS_PATH", "KSU_SUSFS_SUS_MOUNT", "KSU_SUSFS_SUS_KSTAT", "KSU_SUSFS_SPOOF_UNAME",
                     "KSU_SUSFS_ENABLE_LOG", "KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG", "KSU_SUSFS_OPEN_REDIRECT",
                     "KSU_SUSFS_SUS_MAP", "KSU_SUSFS_PRIORITY_UID_FILTER", "KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS"]
          MODE_SYM = {"branch_link": "KSU_HACK_ARM64_BRANCH_LINK", "tamper": "KSU_TAMPER_SYSCALL_TABLE"}[MODE]

          # 1) Kconfig driver: 10 fitur SUSFS + metode hook harus dideklarasikan driver
          for sym in ["KSU", "KSU_SUSFS"] + SUSFS10 + [MODE_SYM]:
              if not declared(sym):
                  errors.append("Kconfig driver tidak mendeklarasikan CONFIG_%s" % sym)

          # 2) simbol sisi KernelSU yang dibutuhkan patch SUSFS (fs/susfs.c, avc.c, namespace.c, super.c)
          for fn in ("susfs_is_current_ksu_domain", "setup_selinux"):
              found, ns = func_def(fn)
              if not ns:
                  errors.append("driver tidak mendefinisikan %s() non-static (%s)" % (fn, "ada tapi static" if found else "tidak ditemukan"))
          for v in ("ksu_cred", "susfs_ksu_sid", "susfs_priv_app_sid"):
              if not var_def(v):
                  errors.append("driver tidak mendefinisikan variabel global non-static %s" % v)

          # 3) semua perintah supercall SUSFS dari susfs_def.h harus ditangani driver
          # perintah yang ditandai /* deprecated */ di susfs_def.h (sus_su, sus_mount, try_umount, dst.) memang sudah
          # dihapus dari SUSFS v2.4.0 dan tidak dipakai driver, jadi tidak diwajibkan
          allc = re.findall(r"(?m)^#define[ \t]+(CMD_SUSFS_\w+)(.*)$", rd("include/linux/susfs_def.h"))
          cmds = sorted(set(n for n, rest in allc if "deprecated" not in rest))
          skipped = sorted(set(n for n, rest in allc if "deprecated" in rest))
          if not cmds:
              errors.append("tidak ada CMD_SUSFS_* di include/linux/susfs_def.h (patch SUSFS salah?)")
          missing = [c for c in cmds if not re.search(r"\b%s\b" % c, alltxt)]
          if missing:
              errors.append("driver tidak menangani perintah SUSFS (fiturnya tidak akan aktif): " + ", ".join(missing))

          # 4) driver harus memanggil SUSFS pada titik-titik yang benar
          for pat, desc in [
              (r"\bsusfs_init\s*\(", "susfs_init() dipanggil saat init KernelSU"),
              (r"\bsusfs_start_sdcard_monitor_fn\b", "susfs_start_sdcard_monitor_fn() dipanggil setelah post-fs-data"),
              (r"\bSUSFS_MAGIC\b", "supercall reboot() mengenali SUSFS_MAGIC"),
              (r"\bsusfs_set_current_proc_no_su\b|\bsusfs_set_current_proc_umounted\b", "state per-proses SUSFS di jalur setuid"),
              (r"\bsusfs_parse_priority_app_strings\b", "sinkron uid priority filter (susfs_parse_priority_app_strings)"),
          ]:
              if not re.search(pat, alltxt):
                  errors.append("driver tidak punya: " + desc)

          # 5) ksu_hide_setprocattr (dipakai script hook kalau ada)
          f, ns = func_def("ksu_hide_setprocattr")
          if f and not ns:
              errors.append("ksu_hide_setprocattr() di driver static, tidak bisa dipanggil dari security/selinux/hooks.c")

          # 6) hook input: manual hook tidak dipasang oleh yml ini
          if re.search(r"\bksu_handle_input_handle_event\b", alltxt) and not re.search(r"\binput_register_handler\b", alltxt):
              warns.append("driver butuh manual hook input (ksu_handle_input_handle_event) tapi tidak punya input_handler: deteksi safe mode volume tidak jalan")

          # 7) file yang aman di-hook script JackA1ltman pada mode syscall
          hook_files = ["security/selinux/hooks.c"]
          lsm = re.search(r"task_fix_setuid|ksu_lsm_hook_init|security_add_hooks|LSM_HOOK_INIT", alltxt)
          sr3 = re.search(r"(?m)^[^\n;{}()=#]*\bksu_handle_setresuid[ \t]*\([ \t]*uid_t[ \t]+\w+[ \t]*,[ \t]*uid_t[ \t]+\w+[ \t]*,[ \t]*uid_t[ \t]+\w+[ \t]*\)[ \t]*\n?[ \t]*\{", alltxt)
          if sr3 and not lsm:
              hook_files.append("kernel/sys.c")
          elif not lsm and not sr3:
              warns.append("sumber event setuid driver tidak terdeteksi (tidak ada LSM hook maupun ksu_handle_setresuid 3 argumen)")

          print("mode hook      :", MODE, "(CONFIG_%s)" % MODE_SYM)
          print("perintah SUSFS :", len(cmds), "aktif diwajibkan,", len(skipped), "deprecated dilewati")
          print("file hook      :", " ".join(hook_files))
          for w in warns:
              print("::warning::" + w)
          if errors:
              print("---- semua baris 'susfs' di driver (diagnostik) ----")
              n = 0
              for p in sorted(files):
                  for i, l in enumerate(files[p].splitlines(), 1):
                      if re.search("susfs", l, re.I):
                          print("%s:%d:%s" % (p, i, l.strip()[:160])); n += 1
                          if n >= 250: break
                  if n >= 250: break
              print("---- file driver ----")
              for p in sorted(files): print(p)
              for e in errors:
                  print("::error::" + e)
              sys.exit(1)
          print("OK preflight: driver manipvlator cocok dengan SUSFS", os.environ.get("SUSFS_VER", "?"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("HOOK_FILES=" + " ".join(hook_files) + "\n")
          PYEOF

      - name: Hook JackA1ltman (hanya yang tidak bentrok dengan metode syscall)
        working-directory: lk
        run: |
          HS="$GITHUB_WORKSPACE/susfs_inline_hook_patches.sh"
          if [ ! -f "$HS" ] || [ "$JACK_LATEST" = true ]; then
            rm -rf ../jack
            git clone --depth=1 -b "$JACK_BRANCH" "$JACK_REPO" ../jack
            HS2="$(find ../jack -type f -name susfs_inline_hook_patches.sh | head -n1)"
            [ -n "$HS2" ] || { echo "::error::susfs_inline_hook_patches.sh tidak ada di $JACK_REPO ($JACK_BRANCH)"; exit 1; }
            HS="$(realpath "$HS2")"
            echo "script hook dari JackA1ltman mainline: $(git -C ../jack log -1 --format='%h %cd')"
          fi
          echo "script hook : $HS"
          echo "file di-hook: $HOOK_FILES  (fs/exec, open, stat, read_write, input, reboot sengaja dilewati: sudah ditangani metode $HOOK_MODE)"
          python3 - "$HS" ../hook_trim.sh <<'PYEOF'
          import os, re, sys
          src, dst = sys.argv[1], sys.argv[2]
          s = open(src, encoding="utf-8").read()
          files = os.environ["HOOK_FILES"].split()
          new = "patch_files=(\n" + "".join("    %s\n" % f for f in files) + ")"
          s2, n = re.subn(r"patch_files=\(.*?\n\)", lambda m: new, s, count=1, flags=re.S)
          if n != 1:
              print("::error::array patch_files tidak ditemukan di script hook"); sys.exit(1)
          open(dst, "w", encoding="utf-8").write(s2)
          PYEOF
          bash ../hook_trim.sh | tee ../hook.log
          for f in $HOOK_FILES; do
            grep -q "$f Patched" ../hook.log || { echo "::error::hook gagal di $f"; exit 1; }
          done
          if echo " $HOOK_FILES " | grep -q " kernel/sys.c "; then
            # the hook script writes pr_info("...()\\n") into kernel/sys.c, which prints a literal backslash-n
            sed -i 's|handle_setresuid()\\\\n");|handle_setresuid()\\n");|' kernel/sys.c
            grep -qF 'handle_setresuid()\n");' kernel/sys.c || { echo "::error::pr_info di kernel/sys.c tidak terkoreksi"; exit 1; }
            if grep -qF 'handle_setresuid()\\n' kernel/sys.c; then echo "::error::masih ada backslash ganda di kernel/sys.c"; exit 1; fi
          fi

      - name: NoMount (dev)
        working-directory: lk
        env:
          NM_BRANCH: ${{ github.event.inputs.nomount_branch || 'dev' }}
        run: |
          [[ "$NM_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::nama branch NoMount tidak valid"; exit 1; }
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/$NM_BRANCH/kernel/setup.sh" | bash -s "$NM_BRANCH"
          test -d fs/nomount && test -f fs/nomount/Kconfig
          grep -q nomount fs/Makefile && grep -q nomount fs/Kconfig
          # versi driver = jumlah commit repo NoMount (dibaca Makefile-nya lewat git), jadi klon harus lengkap
          cd NoMount
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch -q --unshallow --tags --force origin; fi
          [ "$(git rev-parse --abbrev-ref HEAD)" = "$NM_BRANCH" ] || { echo "::error::NoMount tidak berada di branch $NM_BRANCH"; exit 1; }
          NM_COUNT="$(git rev-list --count HEAD)"
          echo "NM_COUNT=$NM_COUNT" >> "$GITHUB_ENV"
          echo "NoMount $NM_BRANCH @ $(git log -1 --format='%h %cd')  ->  2.2.0-dev-$NM_COUNT (protokol driver 22)"
          if [ "$NM_BRANCH" = dev ] && [ "$NM_COUNT" -lt "$NOMOUNT_MIN_COMMITS" ]; then
            echo "::error::NoMount dev baru $NM_COUNT commit, diharapkan >= $NOMOUNT_MIN_COMMITS"; exit 1
          fi

      - name: Backport path_umount (kernel 4.19)
        working-directory: lk
        run: |
          python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path

          def die(m):
              print("::error::" + m)
              sys.exit(1)

          ns, ih = Path("fs/namespace.c"), Path("fs/internal.h")
          if not ns.is_file() or not ih.is_file():
              die("fs/namespace.c atau fs/internal.h tidak ditemukan")
          src = ns.read_text()

          def pat(n):
              return rf"(?m)^[ \t]*(?:static[ \t]+)?int[ \t]+{n}[ \t]*\([^;{{}}]*\)[ \t\r\n]*\{{"

          has_can = re.search(pat("can_umount"), src) is not None
          has_path = re.search(pat("path_umount"), src) is not None
          blocks = []
          if not has_can:
              blocks.append(r'''static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }''')
          if not has_path:
              blocks.append(r'''int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	/* Do not use path_put(): it would clear mnt_expiry_mark. */
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }''')

          if blocks:
              anchor = None
              if not has_can and has_path:
                  anchor = re.search(r"(?m)^int[ \t]+path_umount\s*\(", src)
              else:
                  for a in (r"(?m)^static bool is_mnt_ns_file\s*\(", r"(?m)^SYSCALL_DEFINE2\(umount,"):
                      anchor = re.search(a, src)
                      if anchor:
                          break
              if anchor is None:
                  die("anchor di fs/namespace.c tidak ditemukan")
              if "static int do_umount(" not in src or src.index("static int do_umount(") > anchor.start():
                  die("do_umount tidak ada sebelum titik sisip")
              src = src[:anchor.start()] + "\n".join(["\n".join(blocks), "", ""]) + src[anchor.start():]
              ns.write_text(src)
              print("[+] path_umount ditambahkan ke fs/namespace.c")

          for n in ("can_umount", "path_umount"):
              c = len(re.findall(pat(n), ns.read_text()))
              if c != 1:
                  die(f"definisi {n} harus tepat satu, ditemukan {c}")

          h = ih.read_text()
          proto = r"(?m)^int[ \t]+path_umount\s*\(struct path \*path, int flags\);\s*$"
          if not re.search(proto, h):
              m = re.search(r"(?m)^extern void __init mnt_init\(void\);\s*$", h)
              if m:
                  ih.write_text(h[:m.end()] + "\nint path_umount(struct path *path, int flags);" + h[m.end():])
              else:
                  print("[!] prototype tidak ditambahkan ke internal.h (tidak wajib untuk link)")
          print("[OK] path_umount siap")
          PYEOF
          grep -n "path_umount" fs/namespace.c | head

      - name: Konfigurasi kernel
        working-directory: lk
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          M="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "M=$M" >> "$GITHUB_ENV"
          make $M "$DEFCONFIG"
          decl() { grep -rhqE "^[[:space:]]*config[[:space:]]+$1[[:space:]]*$" KernelSU/kernel --include='Kconfig*'; }
          SUSFS10="KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP KSU_SUSFS_PRIORITY_UID_FILTER KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS"
          if [ "$HOOK_MODE" = tamper ]; then
            HOOK_ON=KSU_TAMPER_SYSCALL_TABLE; HOOK_OFF=KSU_HACK_ARM64_BRANCH_LINK
          else
            HOOK_ON=KSU_HACK_ARM64_BRANCH_LINK; HOOK_OFF=KSU_TAMPER_SYSCALL_TABLE
          fi
          REQ="KSU KSU_SUSFS $SUSFS10 $HOOK_ON"
          OPT="KSU_LSM_SECURITY_HOOKS KSU_FEATURE_SULOG KSU_FEATURE_ADBROOT KSU_EXTRAS"
          ARGS=()
          for c in $REQ; do ARGS+=(-e "$c"); done
          for c in $OPT; do if decl "$c"; then ARGS+=(-e "$c"); fi; done
          for c in "$HOOK_OFF" KSU_DEBUG KSU_KPROBES_KSUD; do if decl "$c"; then ARGS+=(-d "$c"); fi; done
          scripts/config --file out/.config --set-str LOCALVERSION "$LOCALVERSION_TAG" -d LOCALVERSION_AUTO \
             -e NOMOUNT -e KALLSYMS -d KPROBES -e TMPFS_XATTR -e TMPFS_POSIX_ACL "${ARGS[@]}"
          make $M olddefconfig
          fail=0
          for c in $REQ NOMOUNT KALLSYMS THREAD_INFO_IN_TASK; do
            grep -q "^CONFIG_$c=y" out/.config && echo "ok   CONFIG_$c=y" || { echo "::error::CONFIG_$c tidak aktif"; fail=1; }
          done
          for c in $OPT; do
            if decl "$c"; then
              grep -q "^CONFIG_$c=y" out/.config && echo "ok   CONFIG_$c=y" || { echo "::error::CONFIG_$c tidak aktif"; fail=1; }
            fi
          done
          for c in "$HOOK_OFF" KSU_DEBUG KSU_KPROBES_KSUD; do
            if grep -q "^CONFIG_$c=y" out/.config; then echo "::error::CONFIG_$c seharusnya mati"; fail=1; fi
          done
          grep -E '^CONFIG_(KPROBES|KRETPROBES)=y' out/.config && echo "::warning::KPROBES masih aktif (di-select opsi lain)" || true
          grep -q '^CONFIG_LOCALVERSION="-LunarKnight"' out/.config || { echo "::error::LOCALVERSION salah"; fail=1; }
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set' out/.config || { echo "::error::LOCALVERSION_AUTO aktif"; fail=1; }
          [ "$fail" = 0 ]

      - name: Build kernel
        working-directory: lk
        run: |
          export PATH="$HOME/neutron/bin:$PATH"
          # Old vendor 4.19 code trips three diagnostics that clang >= 16 treats as errors by default. They are
          # downgraded to warnings (-Wno-error=...), NOT silenced (-Wno-...): every occurrence stays in build.log,
          # and the next step fails the build if one of them points at SUSFS / KernelSU / NoMount code.
          # (The old -Wno-implicit-function-declaration hid a missing #include in fs/stat.c.)
          export KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types"
          set -o pipefail
          make $M -j"$(nproc)" Image.gz-dtb 2>&1 | tee ../build.log

      - name: Gerbang peringatan (SUSFS / KernelSU / NoMount harus bersih)
        run: |
          # ringkasan seluruh peringatan "berbahaya" dari kernel lama (informasi saja)
          grep -E 'warning: (implicit declaration of function|incompatible integer to pointer|incompatible pointer to integer|incompatible function pointer)' build.log \
            | sed -E 's/^[0-9T:.-]+Z //' | sort | uniq -c | sort -rn | head -n 40 > warn-summary.log || true
          echo "peringatan berbahaya di seluruh kernel: $(wc -l < warn-summary.log) jenis (lihat warn-summary.log)"
          # yang menyangkut kode kita: tidak boleh ada
          if grep -E 'warning: (implicit declaration of function|incompatible integer to pointer|incompatible pointer to integer|incompatible function pointer)' build.log \
               | grep -E "(fs/susfs\.c|include/linux/susfs|fs/nomount/|drivers/kernelsu/|KernelSU/kernel/)|function '(susfs|ksu|nomount)_|'(susfs|ksu|nomount)_" | tee ours.log | grep .; then
            echo "::error::peringatan fatal pada kode SUSFS/KernelSU/NoMount (di atas): deklarasi/include/tipe salah, harus diperbaiki, bukan disembunyikan"; exit 1
          fi
          # untuk file kernel yang disentuh patch SUSFS: peringatan implicit declaration soal simbol susfs_* = include hilang
          if grep -E "implicit declaration of function '(susfs|ksu|nomount)_" build.log | grep .; then
            echo "::error::ada pemanggilan fungsi susfs_/ksu_/nomount_ tanpa deklarasi (include hilang)"; exit 1
          fi
          echo "OK: tidak ada deklarasi implisit / salah tipe pada kode SUSFS, KernelSU, NoMount"

      - name: Verifikasi hasil build
        working-directory: lk
        run: |
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $REL"
          [ "$REL" = "$EXPECT_RELEASE" ] || { echo "::error::nama kernel salah: $REL"; exit 1; }
          test -s out/arch/arm64/boot/Image.gz-dtb
          find out/drivers/kernelsu -name '*.o' 2>/dev/null | head -n 3 | grep -q . || { echo "::error::driver kernelsu tidak ikut terkompilasi"; exit 1; }
          "$HOME/neutron/bin/llvm-nm" out/vmlinux > "$RUNNER_TEMP/syms.txt"
          # entry point 10 fitur SUSFS + simbol sisi KernelSU yang dipakai patch
          for s in susfs_init susfs_add_sus_path susfs_add_sus_path_loop susfs_set_hide_sus_mnts_for_non_su_procs \
                   susfs_add_sus_kstat susfs_update_sus_kstat susfs_set_uname susfs_enable_log \
                   susfs_set_cmdline_or_bootconfig susfs_add_open_redirect susfs_add_sus_map \
                   susfs_set_priority_uid_filter susfs_is_priority_uid_filtered susfs_parse_priority_app_strings \
                   susfs_set_avc_log_spoofing susfs_start_sdcard_monitor_fn \
                   susfs_is_current_ksu_domain setup_selinux ksu_cred susfs_ksu_sid path_umount; do
            grep -qw "$s" "$RUNNER_TEMP/syms.txt" || { echo "::error::simbol $s tidak ada di vmlinux"; exit 1; }
          done
          strings -a -n 3 out/vmlinux > "$RUNNER_TEMP/vm.str"
          grep -aqF "version: $SUSFS_VER" "$RUNNER_TEMP/vm.str" && echo "versi SUSFS di vmlinux: $SUSFS_VER (ok)" \
            || echo "::warning::string versi SUSFS $SUSFS_VER tidak terdeteksi di vmlinux (versi sudah diverifikasi dari patch)"
          grep -qx 'GKI' "$RUNNER_TEMP/vm.str" && echo "varian SUSFS: GKI (ok)" || echo "::warning::string GKI tidak terdeteksi terpisah (header sudah diverifikasi saat patch)"
          if grep -qx 'NON-GKI' "$RUNNER_TEMP/vm.str"; then echo "::warning::string NON-GKI ada di vmlinux (mungkin dari driver KernelSU)"; fi
          test -f out/fs/nomount/nomount.o || { echo "::error::fs/nomount tidak ikut terkompilasi"; exit 1; }
          if ! strings -a out/fs/nomount/nomount.o | grep -qxF "22 ($NM_COUNT)"; then
            echo "::error::versi NoMount di objek tidak sama dengan 22 ($NM_COUNT)"; strings -a out/fs/nomount/nomount.o | grep -E '^22( |$)' | head; exit 1
          fi
          echo "NoMount di kernel: 22 ($NM_COUNT) = 2.2.0-dev-$NM_COUNT"
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Paket AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE ak3/patch ak3/ramdisk ak3/modules
          cp lk/out/arch/arm64/boot/Image.gz-dtb ak3/
          cat > ak3/anykernel.sh <<'ANYKERNEL_EOF'
          #!/sbin/sh
          # AnyKernel3 - LunarKnight / Xiaomi Redmi Note 5 Pro (whyred)
          properties() { '
          kernel.string=4.19.325-st20-LunarKnight by Shirakumo@Github
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # whyred: non A/B, Image.gz-dtb (DTB attached), boot partition
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "4.19.325-st20-LunarKnight (whyred)";
          ui_print "KernelSU manipvlator (@HOOK@) + SUSFS @SUSFS_VER@ + NoMount @NM_COUNT@";
          ui_print "by Shirakumo@Github";

          split_boot;
          flash_boot;
          ANYKERNEL_EOF
          sed -i "s/@SUSFS_VER@/$SUSFS_VER/; s/@NM_COUNT@/2.2.0-dev-$NM_COUNT/; s/@HOOK@/$HOOK_MODE/" ak3/anykernel.sh
          cd ak3
          ZIP="LunarKnight-whyred-4.19.325-st20-KSU-SUSFS-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP" . -x '*.git*'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unggah zip
        uses: actions/upload-artifact@v6
        with:
          name: LunarKnight-whyred
          path: ${{ env.ZIP }}

      - name: Unggah log dan config
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            preflight.log
            build.log
            warn-summary.log
            ours.log
            hook.log
            patch.log
            lk/out/.config
            lk/**/*.rej
          if-no-files-found: ignore
